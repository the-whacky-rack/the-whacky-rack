<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — The Whacky Rack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg:#f7f5ef; --text:#202020; --muted:#777;
    --accent:#ff5a36; --accent-dark:#e84625;
    --border:#e8e4dc; --pill:#fff0eb;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:Arial,Helvetica,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }
  header {
    background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:1000;
  }
  .header-inner {
    max-width:1250px; margin:auto; padding:16px 22px;
    display:flex; align-items:center; justify-content:space-between;
    gap:20px;
  }
  .logo { font-size:25px; font-weight:900; letter-spacing:-1px; color:inherit; text-decoration:none; }
  .logo span { color:var(--accent); }
  .header-right { display:flex; align-items:center; gap:12px; }
  .nav-link {
    font-size:13px; font-weight:700; padding:8px 14px;
    border-radius:50px; border:1px solid var(--border);
    background:#fff; color:inherit; text-decoration:none; transition:.2s ease;
  }
  .nav-link:hover { border-color:#bbb; }

  .wrap {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:60px 22px; text-align:center;
  }
  .inner { max-width:520px; }
  .emoji { font-size:80px; line-height:1; margin-bottom:14px; }
  h1 {
    margin:0 0 12px; font-size:clamp(36px,6vw,56px);
    letter-spacing:-2px; font-weight:950; line-height:1;
  }
  h1 span { color:var(--accent); }
  p { color:#555; font-size:16px; line-height:1.7; margin:0 0 24px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn {
    display:inline-block; padding:13px 24px; border-radius:50px;
    font-weight:800; font-size:13px; text-decoration:none;
    transition:.2s ease; border:1px solid transparent;
  }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:var(--accent-dark); border-color:var(--accent-dark); }
  .btn-ghost { background:#fff; color:var(--text); border-color:var(--border); }
  .btn-ghost:hover { border-color:#bbb; }

  @media (max-width:600px) {
    .header-inner { padding:13px 15px; flex-wrap:wrap; }
    .logo { font-size:21px; }
    .nav-link { font-size:11px; padding:7px 11px; }
    .emoji { font-size:64px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">The <span>Whacky</span> Rack</a>
    <div class="header-right">
      <a href="index.html" class="nav-link">Shop</a>
      <a href="world.html" class="nav-link">World</a>
      <a href="history.html" class="nav-link">History</a>
      <a href="about.html" class="nav-link">About</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="inner">
    <div class="emoji">🦆</div>
    <h1>Nothing <span>here</span>.</h1>
    <p>
      That page doesn't exist — or it was too weird and quietly removed itself.
      Try one of these instead.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">Back to the Shop</a>
      <a class="btn btn-ghost" href="yap.html">Yap it! Board</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
</body>
</html>
