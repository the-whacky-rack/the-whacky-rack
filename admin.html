<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderation — The Whacky Rack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg:#f7f5ef; --card:#fff; --text:#202020; --muted:#5a5a5a;
    --accent:#ff5a36; --accent-dark:#e84625;
    --border:#e8e4dc; --pill:#fff0eb;
    --shadow:0 8px 25px rgba(0,0,0,.06);
    --green:#16a34a; --red:#dc2626; --amber:#d97706;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
  a { color:inherit; text-decoration:none; }

  header { background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000; }
  .header-inner { max-width:1400px; margin:auto; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .logo { font-size:25px; font-weight:900; letter-spacing:-1px; white-space:nowrap; }
  .logo span { color:var(--accent); }
  .header-right { display:flex; align-items:center; gap:12px; }
  .nav-link { font-size:13px; font-weight:700; padding:8px 14px; border-radius:50px; border:1px solid var(--border); background:#fff; transition:.2s ease; white-space:nowrap; }
  .nav-link:hover { border-color:#bbb; }
  .nav-link.active { background:#222; color:#fff; border-color:#222; }

  .wrap { max-width:1400px; margin:auto; padding:28px 22px 70px; }

  .page-head { margin-bottom:22px; }
  .page-head .kicker { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .page-head h1 { margin:0 0 4px; font-size:32px; letter-spacing:-1px; font-weight:950; }
  .page-head h1 span { color:var(--accent); }
  .page-head p { margin:0; color:var(--muted); font-size:14px; }

  .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab-btn {
    border:1px solid var(--border); background:#fff; padding:11px 18px;
    border-radius:50px; font-family:inherit; font-weight:800; font-size:13px;
    cursor:pointer; color:var(--muted); transition:.2s ease;
  }
  .tab-btn:hover { border-color:#bbb; color:var(--text); }
  .tab-btn.active { background:#222; color:#fff; border-color:#222; }
  .tab-btn .count { display:inline-block; background:var(--pill); color:var(--accent-dark); padding:1px 8px; border-radius:20px; font-size:11px; font-weight:900; margin-left:6px; }
  .tab-btn.active .count { background:rgba(255,255,255,.2); color:#fff; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:16px; }

  .rep-row { padding:18px 22px; border-bottom:1px solid var(--border); }
  .rep-row:last-child { border-bottom:0; }
  .rep-head { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .rep-type { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; padding:4px 10px; border-radius:50px; background:#222; color:#fff; }
  .rep-type.yap { background:#ff5a36; }
  .rep-type.yap_comment { background:#ffa88d; }
  .rep-type.tape { background:#7c3aed; }
  .rep-type.tape_comment { background:#a78bfa; }
  .rep-type.profile { background:#0284c7; }
  .rep-time { font-size:11px; color:var(--muted); margin-left:auto; }
  .rep-preview { font-size:13px; line-height:1.6; color:#333; background:#fafafa; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:10px; white-space:pre-wrap; word-wrap:break-word; max-height:120px; overflow-y:auto; }
  .rep-preview em { color:var(--muted); font-style:italic; }
  .rep-meta { font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:10px; }
  .rep-meta strong { color:#555; font-weight:800; }
  .rep-reason { font-size:13px; color:#333; line-height:1.55; padding:10px 12px; background:#fff5f0; border-left:3px solid var(--accent); border-radius:6px; margin-bottom:12px; }
  .rep-actions { display:flex; gap:8px; flex-wrap:wrap; }

  .rep-btn { border:1px solid var(--border); background:#fff; padding:8px 16px; border-radius:50px; font-family:inherit; font-weight:800; font-size:12px; cursor:pointer; color:#444; transition:.2s ease; }
  .rep-btn:hover:not(:disabled) { border-color:#bbb; }
  .rep-btn.resolve { background:var(--green); border-color:var(--green); color:#fff; }
  .rep-btn.resolve:hover:not(:disabled) { background:#15803d; border-color:#15803d; }
  .rep-btn.remove { background:var(--red); border-color:var(--red); color:#fff; }
  .rep-btn.remove:hover:not(:disabled) { background:#b91c1c; border-color:#b91c1c; }
  .rep-btn.approve { background:var(--green); border-color:var(--green); color:#fff; }
  .rep-btn.approve:hover:not(:disabled) { background:#15803d; border-color:#15803d; }
  .rep-btn.reject { background:var(--red); border-color:var(--red); color:#fff; }
  .rep-btn.reject:hover:not(:disabled) { background:#b91c1c; border-color:#b91c1c; }
  .rep-btn.warn { background:var(--amber); border-color:var(--amber); color:#fff; }
  .rep-btn.warn:hover:not(:disabled) { background:#b45309; border-color:#b45309; }
  .rep-btn:disabled { opacity:.55; cursor:not-allowed; }

  .empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
  .empty .emoji { font-size:42px; margin-bottom:10px; }
  .empty strong { color:var(--text); display:block; font-size:17px; margin-bottom:6px; }

  .loading { text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }
  .err-card { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:20px 24px; border-radius:16px; font-size:14px; line-height:1.7; }
  .err-card h2 { margin:0 0 8px; font-size:20px; }
  .err-card a { color:#7f1d1d; font-weight:800; text-decoration:underline; }

  .log-row { display:grid; grid-template-columns: 140px 1fr 200px; gap:14px; padding:12px 20px; border-bottom:1px solid var(--border); align-items:center; font-size:12px; }
  .log-row:last-child { border-bottom:0; }
  .log-row .who { font-weight:800; color:var(--accent-dark); }
  .log-row .what { color:#333; }
  .log-row .when { color:var(--muted); text-align:right; }

  .vendor-row { padding:18px 22px; border-bottom:1px solid var(--border); cursor:pointer; transition:.15s ease; }
  .vendor-row:last-child { border-bottom:0; }
  .vendor-row:hover { background:#fafafa; }
  .vendor-head { display:flex; gap:12px; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap; }
  .vendor-logo { width:48px; height:48px; border-radius:12px; object-fit:cover; background:#f1eee8; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:24px; }
  .vendor-info { flex:1; min-width:200px; }
  .vendor-name { font-weight:900; font-size:16px; margin:0 0 2px; }
  .vendor-meta { font-size:12px; color:var(--muted); line-height:1.5; }
  .vendor-meta a { color:var(--accent-dark); font-weight:700; text-decoration:underline; }
  .status-pill { font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; padding:4px 10px; border-radius:50px; }
  .status-pill.pending { background:#fef3c7; color:#92400e; }
  .status-pill.approved { background:#dcfce7; color:#166534; }
  .status-pill.suspended { background:#fee2e2; color:#991b1b; }
  .status-pill.rejected { background:#f1eee8; color:#666; }
  .verified-pill { background:#dbeafe; color:#1e40af; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; padding:4px 10px; border-radius:50px; }
  .country-pill { background:#ede9fe; color:#5b21b6; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.5px; padding:4px 10px; border-radius:50px; }
  .vendor-stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--muted); }
  .vendor-stats .num { font-weight:800; color:#333; }
  .vendor-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .vendor-actions .rep-btn { padding:6px 12px; font-size:11px; }

  .product-row { padding:16px 22px; border-bottom:1px solid var(--border); display:flex; gap:14px; align-items:flex-start; }
  .product-row:last-child { border-bottom:0; }
  .product-row img { width:64px; height:64px; border-radius:10px; object-fit:cover; background:#f1eee8; flex-shrink:0; }
  .product-body { flex:1; min-width:0; }
  .product-name { font-weight:900; font-size:15px; margin:0 0 4px; }
  .product-meta { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:6px; }
  .product-meta .vendor { color:var(--accent-dark); font-weight:800; }
  .product-meta .link { color:#666; word-break:break-all; }

  .cat-row { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .cat-row:last-child { border-bottom:0; }
  .cat-name { font-weight:800; font-size:15px; flex:1; min-width:160px; }
  .cat-slug { font-family:ui-monospace,monospace; font-size:11px; color:#666; }
  .cat-sort { font-size:12px; color:var(--muted); }
  .cat-actions { display:flex; gap:6px; flex-wrap:wrap; }

  .cat-form { padding:20px 22px; background:#fafafa; border-bottom:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .cat-form label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); display:block; margin-bottom:4px; }
  .cat-form input { padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:13px; background:#fff; outline:none; }
  .cat-form input:focus { border-color:var(--accent); }
  .cat-form .field { display:flex; flex-direction:column; }
  .cat-form .field.grow { flex:1; min-width:180px; }

  .shop-toolbar {
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    padding:16px 22px; background:#fafafa;
    border-bottom:1px solid var(--border);
  }
  .shop-toolbar .grow { flex:1; min-width:200px; }
  .shop-toolbar input[type=search],
  .shop-toolbar select {
    padding:10px 12px; border:1px solid var(--border); border-radius:10px;
    font-family:inherit; font-size:13px; background:#fff; outline:none;
  }
  .shop-toolbar input[type=search]:focus,
  .shop-toolbar select:focus { border-color:var(--accent); }
  .shop-toolbar input[type=search] { width:100%; }

  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100000; align-items:center; justify-content:center; padding:20px; }
  .modal.open { display:flex; }
  .modal-inner { background:#fff; border-radius:20px; padding:28px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; animation:modalIn .18s ease-out; }
  @keyframes modalIn { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
  .modal-close { position:absolute; top:12px; right:12px; width:34px; height:34px; border:0; background:#f1eee8; border-radius:50%; font-size:20px; line-height:1; cursor:pointer; color:#555; display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .modal-close:hover { background:#e8e4dc; color:#222; }
  .modal h3 { margin:0 0 8px; font-size:22px; letter-spacing:-.3px; font-weight:900; }
  .modal h4 { margin:18px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
  .modal p { margin:0 0 10px; font-size:14px; line-height:1.65; color:#333; }
  .modal .modal-sub { font-size:13px; color:var(--muted); margin:0 0 16px; }
  .modal label { display:block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:#555; margin:14px 0 6px; }
  .modal label .optional { color:#aaa; font-weight:600; text-transform:none; letter-spacing:0; font-size:11px; }
  .modal input[type=text],
  .modal input[type=url],
  .modal input[type=number],
  .modal select,
  .modal textarea {
    width:100%; padding:11px 13px; font-family:inherit; font-size:14px;
    background:#fafafa; border:1px solid var(--border); border-radius:12px;
    outline:none; color:var(--text); transition:.2s ease;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color:var(--accent); background:#fff; }
  .modal textarea { resize:vertical; min-height:80px; line-height:1.5; }
  .modal .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:600px) { .modal .field-grid { grid-template-columns:1fr; } }
  .modal .check-row { display:flex; align-items:flex-start; gap:8px; margin-top:14px; }
  .modal .check-row input { margin-top:3px; }
  .modal .check-row label { margin:0; text-transform:none; letter-spacing:0; font-weight:600; font-size:13px; color:#333; }

  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }

  .modal .status { margin-top:14px; padding:11px 14px; border-radius:10px; font-size:13px; display:none; line-height:1.5; }
  .modal .status.show { display:block; }
  .modal .status.err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
  .modal .status.ok { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }

  .toast-container { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:99999; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast { padding:12px 20px; border-radius:50px; background:#222; color:#fff; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toastIn .2s ease-out; }
  .toast.ok { background:var(--green); }
  .toast.err { background:var(--red); }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .csv-hint {
    background:#f0f9ff; border-left:4px solid #0284c7; border-radius:8px;
    padding:12px 14px; font-size:12px; color:#075985; line-height:1.6;
    margin-bottom:12px; font-family:ui-monospace,monospace; white-space:pre-wrap;
  }

  @media (max-width:700px) {
    .header-inner { padding:13px 15px; flex-wrap:wrap; }
    .logo { font-size:21px; }
    .nav-link { font-size:11px; padding:7px 11px; }
    .wrap { padding:18px 15px 55px; }
    .page-head h1 { font-size:24px; }
    .rep-row { padding:14px 16px; }
    .vendor-row { padding:14px 16px; }
    .product-row { padding:14px 16px; }
    .cat-row { padding:12px 16px; }
    .log-row { grid-template-columns:1fr; gap:4px; padding:12px 16px; }
    .log-row .when { text-align:left; }
    .shop-toolbar { padding:12px 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">The <span>Whacky</span> Rack</a>
    <div class="header-right">
      <a href="index.html" class="nav-link">Shop</a>
      <a href="admin.html" class="nav-link active">Admin</a>
      <a href="analytics.html" class="nav-link">Analytics</a>
    </div>
  </div>
</header>

<main class="wrap" id="root">
  <div class="loading">Checking access…</div>
</main>

<div class="toast-container" id="toast-container"></div>

<!-- Vendor details modal -->
<div class="modal" id="vendor-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-inner" id="vendor-modal-body"></div>
</div>

<!-- Shop product add/edit modal -->
<div class="modal" id="shop-product-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-inner" id="shop-product-modal-body"></div>
</div>

<!-- Bulk import modal -->
<div class="modal" id="bulk-import-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-inner" id="bulk-import-modal-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  const sb = window.wr.sb;
  const root = document.getElementById("root");
  const toastBox = document.getElementById("toast-container");
  const vendorModal = document.getElementById("vendor-modal");
  const vendorModalBody = document.getElementById("vendor-modal-body");
  const shopProductModal = document.getElementById("shop-product-modal");
  const shopProductModalBody = document.getElementById("shop-product-modal-body");
  const bulkImportModal = document.getElementById("bulk-import-modal");
  const bulkImportModalBody = document.getElementById("bulk-import-modal-body");

  let me = null;
  let tab = "vendors";
  let reports = [];
  let logs = [];
  let vendors = [];
  let vendorFilter = "pending";
  let vendorProducts = [];
  let productFilter = "pending";
  let categories = [];
  let shopProducts = [];
  let shopFilterCountry = "";
  let shopFilterSearch = "";
  let countries = [];

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function timeAgo(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    const s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60) + "m ago";
    if (s < 86400) return Math.floor(s/3600) + "h ago";
    if (s < 604800) return Math.floor(s/86400) + "d ago";
    return d.toLocaleDateString();
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleString(undefined, {
      year:"numeric", month:"short", day:"2-digit",
      hour:"2-digit", minute:"2-digit"
    });
  }
  function toast(msg, kind = "ok") {
    const el = document.createElement("div");
    el.className = "toast " + kind;
    el.textContent = msg;
    toastBox.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }
  function labelTarget(t) {
    return ({ yap:"Yap", yap_comment:"Yap comment", tape:"Tape", tape_comment:"Tape comment", profile:"Profile" })[t] || t;
  }

  async function loadReports() {
    const { data, error } = await sb.rpc("get_pending_reports", { p_limit: 100 });
    if (error) { console.error(error); reports = []; return; }
    reports = data || [];
  }
  async function loadLogs() {
    const { data, error } = await sb.from("moderation_log")
      .select(`
        id, action, target_type, target_id, note, created_at,
        moderator:profiles!moderation_log_moderator_id_fkey(username)
      `)
      .order("created_at", { ascending: false })
      .limit(100);
    if (error) { console.error(error); logs = []; return; }
    logs = data || [];
  }
  async function loadVendors() {
    const args = vendorFilter === "all" ? { p_status: null } : { p_status: vendorFilter };
    const { data, error } = await sb.rpc("admin_list_vendors", args);
    if (error) { console.error(error); vendors = []; return; }
    vendors = data || [];
  }
  async function loadVendorProducts() {
    const args = productFilter === "all" ? { p_status: null } : { p_status: productFilter };
    const { data, error } = await sb.rpc("admin_list_vendor_products", args);
    if (error) { console.error(error); vendorProducts = []; return; }
    vendorProducts = data || [];
  }
  async function loadCategories() {
    const { data, error } = await sb.from("vendor_categories")
      .select("id, name, slug, is_active, sort_order, created_at")
      .order("sort_order", { ascending: true })
      .order("name", { ascending: true });
    if (error) { console.error(error); categories = []; return; }
    categories = data || [];
  }
  async function loadCountries() {
    const { data, error } = await sb.from("countries")
      .select("code, name, is_active")
      .eq("is_active", true)
      .order("sort_order", { ascending: true });
    if (error) { console.error(error); countries = []; return; }
    countries = data || [];
  }
  async function loadShopProducts() {
    const args = {
      p_country: shopFilterCountry || null,
      p_search:  shopFilterSearch || null
    };
    const { data, error } = await sb.rpc("admin_list_shop_products", args);
    if (error) { console.error(error); shopProducts = []; return; }
    shopProducts = data || [];
  }

  async function loadAll() {
    await Promise.all([
      loadReports(),
      loadVendors(),
      loadVendorProducts(),
      loadCategories(),
      loadCountries()
    ]);
  }

  function render() {
    const pendingVendors = vendors.filter(v => v.status === "pending").length;
    const pendingProducts = vendorProducts.filter(p => p.status === "pending").length;

    root.innerHTML = `
      <div class="page-head">
        <div class="kicker">Signed in as ${esc(me.username)}</div>
        <h1>Moderation <span>panel</span></h1>
        <p>Reports, vendors, shop products, vendor products, and categories.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn ${tab==="reports"?"active":""}" data-tab="reports">
          🚩 Reports<span class="count">${reports.length}</span>
        </button>
        <button class="tab-btn ${tab==="vendors"?"active":""}" data-tab="vendors">
          🏪 Vendors<span class="count">${pendingVendors}</span>
        </button>
        <button class="tab-btn ${tab==="shop"?"active":""}" data-tab="shop">
          🛒 Shop Products<span class="count">${shopProducts.length}</span>
        </button>
        <button class="tab-btn ${tab==="products"?"active":""}" data-tab="products">
          📦 Vendor products<span class="count">${pendingProducts}</span>
        </button>
        <button class="tab-btn ${tab==="categories"?"active":""}" data-tab="categories">
          🏷️ Categories
        </button>
        <button class="tab-btn ${tab==="log"?"active":""}" data-tab="log">
          📜 Mod log
        </button>
      </div>

      <div id="tab-content"></div>
    `;

    const content = document.getElementById("tab-content");
    if (tab === "reports") content.innerHTML = renderReports();
    else if (tab === "vendors") content.innerHTML = renderVendors();
    else if (tab === "shop") content.innerHTML = renderShopProducts();
    else if (tab === "products") content.innerHTML = renderVendorProducts();
    else if (tab === "categories") content.innerHTML = renderCategories();
    else content.innerHTML = renderLogs();
  }

  function renderVendors() {

      return filterBar + `<div class="card"><div class="empty">

        ? `<img class="vendor-logo" src="${esc(v.logo_url)}" alt="">`

      const actions = [];
      if (v.status === "pending") {
        actions.push(`<button class="rep-btn approve" data-action="approve-vendor" data-vendor-id="${esc(v.vendor_id)}">Approve</button>`);
        actions.push(`<button class="rep-btn reject" data-action="reject-vendor" data-vendor-id="${esc(v.vendor_id)}">Reject</button>`);

        actions.push(`<button class="rep-btn warn" data-action="suspend-vendor" data-vendor-id="${esc(v.vendor_id)}">Suspend</button>`);

        const verified = v.is_verified === true;
        actions.push(`<button class="rep-btn ${verified ? "resolve" : ""}" data-action="toggle-verify-vendor" data-vendor-id="${esc(v.vendor_id)}" data-verified="${verified ? "1" : "0"}">${verified ? "✓ Verified" : "○ Verify"}</button>`);
      } else if (v.status === "suspended") {
        actions.push(`<button class="rep-btn approve" data-action="restore-vendor" data-vendor-id="${esc(v.vendor_id)}">Restore</button>`);

            <div class="vendor-info">

                ${esc(v.country)} · <a href="${esc(v.business_url)}" target="_blank" rel="noopener">${esc(v.business_url)}</a>
              </div>

            ${v.is_verified ? `<span class="verified-pill">✓ Verified</span>` : ""}

          <div class="vendor-stats">

            ${v.reapplication_count > 0 ? `<span>Reapplications: <span class="num">${v.reapplication_count}</span></span>` : ""}
            ${v.approved_at ? `<span>Approved ${esc(timeAgo(v.approved_at))}</span>` : ""}
            ${v.suspended_at ? `<span>Suspended ${esc(timeAgo(v.suspended_at))}</span>` : ""}

  /* ---------------- Shop product modal ---------------- */

  function openShopProductModal(mode, product) {
    const isEdit = mode === "edit";
    const countryOptions = countries.map(c =>
      `<option value="${c.code}"${product && product.target_country === c.code ? " selected" : ""}>${esc(c.name)} (${c.code})</option>`
    ).join("");

    shopProductModalBody.innerHTML = `
      <button class="modal-close" type="button" id="shop-modal-close" aria-label="Close">×</button>
      <h3>${isEdit ? "Edit shop product" : "Add shop product"}</h3>
      <p class="modal-sub">${isEdit ? "Update product details." : "New product appears immediately on the shop for the target country."}</p>

      <form id="shop-product-form" novalidate>
        <label for="sp-name">Name</label>
        <input id="sp-name" type="text" maxlength="120" required value="${product ? esc(product.name) : ""}">

        <label for="sp-image">Image URL</label>
        <input id="sp-image" type="url" maxlength="400" placeholder="https://..." required value="${product ? esc(product.image) : ""}">

        <label for="sp-link">Product link (Amazon)</label>
        <input id="sp-link" type="url" maxlength="400" placeholder="https://amazon..." required value="${product ? esc(product.link) : ""}">
        <div style="font-size:11px; color:#888; margin-top:4px;">Must start with https://</div>

        <div class="field-grid">
          <div>
            <label for="sp-category">Category</label>
            <input id="sp-category" type="text" maxlength="60" required value="${product ? esc(product.category) : ""}">
          </div>
          <div>
            <label for="sp-country">Target country</label>
            <select id="sp-country" required>
              <option value="">— Choose —</option>
              ${countryOptions}
            </select>
          </div>
        </div>

        <div class="field-grid">
          <div>
            <label for="sp-price">Price note <span class="optional">(optional)</span></label>
            <input id="sp-price" type="text" maxlength="60" placeholder="e.g. $19" value="${product && product.price_note ? esc(product.price_note) : ""}">
          </div>
          <div>
            <label for="sp-shipping">Shipping note <span class="optional">(optional)</span></label>
            <input id="sp-shipping" type="text" maxlength="60" placeholder="e.g. Ships worldwide" value="${product && product.shipping_note ? esc(product.shipping_note) : ""}">
          </div>
        </div>

        <div class="field-grid">
          <div>
            <label for="sp-order">Featured order <span class="optional">(lower = earlier)</span></label>
            <input id="sp-order" type="number" min="0" max="9999" value="${product ? (product.featured_order || 0) : 0}">
          </div>
        </div>

        <div class="check-row">
          <input id="sp-featured" type="checkbox"${product && product.is_featured ? " checked" : ""}>
          <label for="sp-featured">Feature on the front of the shop</label>
        </div>

        <div class="status" id="sp-status"></div>

        <div class="modal-actions">
          <button class="rep-btn" type="button" id="shop-modal-cancel">Cancel</button>
          <button class="rep-btn approve" type="submit" id="shop-modal-submit">${isEdit ? "Save changes" : "Add product"}</button>
        </div>
      </form>
    `;

    shopProductModal.classList.add("open");
    shopProductModal.setAttribute("aria-hidden", "false");

    const form = document.getElementById("shop-product-form");
    const statusEl = document.getElementById("sp-status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.className = "status";

      const submitBtn = document.getElementById("shop-modal-submit");
      submitBtn.disabled = true;
      const oldText = submitBtn.textContent;
      submitBtn.textContent = "Saving…";

      const payload = {
        p_name:           document.getElementById("sp-name").value.trim(),
        p_image:          document.getElementById("sp-image").value.trim(),
        p_link:           document.getElementById("sp-link").value.trim(),
        p_category:       document.getElementById("sp-category").value.trim(),
        p_target_country: document.getElementById("sp-country").value,
        p_price_note:     document.getElementById("sp-price").value.trim() || null,
        p_shipping_note:  document.getElementById("sp-shipping").value.trim() || null,
        p_is_featured:    document.getElementById("sp-featured").checked,
        p_featured_order: parseInt(document.getElementById("sp-order").value, 10) || 0
      };

      try {
        let error;
        if (isEdit) {
          payload.p_product_id = product.id;
          ({ error } = await sb.rpc("admin_update_shop_product", payload));
        } else {
          ({ error } = await sb.rpc("admin_add_shop_product", payload));
        }
        if (error) throw error;

        toast(isEdit ? "Product updated." : "Product added.", "ok");
        closeShopProductModal();
        await loadShopProducts();
        render();
      } catch (err) {
        console.error(err);
        statusEl.className = "status show err";
        statusEl.textContent = err.message || "Could not save.";
        submitBtn.disabled = false;
        submitBtn.textContent = oldText;
      }
    });
  }
  function closeShopProductModal() {
    shopProductModal.classList.remove("open");
    shopProductModal.setAttribute("aria-hidden", "true");
  }

    bulkImportModalBody.innerHTML = `
      <button class="modal-close" type="button" id="bulk-modal-close" aria-label="Close">×</button>
      <h3>Bulk import products</h3>
      <p class="modal-sub">Paste CSV data below. The first line must be the header row.</p>

      <div class="csv-hint">name,image,link,category,target_country,price_note,shipping_note
Cool Mug,https://...,https://amazon...,Mugs,GB,$12,Ships UK
Weird Lamp,https://...,https://amazon...,Lamps,US,,</div>

      <label for="bulk-csv">CSV data</label>
      <textarea id="bulk-csv" rows="12" placeholder="Paste CSV here…" style="font-family:ui-monospace,monospace; font-size:12px;"></textarea>

      <div class="status" id="bulk-status"></div>

      <div class="modal-actions">
        <button class="rep-btn" type="button" id="bulk-modal-cancel">Cancel</button>
        <button class="rep-btn approve" type="button" id="bulk-modal-submit">Import</button>
      </div>
    `;

    bulkImportModal.classList.add("open");
    bulkImportModal.setAttribute("aria-hidden", "false");

    document.getElementById("bulk-modal-submit").addEventListener("click", async () => {
      const statusEl = document.getElementById("bulk-status");
      const submitBtn = document.getElementById("bulk-modal-submit");
      statusEl.className = "status";

      const raw = document.getElementById("bulk-csv").value;
      const parsed = parseCSV(raw);
      if (parsed.error) {
        statusEl.className = "status show err";
        statusEl.textContent = parsed.error;
        return;
      }
      if (parsed.rows.length === 0) {
        statusEl.className = "status show err";
        statusEl.textContent = "No data rows found.";
        return;
      }

      submitBtn.disabled = true;
      const oldText = submitBtn.textContent;
      submitBtn.textContent = "Importing…";

      try {
        const { data, error } = await sb.rpc("admin_bulk_import_shop_products", {
          p_rows: parsed.rows
        });
        if (error) throw error;

        const result = (data && data[0]) || { inserted: 0, failed: 0, errors: [] };
        let msg = `Inserted ${result.inserted}. Failed ${result.failed}.`;
        if (result.errors && result.errors.length) {
          msg += "\n\nErrors:\n" + result.errors.slice(0, 10).join("\n");
        }
        statusEl.className = "status show " + (result.failed > 0 ? "err" : "ok");
        statusEl.style.whiteSpace = "pre-wrap";
        statusEl.textContent = msg;

        await loadShopProducts();
        setTimeout(() => {
          closeBulkImportModal();
          render();
        }, 2000);
      } catch (err) {
        console.error(err);
        statusEl.className = "status show err";
        statusEl.textContent = err.message || "Import failed.";
        submitBtn.disabled = false;
        submitBtn.textContent = oldText;
      }
    });
  }
  function closeBulkImportModal() {
    bulkImportModal.classList.remove("open");
    bulkImportModal.setAttribute("aria-hidden", "true");
  }

  function parseCSV(text) {
    if (!text || !text.trim()) return { rows: [], error: "No data pasted." };
    const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim().length > 0);
    if (lines.length < 2) return { rows: [], error: "Need a header row + at least one data row." };

    const header = splitCSVLine(lines[0]).map(h => h.trim().toLowerCase());
    const required = ["name","image","link","category","target_country"];
    for (const r of required) {
      if (!header.includes(r)) return { rows: [], error: `Missing required column: ${r}` };
    }

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = splitCSVLine(lines[i]);
      const row = {};
      header.forEach((h, idx) => {
        row[h] = (cols[idx] || "").trim();
      });
      // Skip fully-empty rows
      if (!row.name && !row.link) continue;
      rows.push(row);
    }
    return { rows, error: null };
  }

  function splitCSVLine(line) {
    const out = [];
    let cur = "";
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        out.push(cur); cur = "";
      } else {
        cur += ch;
      }
    }
    out.push(cur);
    return out;
  }

  /* ---------------- Actions ---------------- */

  async function handleVendorAction(action, vendorId) {
    try {
      if (action === "approve-vendor") {
        const { error } = await sb.rpc("admin_approve_vendor", { p_vendor_id: vendorId });
        if (error) throw error;
        toast("Vendor approved.", "ok");
      } else if (action === "reject-vendor") {
        const reason = prompt("Reason for rejection (min 5 chars):", "");
        if (reason === null) return;
        if (reason.trim().length < 5) { toast("Reason too short.", "err"); return; }
        const { error } = await sb.rpc("admin_reject_vendor", { p_vendor_id: vendorId, p_reason: reason.trim() });
        if (error) throw error;
        toast("Vendor rejected.", "ok");
      } else if (action === "suspend-vendor") {
        const reason = prompt("Reason for suspension (optional):", "");
        if (reason === null) return;
        const { error } = await sb.rpc("admin_suspend_vendor", { p_vendor_id: vendorId, p_reason: reason.trim() });
        if (error) throw error;
        toast("Vendor suspended.", "ok");
      } else if (action === "restore-vendor") {
        const { error } = await sb.rpc("admin_restore_vendor", { p_vendor_id: vendorId });
        if (error) throw error;
        toast("Vendor restored.", "ok");
      } else if (action === "set-limit") {
        const v = vendors.find(x => x.vendor_id === vendorId);
        const current = v ? v.product_limit : 10;
        const value = prompt(`Set product limit for this vendor (currently ${current}):`, String(current));
        if (value === null) return;
        const n = parseInt(value, 10);
        if (!n || n < 1 || n > 500) { toast("Limit must be 1–500.", "err"); return; }
        const { error } = await sb.rpc("admin_set_vendor_limit", { p_vendor_id: vendorId, p_limit: n });
        if (error) throw error;
        toast("Limit updated to " + n + ".", "ok");
      }
      closeVendorModal();
      await loadVendors();
      render();
    } catch (e) {
      console.error(e);
      toast(e.message || "Action failed.", "err");
    }
  }

  async function handleProductAction(action, productId) {
    try {
      if (action === "approve-product") {
        const { error } = await sb.rpc("admin_approve_vendor_product", { p_product_id: productId });
        if (error) throw error;
        toast("Product approved.", "ok");
      } else if (action === "reject-product") {
        const reason = prompt("Reason for rejection (min 5 chars):", "");
        if (reason === null) return;
        if (reason.trim().length < 5) { toast("Reason too short.", "err"); return; }
        const { error } = await sb.rpc("admin_reject_vendor_product", { p_product_id: productId, p_reason: reason.trim() });
        if (error) throw error;
        toast("Product rejected.", "ok");
      }
      await loadVendorProducts();
      render();
    } catch (e) {
      console.error(e);
      toast(e.message || "Action failed.", "err");
    }
  }

  async function handleCategoryAction(action, catId) {
    try {
      if (action === "edit-cat") {
        const c = categories.find(x => x.id === catId);
        if (!c) return;
        const name = prompt("Category name:", c.name);
        if (name === null) return;
        const trimmed = name.trim();
        if (trimmed.length < 2) { toast("Name too short.", "err"); return; }
        const sortStr = prompt("Sort order (lower = earlier):", String(c.sort_order));
        if (sortStr === null) return;
        const sort = parseInt(sortStr, 10);
        if (Number.isNaN(sort)) { toast("Invalid sort order.", "err"); return; }
        const { error } = await sb.from("vendor_categories")
          .update({ name: trimmed, sort_order: sort })
          .eq("id", catId);
        if (error) throw error;
        toast("Category updated.", "ok");
      } else if (action === "activate-cat") {
        const { error } = await sb.from("vendor_categories").update({ is_active: true }).eq("id", catId);
        if (error) throw error;
        toast("Category activated.", "ok");
      } else if (action === "deactivate-cat") {
        const { error } = await sb.from("vendor_categories").update({ is_active: false }).eq("id", catId);
        if (error) throw error;
        toast("Category deactivated.", "ok");
      } else if (action === "delete-cat") {
        if (!confirm("Delete this category permanently? Products using it will have their category cleared.")) return;
        const { error } = await sb.from("vendor_categories").delete().eq("id", catId);
        if (error) {
          if (error.code === "23503") {
            toast("Category is used by products — deactivate it instead.", "err");
          } else {
            throw error;
          }
          return;
        }
        toast("Category deleted.", "ok");
      }
      await loadCategories();
      render();
    } catch (e) {
      console.error(e);
      toast(e.message || "Action failed.", "err");
    }
  }

  async function handleShopProductDelete(productId, productName) {
    if (!confirm(`Delete "${productName}" permanently? This cannot be undone.`)) return;
    try {
      const { error } = await sb.rpc("admin_delete_shop_product", { p_product_id: productId });
      if (error) throw error;
      toast("Product deleted.", "ok");
      await loadShopProducts();
      render();
    } catch (e) {
      console.error(e);
      toast(e.message || "Delete failed.", "err");
    }
  }

  async function addCategory() {
    const nameEl = document.getElementById("cat-new-name");
    const sortEl = document.getElementById("cat-new-sort");
    if (!nameEl) return;
    const name = nameEl.value.trim();
    const sort = parseInt(sortEl.value, 10) || 100;
    if (name.length < 2) { toast("Category name too short.", "err"); return; }
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    if (!slug) { toast("Category name must contain letters or numbers.", "err"); return; }
    try {
      const { error } = await sb.from("vendor_categories").insert({
        name, slug, sort_order: sort, is_active: true
      });
      if (error) throw error;
      toast("Category added.", "ok");
      await loadCategories();
      render();
    } catch (e) {
      console.error(e);
      toast(e.message || "Add failed.", "err");
    }
  }

  /* ---------------- Click handling ---------------- */

  document.addEventListener("click", async (e) => {
    const tabBtn = e.target.closest(".tab-btn[data-tab]");
    if (tabBtn) {
      tab = tabBtn.dataset.tab;
      if (tab === "log") await loadLogs();
      if (tab === "shop") await loadShopProducts();
      render();
      return;
    }

    const vf = e.target.closest("[data-vendor-filter]");
    if (vf) {
      vendorFilter = vf.dataset.vendorFilter;
      await loadVendors();
      render();
      return;
    }
    const pf = e.target.closest("[data-product-filter]");
    if (pf) {
      productFilter = pf.dataset.productFilter;
      await loadVendorProducts();
      render();
      return;
    }

    if (e.target.id === "cat-add-btn") { await addCategory(); return; }

    if (e.target.id === "vendor-modal-close" || e.target === vendorModal) {
      closeVendorModal();
      return;
    }
    if (e.target.id === "shop-modal-close" || e.target.id === "shop-modal-cancel" || e.target === shopProductModal) {
      closeShopProductModal();
      return;
    }
    if (e.target.id === "bulk-modal-close" || e.target.id === "bulk-modal-cancel" || e.target === bulkImportModal) {
      closeBulkImportModal();
      return;
    }

    // Shop tab controls
    if (e.target.id === "shop-add-btn") { openShopProductModal("add", null); return; }
    if (e.target.id === "shop-bulk-btn") { openBulkImportModal(); return; }
    if (e.target.id === "shop-refresh-btn") {
      await loadShopProducts();
      render();
      return;
    }

    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === "dismiss" || action === "resolve") {
      const note = prompt(action === "dismiss" ? "Optional note:" : "Optional note:", "");
      if (note === null) return;
      btn.disabled = true;
      try {
        const { error } = await sb.rpc("resolve_report", {
          p_report_id: btn.dataset.reportId,
          p_action: action === "dismiss" ? "dismissed" : "resolved",
          p_note: note || null
        });
        if (error) throw error;
        toast(action === "dismiss" ? "Dismissed." : "Resolved.", "ok");
        await loadReports();
        render();
      } catch (err) {
        console.error(err);
        toast(err.message || "Failed.", "err");
        btn.disabled = false;
      }
      return;
    }
    if (action === "remove") {
      if (!confirm("Soft-delete this content?")) return;
      btn.disabled = true;
      try {
        const { error: rmErr } = await sb.rpc("admin_remove_content", {
          p_target_type: btn.dataset.targetType,
          p_target_id: btn.dataset.targetId
        });
        if (rmErr) throw rmErr;
        const reportRow = reports.find(r =>
          r.target_id === btn.dataset.targetId && r.target_type === btn.dataset.targetType);
        if (reportRow) {
          await sb.rpc("resolve_report", {
            p_report_id: reportRow.report_id,
            p_action: "resolved",
            p_note: "Content removed by moderator."
          });
        }
        toast("Removed and report resolved.", "ok");
        await loadReports();
        render();
      } catch (err) {
        console.error(err);
        toast(err.message || "Failed.", "err");
        btn.disabled = false;
      }
      return;
    }

    // Shop product actions
    if (action === "edit-shop-product") {
      const p = shopProducts.find(x => x.id === parseInt(btn.dataset.productId, 10));
      if (p) openShopProductModal("edit", p);
      return;
    }
    if (action === "delete-shop-product") {
      btn.disabled = true;
      try {
        await handleShopProductDelete(parseInt(btn.dataset.productId, 10), btn.dataset.productName);
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
      }
      return;
    }

    if (action === "view-vendor") { openVendorModal(btn.dataset.vendorId); return; }
    if (["approve-vendor","reject-vendor","suspend-vendor","restore-vendor","set-limit"].includes(action)) {
      btn.disabled = true;
      try {
        await handleVendorAction(action, btn.dataset.vendorId);
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
      }
      return;
    }
    if (action === "toggle-feature-vendor") {
      btn.disabled = true;
      const featured = btn.dataset.featured === "1";
      try {
        const { error } = await sb.rpc("admin_set_vendor_featured", {
          p_vendor_id: btn.dataset.vendorId,
          p_is_featured: !featured,
          p_order: 0
        });
        if (error) throw error;
        toast(featured ? "Vendor unfeatured." : "Vendor featured.", "ok");
        await loadVendors();
        render();
      } catch (err) {
        console.error(err);
        toast(err.message || "Failed.", "err");
        btn.disabled = false;
      }
      return;
    }
    if (action === "toggle-verify-vendor") {
      btn.disabled = true;
      const verified = btn.dataset.verified === "1";
      try {
        const { error } = await sb.rpc("admin_set_vendor_verified", {
          p_vendor_id: btn.dataset.vendorId,
          p_is_verified: !verified
        });
        if (error) throw error;
        toast(verified ? "Vendor verification removed." : "Vendor verified.", "ok");
        closeVendorModal();
        await loadVendors();
        render();
      } catch (err) {
        console.error(err);
        toast(err.message || "Failed.", "err");
        btn.disabled = false;
      }
      return;
    }

    if (action === "approve-product" || action === "reject-product") {
      btn.disabled = true;
      try {
        await handleProductAction(action, btn.dataset.productId);
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
      }
      return;
    }
    if (action === "toggle-feature-product") {
      btn.disabled = true;
      const featured = btn.dataset.featured === "1";
      try {
        const { error } = await sb.rpc("admin_set_product_featured", {
          p_product_id: parseInt(btn.dataset.productId, 10),
          p_is_featured: !featured,
          p_order: 0
        });
        if (error) throw error;
        toast(featured ? "Product unfeatured." : "Product featured.", "ok");
        await loadVendorProducts();
        render();
      } catch (err) {
        console.error(err);
        toast(err.message || "Failed.", "err");
        btn.disabled = false;
      }
      return;
    }

    if (["edit-cat","activate-cat","deactivate-cat","delete-cat"].includes(action)) {
      btn.disabled = true;
      try {
        await handleCategoryAction(action, parseInt(btn.dataset.catId, 10));
      } finally {
        if (document.body.contains(btn)) btn.disabled = false;
      }
      return;
    }
  });

  /* Debounced shop search + country filter */
  document.addEventListener("input", (e) => {
    if (e.target.id === "shop-search") {
      clearTimeout(window.__shopSearchTimer);
      window.__shopSearchTimer = setTimeout(async () => {
        shopFilterSearch = e.target.value.trim();
        await loadShopProducts();
        render();
      }, 350);
    }
  });
  document.addEventListener("change", async (e) => {
    if (e.target.id === "shop-country-filter") {
      shopFilterCountry = e.target.value;
      await loadShopProducts();
      render();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (vendorModal.classList.contains("open")) closeVendorModal();
      if (shopProductModal.classList.contains("open")) closeShopProductModal();
      if (bulkImportModal.classList.contains("open")) closeBulkImportModal();
    }
  });

  /* ---------------- Boot ---------------- */

  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      root.innerHTML = `<div class="err-card">
        <h2>Sign in required</h2>
        <p>You must be signed in as an admin to view this page.</p>
        <p><a href="login.html">Sign in →</a></p>
      </div>`;
      return;
    }
    const { data: profile } = await sb.from("profiles")
      .select("id, username, is_admin")
      .eq("id", session.user.id)
      .maybeSingle();
    me = profile;

    if (!me || !me.is_admin) {
      root.innerHTML = `<div class="err-card">
        <h2>Admins only</h2>
        <p>This page is only for moderators.</p>
        <p><a href="index.html">← Back home</a></p>
      </div>`;
      return;
    }

    await loadAll();
    render();
  }

  boot();
})();
</script>
</body>
</html>
