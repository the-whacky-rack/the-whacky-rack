<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifetime Ledger — The Whacky Rack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@500;700;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141920;
    --paper: #fbf6e8;
    --paper-dark: #f4ecd8;
    --ink: #2b2536;
    --muted: #8a7f6a;
    --accent: #ff5a36;
    --accent-dark: #e84625;
    --airmail-red: #d33a3a;
    --airmail-blue: #26478f;
    --seal: #8b1e15;
    --seal-light: #c73a2e;
    --gold: #c9a227;
    --gold-light: #e8c85c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: "Courier Prime", monospace;
    background: radial-gradient(circle at 50% 10%, #55606d 0%, #2a323c 55%, #141920 100%);
    background-attachment: fixed;
    color: #fff;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* Top bar */
  .top-bar {
    position: sticky; top: 0;
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
    background: rgba(20,25,32,.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 900; letter-spacing: -.5px; }
  .brand span { color: var(--accent); }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .top-back { color: #fff; opacity: .7; font-size: 13px; padding: 8px 12px; transition: .15s ease; }
  .top-back:hover { opacity: 1; }
  .top-print {
    padding: 8px 14px;
    border-radius: 50px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: .15s ease;
    letter-spacing: .02em;
  }
  .top-print:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }

  /* Wrap */
  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 30px 22px 80px;
  }

  /* States */
  .state-card {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    padding: 40px 24px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
  }
  .state-card .emoji { font-size: 48px; margin-bottom: 14px; line-height: 1; }
  .state-card h2 {
    font-family: "Playfair Display", serif;
    font-size: 28px;
    margin: 0 0 10px;
    color: #fff;
  }
  .state-card p {
    font-size: 13px;
    color: rgba(255,255,255,.65);
    line-height: 1.7;
    margin: 0 0 22px;
  }
  .state-card .btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 800;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    transition: .2s ease;
  }
  .state-card .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================
     LEDGER DOCUMENT
     ============================================ */
  .ledger {
    background-color: var(--paper);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><path d='M0 30 Q30 20 60 30 T120 30' fill='none' stroke='%2326478f' stroke-opacity='0.04' stroke-width='0.8'/><path d='M0 60 Q30 50 60 60 T120 60' fill='none' stroke='%2326478f' stroke-opacity='0.035' stroke-width='0.8'/><path d='M0 90 Q30 80 60 90 T120 90' fill='none' stroke='%2326478f' stroke-opacity='0.03' stroke-width='0.8'/></svg>");
    color: var(--ink);
    border-radius: 4px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.3);
    padding: 60px 60px 40px;
    position: relative;
    overflow: hidden;
  }
  .ledger::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, var(--airmail-red) 0 2%, #fff 2% 4%, var(--airmail-blue) 4% 6%, #fff 6% 8%) top left / 8% 5px repeat-x,
      linear-gradient(90deg, var(--airmail-red) 0 2%, #fff 2% 4%, var(--airmail-blue) 4% 6%, #fff 6% 8%) bottom left / 8% 5px repeat-x;
    pointer-events: none;
  }
  .ledger > * { position: relative; }

  /* Corner seal */
  .corner-seal {
    position: absolute;
    top: 26px;
    right: 30px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 32%, var(--seal-light) 0%, var(--seal) 65%, #4a0f0a 100%);
    box-shadow:
      inset -2px -3px 6px rgba(0,0,0,.35),
      inset 2px 3px 5px rgba(255,255,255,.1),
      0 3px 6px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f5ddc7;
    font-family: "Playfair Display", serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: .03em;
    transform: rotate(-8deg);
  }

  /* Header */
  .ledger-head {
    text-align: center;
    padding-bottom: 26px;
    border-bottom: 2px solid rgba(38,71,143,.25);
    margin-bottom: 30px;
  }
  .ledger-kicker {
    font-family: "Courier Prime", monospace;
    font-size: 10px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--airmail-red);
    margin-bottom: 12px;
  }
  .ledger-title {
    font-family: "Playfair Display", serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -1px;
    line-height: 1.05;
    margin: 0 0 6px;
  }
  .ledger-title em { font-style: italic; color: var(--airmail-red); }
  .ledger-subtitle {
    font-family: "Cormorant Garamond", serif;
    font-size: 16px;
    font-style: italic;
    color: var(--muted);
    margin: 0;
    letter-spacing: .02em;
  }

  /* Narrative */
  .narrative {
    font-family: "Cormorant Garamond", serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink);
    margin: 0 0 34px;
    letter-spacing: .01em;
  }
  .narrative strong {
    font-weight: 700;
    color: var(--ink);
  }
  .narrative .username {
    font-family: "Courier Prime", monospace;
    font-size: 15px;
    font-weight: 700;
    background: rgba(38,71,143,.06);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--airmail-blue);
  }

  /* Section */
  .section {
    margin-bottom: 30px;
  }
  .section-head {
    font-family: "Courier Prime", monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--airmail-blue);
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(38,71,143,.2);
    margin: 0 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .section-head .ornament {
    color: var(--airmail-red);
    font-size: 12px;
    letter-spacing: .2em;
    opacity: .7;
  }

  /* Ledger rows */
  .ledger-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    font-family: "Courier Prime", monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .ledger-line .label {
    color: var(--ink);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ledger-line .dots {
    flex: 1;
    border-bottom: 2px dotted rgba(38,71,143,.28);
    transform: translateY(-3px);
    min-width: 20px;
  }
  .ledger-line .value {
    color: var(--ink);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: .02em;
  }
  .ledger-line .value.accent {
    color: var(--airmail-red);
    font-size: 15px;
    font-weight: 900;
  }
  .ledger-line .value.flag {
    font-family: "Courier Prime", monospace;
    font-size: 20px;
    line-height: 1;
  }
  .ledger-line .value.sub {
    font-family: "Cormorant Garamond", serif;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    font-weight: 500;
    margin-left: 6px;
  }

  /* Country chips */
  .country-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 0 8px;
  }
  .country-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px 4px 8px;
    background: rgba(38,71,143,.06);
    border: 1px solid rgba(38,71,143,.18);
    border-radius: 50px;
    font-family: "Courier Prime", monospace;
    font-size: 11px;
    color: var(--airmail-blue);
    letter-spacing: .04em;
    font-weight: 700;
  }
  .country-chip .flag-icon {
    font-size: 14px;
    line-height: 1;
  }
  .country-chip.is-top {
    background: rgba(211,58,58,.09);
    border-color: rgba(211,58,58,.4);
    color: var(--airmail-red);
  }

  /* Longest conversation callout */
  .callout {
    background: rgba(255,250,235,.7);
    border-left: 3px solid var(--airmail-red);
    border-radius: 3px;
    padding: 14px 18px;
    font-family: "Cormorant Garamond", serif;
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    margin: 4px 0 8px;
  }
  .callout .big {
    font-family: "Playfair Display", serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--airmail-red);
    letter-spacing: -.3px;
    line-height: 1.2;
    display: block;
    margin-bottom: 4px;
  }
  .callout a {
    color: var(--airmail-red);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
    font-family: "Courier Prime", monospace;
    font-size: 12px;
    letter-spacing: .04em;
  }
  .callout a:hover { color: var(--ink); }

  /* Empty-state hint */
  .empty-hint {
    font-family: "Cormorant Garamond", serif;
    font-size: 15px;
    font-style: italic;
    color: var(--muted);
    padding: 6px 0 4px;
    line-height: 1.6;
  }

  /* Footer */
  .ledger-foot {
    margin-top: 44px;
    padding-top: 20px;
    border-top: 1px dashed rgba(38,71,143,.3);
    text-align: center;
    font-family: "Courier Prime", monospace;
    font-size: 10px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.7;
  }
  .ledger-foot .row1 {
    color: var(--airmail-red);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .ledger-foot .row2 {
    opacity: .75;
  }

  /* Mobile */
  @media (max-width: 700px) {
    .top-bar { padding: 12px 15px; }
    .brand { font-size: 16px; }
    .top-back { font-size: 12px; }
    .wrap { padding: 20px 15px 60px; }
    .ledger {
      padding: 44px 22px 26px;
      border-radius: 3px;
    }
    .corner-seal {
      top: 18px;
      right: 20px;
      width: 42px;
      height: 42px;
      font-size: 13px;
    }
    .ledger-kicker { font-size: 9px; letter-spacing: .3em; }
    .ledger-title { font-size: 26px; letter-spacing: -.6px; }
    .ledger-subtitle { font-size: 14px; }
    .narrative { font-size: 15px; line-height: 1.7; margin-bottom: 26px; }
    .section { margin-bottom: 24px; }
    .section-head { font-size: 9px; letter-spacing: .22em; }
    .ledger-line {
      font-size: 13px;
      padding: 5px 0;
    }
    .ledger-line .value.accent { font-size: 14px; }
    .country-chip { font-size: 10px; padding: 3px 8px 3px 6px; }
    .country-chip .flag-icon { font-size: 12px; }
    .callout { padding: 12px 14px; font-size: 14px; }
    .callout .big { font-size: 18px; }
    .ledger-foot { font-size: 9px; letter-spacing: .1em; margin-top: 32px; }
  }

  /* ============================================
     PRINT
     ============================================ */
  @media print {
    @page { margin: 14mm; size: A4 portrait; }
    body { background: #fff !important; }
    .top-bar { display: none !important; }
    .wrap { max-width: none !important; padding: 0 !important; margin: 0 !important; }
    .ledger {
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 10mm 12mm !important;
      page-break-inside: avoid;
    }
    .ledger::before { display: none; }
    .ledger-foot { page-break-before: avoid; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="brand">The <span>Whacky</span> Rack</a>
  <div class="top-actions">
    <a href="javascript:history.back()" class="top-back" id="top-back">← Back</a>
    <button class="top-print" type="button" onclick="window.print()">🖨 Print / PDF</button>
  </div>
</div>

<main class="wrap" id="root">
  <div class="state-card">
    <div class="spinner"></div>
    <p>Retrieving your ledger…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  const sb = window.wr ? window.wr.sb : null;
  if (!sb) {
    document.getElementById('root').innerHTML = '<div class="state-card"><h2>Error</h2><p>Auth library failed to load.</p></div>';
    return;
  }

  const root = document.getElementById('root');
  const topBack = document.getElementById('top-back');

  let session = null;
  let me = null;

  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function flagFor(cc) {
    if (!cc || cc.length !== 2) return '🌍';
    const A = 0x1F1E6;
    return String.fromCodePoint(
      A + cc.toUpperCase().charCodeAt(0) - 65,
      A + cc.toUpperCase().charCodeAt(1) - 65
    );
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString(undefined, {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }
  function fmtShortDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString(undefined, {
      year: 'numeric', month: 'short', day: '2-digit'
    });
  }
  function fmtNumber(n) {
    return Number(n || 0).toLocaleString();
  }
  function fmtYears(y) {
    const n = Number(y || 0);
    if (n < 1) {
      // Show months if under a year
      const months = Math.max(1, Math.round(n * 12));
      return months + (months === 1 ? ' month' : ' months');
    }
    return n.toFixed(2) + ' years';
  }

  async function loadCountryNames(codes) {
    const unique = [...new Set((codes || []).filter(Boolean))];
    if (unique.length === 0) return {};
    try {
      const { data } = await sb.from('countries').select('code, name').in('code', unique);
      return Object.fromEntries((data || []).map(c => [c.code, c.name]));
    } catch (e) {
      return {};
    }
  }

  /* ---------- State screens ---------- */
  function renderSignIn() {
    root.innerHTML = `
      <div class="state-card">
        <div class="emoji">🔒</div>
        <h2>Sign in to view</h2>
        <p>The Lifetime Ledger is a private record. Sign in to see yours, or view another member's public ledger.</p>
        <div>
          <a class="btn" href="login.html">Sign in</a>
        </div>
      </div>
    `;
  }
  function renderError(title, msg) {
    root.innerHTML = `
      <div class="state-card">
        <div class="emoji">⚡</div>
        <h2>${esc(title)}</h2>
        <p>${esc(msg)}</p>
        <div><a class="btn" href="profile.html">← Back to profile</a></div>
      </div>
    `;
  }

  /* ---------- Ledger renderer ---------- */
  function renderLedger(L, countryNames, isOwn) {
    const {
      username, rank, country, member_since, years_on_rack,
      letters_sent, replies_received, replies_sent,
      bottles_sent, bottles_beached,
      total_conversations, permanent_pen_pals, active_conversations,
      countries_corresponded, country_list,
      top_country, top_country_letters,
      longest_conversation_letters, longest_conversation_id,
      yaps_count, tapes_count, comments_count,
      gifts_sent, gifts_received,
      most_active_year, most_active_year_letters
    } = L;

    // Update top back link
    topBack.href = `profile.html?id=${encodeURIComponent(L.id || '')}`;

    // Narrative variations
    let narrative;
    if (letters_sent === 0 && total_conversations === 0) {
      narrative = `This is the ledger of <span class="username">${esc(username)}</span>,
        who joined the Rack on <strong>${esc(fmtDate(member_since))}</strong>.
        Their story is just beginning — no letters written, no replies received yet.
        The page waits, patient and blank.`;
    } else if (letters_sent > 0 && total_conversations === 0) {
      narrative = `This is the ledger of <span class="username">${esc(username)}</span>,
        who joined the Rack on <strong>${esc(fmtDate(member_since))}</strong>.
        They have written <strong>${fmtNumber(letters_sent)}</strong> letter${letters_sent === 1 ? '' : 's'} into the world,
        and are waiting for their first reply to arrive.`;
    } else if (total_conversations > 0 && letters_sent === 0) {
      narrative = `This is the ledger of <span class="username">${esc(username)}</span>,
        who joined the Rack on <strong>${esc(fmtDate(member_since))}</strong>.
        They have answered <strong>${fmtNumber(total_conversations)}</strong> letter${total_conversations === 1 ? '' : 's'} from strangers,
        and a slow correspondence is unfolding.`;
    } else {
      narrative = `This is the ledger of <span class="username">${esc(username)}</span>,
        citizen of the Rack since <strong>${esc(fmtDate(member_since))}</strong>.
        In that time they have written <strong>${fmtNumber(letters_sent)}</strong> letter${letters_sent === 1 ? '' : 's'} into the world,
        received <strong>${fmtNumber(replies_received)}</strong> repl${replies_received === 1 ? 'y' : 'ies'} back,
        and exchanged <strong>${fmtNumber(replies_sent + replies_received)}</strong> letters in total with correspondents across
        <strong>${fmtNumber(countries_corresponded)}</strong> countr${countries_corresponded === 1 ? 'y' : 'ies'}.`;
    }

    // Countries chips
    let countriesHtml = '';
    if (country_list && country_list.length > 0) {
      countriesHtml = country_list.map(cc => {
        const isTop = cc === top_country;
        const name = countryNames[cc] || cc;
        return `<span class="country-chip${isTop ? ' is-top' : ''}">
          <span class="flag-icon">${flagFor(cc)}</span>${esc(name)}
        </span>`;
      }).join('');
    } else {
      countriesHtml = `<div class="empty-hint">No correspondence yet.</div>`;
    }

    // Longest conversation
    let longestConvHtml = '';
    if (longest_conversation_letters > 0 && longest_conversation_id) {
      longestConvHtml = `
        <div class="callout">
          <span class="big">${fmtNumber(longest_conversation_letters)} letter${longest_conversation_letters === 1 ? '' : 's'}</span>
          exchanged in your longest conversation.<br>
          <a href="letters-conversation.html?id=${encodeURIComponent(longest_conversation_id)}">→ Continue reading</a>
        </div>
      `;
    } else {
      longestConvHtml = `<div class="empty-hint">No conversations yet — the longest thread is still unwritten.</div>`;
    }

    // Gifts line
    let giftsLine = '0';
    if (gifts_sent === 0 && gifts_received === 0) {
      giftsLine = '—';
    } else {
      giftsLine = `${fmtNumber(gifts_sent)} sent · ${fmtNumber(gifts_received)} received`;
    }

    // Most active year
    let activeYearHtml;
    if (most_active_year && most_active_year_letters > 0) {
      activeYearHtml = `
        <div class="ledger-line">
          <span class="label">Most active year</span>
          <span class="dots"></span>
          <span class="value accent">${most_active_year}</span>
          <span class="value sub">${fmtNumber(most_active_year_letters)} letter${most_active_year_letters === 1 ? '' : 's'}</span>
        </div>
      `;
    } else {
      activeYearHtml = `<div class="empty-hint">No letter activity recorded yet.</div>`;
    }

    const isOwnIndicator = isOwn ? '' : `<div style="text-align:center; font-family:'Courier Prime',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#9a8f7c; margin-bottom:18px;">Public document · Viewing ${esc(username)}'s ledger</div>`;

    root.innerHTML = `
      ${isOwnIndicator}
      <article class="ledger">
        <div class="corner-seal">${esc(String(rank || 0).slice(-2))}</div>

        <header class="ledger-head">
          <div class="ledger-kicker">The Whacky Rack · Republic of the Rack</div>
          <h1 class="ledger-title">The Lifetime <em>Ledger</em></h1>
          <p class="ledger-subtitle">A complete record of a life on the Rack</p>
        </header>

        <p class="narrative">${narrative}</p>

        <section class="section">
          <h2 class="section-head">

  /* ---------- Boot ---------- */
  async function boot() {
    const { data: { session: s } } = await sb.auth.getSession();
    session = s;

    if (!session) { renderSignIn(); return; }

    const params = new URLSearchParams(location.search);
    const idParam = params.get('id');
    const targetId = idParam || session.user.id;

    me = window.wr.getProfile() || null;
    if (!me) {
      try {
        const { data } = await sb.from('profiles').select('id, username').eq('id', session.user.id).maybeSingle();
        me = data;
      } catch (e) {}
    }

    // Confirm target profile exists and get some basics for isOwn check
    let targetUsername = null;
    try {
      const { data } = await sb.from('profiles').select('id, username').eq('id', targetId).maybeSingle();
      if (data) targetUsername = data.username;
    } catch (e) {}

    const isOwn = session.user.id === targetId;

    // Update back link
    if (idParam) {
      topBack.href = `profile.html?id=${encodeURIComponent(targetId)}`;
    } else {
      topBack.href = 'profile.html';
    }

    const { data, error } = await sb.rpc('get_lifetime_ledger', { p_profile_id: targetId });

    if (error) {
      console.error('[ledger] rpc error:', error);
      renderError("Couldn't load ledger", error.message || 'Please try again.');
      return;
    }

    const L = (data && data[0]) || null;
    if (!L) {
      renderError('Ledger not found', 'This citizen has no ledger yet, or the profile no longer exists.');
      return;
    }

    L.id = targetId;

    // Resolve country names
    const countryNames = await loadCountryNames(L.country_list || []);

    // Doc title
    document.title = `${L.username} — Lifetime Ledger — The Whacky Rack`;

    renderLedger(L, countryNames, isOwn);
  }

  boot();
})();
</script>
