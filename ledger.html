<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifetime Ledger — The Whacky Rack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141920;
    --paper: #f5ead2;
    --paper-dark: #e6dcbe;
    --ink: #2b1f0e;
    --ink-soft: #4a3822;
    --red: #7a1a1a;
    --red-bright: #a52a2a;
    --gold: #8b6a2a;
    --muted: #8b7a55;
    --accent: #ff5a36;
    --accent-dark: #e84625;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: "Cormorant Garamond", serif;
    background: radial-gradient(circle at 50% 10%, #55606d 0%, #2a323c 55%, #141920 100%);
    background-attachment: fixed;
    color: #fff;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* Chrome */
  .chrome {
    max-width: 820px;
    margin: 0 auto;
    padding: 22px 22px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chrome-back {
    font-family: "Courier Prime", monospace;
    font-size: 13px;
    color: rgba(255,255,255,.7);
    padding: 8px 14px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,.15);
    transition: .15s ease;
  }
  .chrome-back:hover { color: #fff; border-color: rgba(255,255,255,.35); }
  .chrome-actions { display: flex; gap: 8px; }
  .chrome-btn {
    font-family: "Courier Prime", monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .05em;
    padding: 9px 16px;
    border-radius: 50px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    cursor: pointer;
    transition: .15s ease;
  }
  .chrome-btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.4); }
  .chrome-btn.primary { background: var(--accent); border-color: var(--accent); }
  .chrome-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  /* The document */
  .ledger-wrap { max-width: 820px; margin: 0 auto; padding: 12px 22px 100px; }

  .ledger-doc {
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(139,90,43,.06) 0%, transparent 45%),
      radial-gradient(ellipse at 80% 80%, rgba(139,90,43,.05) 0%, transparent 40%);
    border-radius: 6px;
    padding: 46px 52px 40px;
    color: var(--ink);
    box-shadow:
      0 30px 70px -20px rgba(0,0,0,.85),
      0 0 0 1px rgba(0,0,0,.3),
      inset 0 0 60px rgba(139,90,43,.08);
    position: relative;
    overflow: hidden;
  }
  .ledger-doc::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(122,26,26,.15);
    border-radius: 3px;
    pointer-events: none;
  }
  .ledger-doc::after {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(122,26,26,.08);
    border-radius: 2px;
    pointer-events: none;
  }
  .ledger-doc > * { position: relative; z-index: 1; }

  /* Seal */
  .ledger-seal-wrap { display: flex; justify-content: center; margin-bottom: 22px; }
  .ledger-seal {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #c9302c 0%, #9a2422 55%, #6e1a18 100%);
    box-shadow:
      inset 0 3px 6px rgba(255,255,255,.2),
      inset 0 -4px 8px rgba(0,0,0,.4),
      0 6px 14px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px;
    color: #f4ecd8;
    position: relative;
    transform: rotate(-4deg);
  }
  .ledger-seal::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(244,236,216,.4);
  }
  .ledger-seal::after {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    border: 1px dashed rgba(244,236,216,.28);
  }

  /* Title */
  .ledger-title-block { text-align: center; margin-bottom: 26px; }
  .ledger-title {
    font-family: "Playfair Display", serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--ink);
    margin: 0 0 6px;
    line-height: 1;
  }
  .ledger-subtitle {
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0;
    padding-left: .42em;
  }
  .ledger-subhead {
    font-family: "Caveat", cursive;
    font-size: 17px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 14px 0 0;
  }

  .ledger-rule {
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(122,26,26,.4) 15%,
      rgba(122,26,26,.4) 85%,
      transparent 100%);
    margin: 22px 0;
  }

  /* Identity block */
  .ledger-identity { display: flex; flex-direction: column; gap: 10px; }
  .identity-row {
    display: flex;
    align-items: baseline;
    font-family: "Cormorant Garamond", serif;
    font-size: 17px;
  }
  .id-label { font-weight: 500; color: var(--ink-soft); flex-shrink: 0; }
  .id-leader {
    flex: 1;
    border-bottom: 1px dotted rgba(139,90,43,.4);
    margin: 0 8px 4px;
    min-width: 30px;
  }
  .id-value {
    font-family: "Courier Prime", monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--red);
    letter-spacing: .02em;
    text-align: right;
  }

  /* Sections */
  .ledger-section { margin: 26px 0; }
  .ledger-section h3 {
    font-family: "Playfair Display", serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0 0 6px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--ink);
  }
  .section-note {
    font-family: "Caveat", cursive;
    font-size: 15px;
    color: var(--red);
    opacity: .78;
    margin: 0 0 14px;
    font-style: italic;
  }
  .ledger-row { display: flex; align-items: baseline; padding: 6px 0; }
  .row-label {
    font-family: "Cormorant Garamond", serif;
    font-size: 16px;
    color: var(--ink-soft);
    font-weight: 500;
    flex-shrink: 0;
  }
  .row-leader {
    flex: 1;
    border-bottom: 1px dotted rgba(139,90,43,.35);
    margin: 0 8px 4px;
    min-width: 20px;
  }
  .row-value {
    font-family: "Courier Prime", monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--red);
    text-align: right;
    white-space: nowrap;
  }
  .row-value.muted { color: var(--muted); font-weight: 400; font-style: italic; }

  /* Flags row */
  .flags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 0 12px;
  }
  .flag-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px 4px 6px;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(122,26,26,.18);
    border-radius: 50px;
    font-family: "Cormorant Garamond", serif;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .flag-chip .flag-emoji { font-size: 18px; line-height: 1; }

  /* Signature */
  .ledger-signature { margin-top: 34px; text-align: center; }
  .sig-label {
    font-family: "Cormorant Garamond", serif;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .sig-line {
    font-family: "Caveat", cursive;
    font-size: 34px;
    color: var(--ink);
    transform: rotate(-2deg);
    display: inline-block;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(43,37,54,.4);
    min-width: 200px;
    line-height: 1;
  }
  .sig-date {
    font-family: "Cormorant Garamond", serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 12px;
    font-style: italic;
  }
  .ledger-footer-note {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px dashed rgba(122,26,26,.28);
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    font-style: italic;
  }

  /* State cards */
  .state-card {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    padding: 44px 26px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    color: rgba(255,255,255,.85);
    font-family: "Courier Prime", monospace;
  }
  .state-card .emoji { font-size: 48px; margin-bottom: 14px; line-height: 1; }
  .state-card h2 {
    font-family: "Playfair Display", serif;
    font-size: 26px; margin: 0 0 10px; font-weight: 600; color: #fff;
  }
  .state-card p { font-size: 13px; color: rgba(255,255,255,.6); line-height: 1.7; margin: 0 0 20px; }
  .state-card .btn {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 800;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    transition: .2s ease;
    text-decoration: none;
    font-family: "Courier Prime", monospace;
  }
  .state-card .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile */
  @media (max-width: 700px) {
    .chrome { padding: 14px 15px 8px; }
    .chrome-back { font-size: 11px; padding: 7px 12px; }
    .chrome-btn { font-size: 11px; padding: 8px 13px; }
    .ledger-wrap { padding: 8px 12px 60px; }
    .ledger-doc { padding: 32px 24px 30px; }
    .ledger-title { font-size: 26px; letter-spacing: -.6px; }
    .ledger-subtitle { font-size: 14px; letter-spacing: .32em; }
    .ledger-subhead { font-size: 15px; }
    .ledger-seal { width: 70px; height: 70px; font-size: 32px; }
    .identity-row { font-size: 15px; }
    .id-value { font-size: 13px; }
    .ledger-section h3 { font-size: 11px; letter-spacing: .2em; }
    .section-note { font-size: 13px; }
    .row-label { font-size: 14px; }
    .row-value { font-size: 13px; }
    .flag-chip { font-size: 12px; padding: 3px 10px 3px 5px; }
    .flag-chip .flag-emoji { font-size: 15px; }
    .sig-line { font-size: 26px; min-width: 160px; }
    .sig-date, .sig-label { font-size: 12px; }
    .ledger-footer-note { font-size: 11px; }
  }

  /* Print */
  @media print {
    @page { margin: 15mm; size: A4; }
    body { background: #fff !important; }
    .chrome { display: none !important; }
    .ledger-wrap { max-width: none; padding: 0; }
    .ledger-doc {
      box-shadow: none;
      border: 1px solid #ccc;
      background: #fbf6e8;
      page-break-inside: avoid;
    }
    .ledger-doc::before, .ledger-doc::after { display: none; }
    .ledger-section { page-break-inside: avoid; }
    .ledger-seal {
      background: radial-gradient(circle at 30% 30%, #c9302c 0%, #9a2422 55%, #6e1a18 100%) !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="chrome" id="chrome">
  <a href="profile.html" class="chrome-back" id="chrome-back">← Profile</a>
  <div class="chrome-actions">
    <button class="chrome-btn primary" type="button" onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>
</div>

<main class="ledger-wrap" id="root">
  <div class="state-card">
    <div class="spinner"></div>
    <p>Opening the ledger…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  const sb = window.wr ? window.wr.sb : null;
  if (!sb) {
    document.getElementById('root').innerHTML = '<div class="state-card"><h2>Error</h2><p>Auth library failed to load.</p></div>';
    return;
  }

  const root = document.getElementById('root');
  const chrome = document.getElementById('chrome');
  const chromeBack = document.getElementById('chrome-back');

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function flagFor(cc) {
    if (!cc || cc.length !== 2) return '🌍';
    const A = 0x1F1E6;
    return String.fromCodePoint(
      A + cc.toUpperCase().charCodeAt(0) - 65,
      A + cc.toUpperCase().charCodeAt(1) - 65
    );
  }
  function formatDate(iso) {
    const d = new Date(iso);
    const day = d.getDate();
    const month = d.toLocaleString('en-US', { month: 'long' });
    const year = d.getFullYear();
    // "27th day of October, 2026"
    const suffix = (day % 10 === 1 && day !== 11) ? 'st'
                 : (day % 10 === 2 && day !== 12) ? 'nd'
                 : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
    return `${day}${suffix} day of ${month}, ${year}`;
  }
  function shortDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function ordinal(n) {
    const v = Number(n) || 0;
    const s = ['th','st','nd','rd'];
    const m = v % 100;
    return v + (s[(m - 20) % 10] || s[m] || s[0]);
  }
  function chapterLabel(n) {
    const v = Number(n) || 1;
    const roman = ['', 'I','II','III','IV','V','VI','VII','VIII','IX','X',
      'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
    return roman[v] || String(v);
  }

  function renderSignIn() {
    chrome.style.display = 'none';
    root.innerHTML = `
      <div class="state-card">
        <div class="emoji">🔒</div>
        <h2>Sign in required</h2>
        <p>Every lifetime ledger is private to the Rack. Sign in to view yours.</p>
        <div>
          <a class="btn" href="login.html">Sign in</a>
        </div>
      </div>
    `;
  }
  function renderError(title, message) {
    chrome.style.display = 'none';
    root.innerHTML = `
      <div class="state-card">
        <div class="emoji">⚡</div>
        <h2>${esc(title)}</h2>
        <p>${esc(message)}</p>
        <a class="btn" href="index.html">← Back to the Rack</a>
      </div>
    `;
  }

  function renderDocument(ledger, isOwn, countryCodeMap, countryNameMap) {
    // Resolve user's country
    let countryFlag = '🌍';
    let countryName = 'Somewhere';
    const raw = ledger.country || '';
    if (raw.length === 2) {
      countryFlag = flagFor(raw);
      countryName = countryCodeMap[raw.toUpperCase()] || raw;
    } else if (raw) {
      const code = countryNameMap[raw.toLowerCase()];
      if (code) {
        countryFlag = flagFor(code);
        countryName = raw;
      } else {
        countryName = raw;
      }
    }

    // Chapters
    const chap = chapterLabel(ledger.chapter_number);

    // Countries array
    const countries = Array.isArray(ledger.countries_corresponded)
      ? ledger.countries_corresponded
      : [];

    // Top correspondent
    let topCorrespondentLine = `<span class="row-value muted">None yet</span>`;
    if (ledger.top_correspondent_country) {
      const topFlag = flagFor(ledger.top_correspondent_country);
      const topName = countryCodeMap[ledger.top_correspondent_country] || ledger.top_correspondent_country;
      const cnt = Number(ledger.top_correspondent_count) || 0;
      topCorrespondentLine = `<span class="row-value">${topFlag} ${esc(topName)} — ${cnt}</span>`;
    }

    // Signature
    const today = formatDate(new Date().toISOString());

    // "Empty" flag
    const totalActivity = Number(ledger.letters_sent || 0)
      + Number(ledger.exchanges_sent || 0)
      + Number(ledger.yaps_posted || 0)
      + Number(ledger.tapes_posted || 0)
      + Number(ledger.gifts_sent || 0);
    const isEmpty = totalActivity === 0;

    const subtitle = isOwn
      ? 'Your Lifetime Ledger'
      : `${esc(ledger.username)}'s Lifetime Ledger`;

    const subhead = isEmpty
      ? 'A fresh ledger — every page awaits its first entry.'
      : `Chapter ${chap} · Member since ${shortDate(ledger.joined_at)} · ${ordinal(ledger.days_on_rack)} day${Number(ledger.days_on_rack) === 1 ? '' : 's'} on the Rack`;

    // Flags chips
    const flagsChips = countries.map(cc => {
      const flag = flagFor(cc);
      const name = countryCodeMap[cc] || cc;
      return `<span class="flag-chip"><span class="flag-emoji">${flag}</span>${esc(name)}</span>`;
    }).join('');

    chromeBack.href = isOwn ? 'profile.html' : `profile.html?id=${encodeURIComponent(ledger.user_id)}`;
    chromeBack.textContent = isOwn ? '← Your profile' : `← ${ledger.username}`;

    root.innerHTML = `
      <div class="ledger-doc">

        <div class="ledger-seal-wrap">
          <div class="ledger-seal">📖</div>
        </div>

        <div class="ledger-title-block">
          <h1 class="ledger-title">The Whacky Rack</h1>
          <p class="ledger-subtitle">Lifetime Ledger</p>
          <p class="ledger-subhead">${subhead}</p>
        </div>

        <div class="ledger-rule"></div>

        <div class="ledger-identity">
          <div class="identity-row">
            <span class="id-label">Account Holder</span>
            <span class="id-leader"></span>
            <span class="id-value">${esc(ledger.username)}</span>
          </div>
          <div class="identity-row">
            <span class="id-label">Rank</span>
            <span class="id-leader"></span>
            <span class="id-value">#${ledger.rank}</span>
          </div>
          <div class="identity-row">
            <span class="id-label">Country of Residence</span>
            <span class="id-leader"></span>
            <span class="id-value">${countryFlag} ${esc(countryName)}</span>
          </div>
          <div class="identity-row">
            <span class="id-label">Member Since</span>
            <span class="id-leader"></span>
            <span class="id-value">${shortDate(ledger.joined_at)}</span>
          </div>
        </div>

        <div class="ledger-rule"></div>

        <section class="ledger-section">
          <h3>The Letters</h3>
          <p class="section-note">Correspondence sent across the sea.</p>

          <div class="ledger-row">
            <span class="row-label">Letters sent</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.letters_sent) || 0}</span>
          </div>
          <div class="ledger-row">
            <span class="row-label">Bottles cast</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.bottles_sent) || 0}</span>
          </div>
          <div class="ledger-row">
            <span class="row-label">Bottles beached</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.bottles_beached) || 0}</span>
          </div>
          <div class="ledger-row">
            <span class="row-label">Exchanges sent</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.exchanges_sent) || 0}</span>
          </div>
          <div class="ledger-row">
            <span class="row-label">Exchanges received</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.exchanges_received) || 0}</span>
          </div>
          <div class="ledger-row">
            <span class="row-label">Conversations</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.conversations_count) || 0}</span>
          </div>
          <div class="ledger-row">
            <span class="row-label">Permanent pen pals</span>
            <span class="row-leader"></span>
            <span class="row-value">${Number(ledger.permanent_pen_pals) || 0}</span>
          </div>
        </section>

        <div class="ledger-rule"></div>

        <section class="ledger-section">
          <h3>The World</h3>
          <p class="section-note">Where your words have travelled.</p>

          <div class="ledger-row">
            <span class="row-label">Countries corresponded with</span>
            <span class="row-leader"></span>
            <span class="row-value">${countries.length}</span>
          </div>

          ${countries.length > 0
            ? `<div class="flags-row">${flagsChips}</div>`
            : `<div class="row-value muted" style="text-align:left; padding: 4px 0 12px;">No travel yet.</div>`
          }

          <div class="ledger-row">
            <span class="row-label">Top correspondent</span>
            <span class="row-leader"></span>
            ${topCorrespondentLine}
          </div>
          <div class="ledger-row">
            <span class="row-label">Longest conversation</span>
            <span class="row-leader"></span>
