<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correspondence — The Letter Globe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff5a36;
    --accent-dark: #e84625;
    --bg: #141920;
    --paper: #fbf6e8;
    --paper-2: #fff5f0;
    --ink: #2b2536;
    --muted: #9a8f7c;
    --airmail-red: #d33a3a;
    --airmail-blue: #26478f;
    --border: rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: "Courier Prime", monospace;
    background: radial-gradient(circle at 50% 10%, #55606d 0%, #2a323c 55%, #141920 100%);
    background-attachment: fixed;
    color: #fff;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  .top-bar {
    position: sticky; top: 0;
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
    background: rgba(20,25,32,.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 900; letter-spacing: -.5px; }
  .brand span { color: var(--accent); }
  .top-back { color: #fff; opacity: .7; font-size: 13px; padding: 8px 12px; transition: .15s ease; }
  .top-back:hover { opacity: 1; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 22px 200px; }

  .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,.55); font-size: 14px; }
  .loading .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gate { text-align: center; padding: 60px 20px; max-width: 480px; margin: 0 auto; }
  .gate .emoji { font-size: 52px; margin-bottom: 14px; line-height: 1; }
  .gate h1 { font-family: "Caveat", cursive; font-size: 34px; margin: 0 0 10px; font-weight: 600; }
  .gate p { font-size: 14px; color: rgba(255,255,255,.65); line-height: 1.7; margin: 0 0 22px; }
  .gate .btn {
    display: inline-block; padding: 12px 22px; border-radius: 50px;
    font-size: 13px; font-weight: 800; transition: .2s ease;
  }
  .gate .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  .gate .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .gate .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); }
  .gate .btn-ghost:hover { background: rgba(255,255,255,.1); }

  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-family: "Caveat", cursive; font-size: 38px; margin: 0 0 4px; font-weight: 600; }
  .page-head p { font-size: 13px; color: rgba(255,255,255,.55); margin: 0; line-height: 1.6; }

  .empty {
    text-align: center; padding: 60px 20px;
    background: rgba(255,255,255,.03);
    border: 1px dashed rgba(255,255,255,.15);
    border-radius: 16px;
  }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; line-height: 1; }
  .empty h2 { font-family: "Caveat", cursive; font-size: 28px; margin: 0 0 8px; font-weight: 600; }
  .empty p { font-size: 13px; color: rgba(255,255,255,.6); line-height: 1.6; margin: 0 0 20px; }
  .empty .btn {
    display: inline-block; padding: 12px 22px; border-radius: 50px;
    font-size: 13px; font-weight: 800;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    transition: .2s ease;
  }
  .empty .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  .thread-header {
    background: var(--paper); color: var(--ink);
    border-radius: 16px; padding: 18px 22px; margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .thread-header .big-flag { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .thread-header .info { flex: 1; min-width: 200px; }
  .thread-header .info h1 {
    font-family: "Caveat", cursive; font-size: 26px;
    margin: 0 0 4px; font-weight: 600; color: var(--ink);
  }
  .thread-header .info .meta { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .thread-header .info .meta .permanent-badge { display: inline-block; margin-left: 6px; }

  .penpal-banner {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 14px 18px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .penpal-banner.is-permanent { background: #fef9e0; border-color: #fde68a; color: var(--ink); }
  .penpal-banner .text { flex: 1; min-width: 200px; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.75); }
  .penpal-banner.is-permanent .text { color: var(--ink); }
  .penpal-banner .text strong { color: #fff; }
  .penpal-banner.is-permanent .text strong { color: #92400e; }
  .penpal-banner .btn {
    padding: 9px 18px; border-radius: 50px; font-size: 12px; font-weight: 800;
    cursor: pointer; border: 1px solid transparent; transition: .2s ease; white-space: nowrap;
  }
  .penpal-banner .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .penpal-banner .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .penpal-banner .progress-bar {
    flex: 1; height: 5px; background: rgba(0,0,0,.2);
    border-radius: 3px; overflow: hidden; max-width: 140px; min-width: 80px;
  }
  .penpal-banner .progress-fill {
    height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s;
  }
  .penpal-banner .progress-fill.done { background: #16a34a; }

  .letter-stage { position: relative; padding-bottom: 42px; margin-bottom: 8px; }
  .letter-stage.no-stack { padding-bottom: 0; margin-bottom: 0; }

  .stack-shadow {
    position: absolute; left: 0; right: 0; top: 0; bottom: 42px;
    background: var(--paper); border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    pointer-events: none;
  }
  .stack-shadow.s1 { transform: translate(6px, 12px) rotate(0.6deg); opacity: 0.65; z-index: 1; }
  .stack-shadow.s2 { transform: translate(-5px, 24px) rotate(-0.4deg); opacity: 0.45; z-index: 0; }
  .stack-shadow.s3 { transform: translate(3px, 34px) rotate(0.3deg); opacity: 0.3; z-index: -1; }

  .letter-card { position: relative; z-index: 10; transition: opacity 0.25s ease, transform 0.25s ease; }
  .letter-card.switching-out { opacity: 0; transform: translateY(-12px) scale(0.98); }

  .airmail-frame {
    padding: 10px; border-radius: 8px;
    background: repeating-linear-gradient(45deg,
      var(--airmail-red) 0 12px, #fff 12px 24px,
      var(--airmail-blue) 24px 36px, #fff 36px 48px);
    box-shadow: 0 25px 50px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.3);
  }
  .letter-inner {
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0 1px, transparent 1px 24px);
    border-radius: 4px; padding: 26px 28px 22px;
    min-height: 260px; position: relative;
  }

  /* Stamp system (kept from previous batch) */
  .stamp {
    position: relative; background: #fff; transform: rotate(2deg);
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.32));
    --scale: 1;
    width: calc(84px * var(--scale)); height: calc(100px * var(--scale));
    padding: calc(6px * var(--scale));
    --r: calc(4px * var(--scale));
    -webkit-mask:
      radial-gradient(circle var(--r) at 50% 0,    #0000 97%, #000) top    / calc(2 * var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 50% 100%, #0000 97%, #000) bottom / calc(2 * var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 0 50%,    #0000 97%, #000) left   / var(--r) calc(2 * var(--r)) repeat-y,
      radial-gradient(circle var(--r) at 100% 50%, #0000 97%, #000) right  / var(--r) calc(2 * var(--r)) repeat-y,
      linear-gradient(#000,#000) center / calc(100% - 2 * var(--r)) calc(100% - 2 * var(--r)) no-repeat;
    mask:
      radial-gradient(circle var(--r) at 50% 0,    #0000 97%, #000) top    / calc(2 * var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 50% 100%, #0000 97%, #000) bottom / calc(2 * var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 0 50%,    #0000 97%, #000) left   / var(--r) calc(2 * var(--r)) repeat-y,
      radial-gradient(circle var(--r) at 100% 50%, #0000 97%, #000) right  / var(--r) calc(2 * var(--r)) repeat-y,
      linear-gradient(#000,#000) center / calc(100% - 2 * var(--r)) calc(100% - 2 * var(--r)) no-repeat;
    flex-shrink: 0;
  }
  .stamp.stamp-sm { --scale: 0.76; }
  .stamp.stamp-md { --scale: 0.84; }

  .stamp .stamp-inner {
    height: 100%; font-size: calc(13px * var(--scale));
    font-family: "Courier Prime", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; position: relative; overflow: hidden;
  }
  .stamp-country {
    font-size: 0.42em; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; line-height: 1; width: 100%; z-index: 1;
  }
  .stamp-art {
    flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .stamp-emblem { font-size: 2.4em; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.22)); z-index: 1; }
  .stamp-value { font-size: 1em; font-weight: 700; line-height: 1; width: 100%; z-index: 1; }

  .stamp-blossom .stamp-inner {
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.6) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.5) 0%, transparent 40%),
      linear-gradient(165deg, #fef4f6 0%, #fbe0e8 55%, #f4c3d2 100%);
    border: 1px solid #8b3a5a;
    padding: 0.5em 0.4em 0.4em;
  }
  .stamp-blossom .stamp-country { color: #8b3a5a; }
  .stamp-blossom .stamp-value { color: #8b3a5a; }

  .stamp-formal .stamp-inner {
    background: linear-gradient(180deg, #f7f3e8 0%, #f0e8d4 100%);
    border: 1.5px solid #c9a227; padding: 0;
  }
  .stamp-formal .stamp-top-band {
    background: #8b2c3d; color: #f0e8d4; width: 100%;
    padding: 0.3em 0.3em 0.25em;
    font-size: 0.38em; font-weight: 700; letter-spacing: .16em; text-align: center;
  }
  .stamp-formal .stamp-art { padding: 0.3em 0; }
  .stamp-formal .stamp-art-ring {
    width: 3.4em; height: 3.4em; border-radius: 50%;
    border: 1px solid #8b2c3d;
    display: flex; align-items: center; justify-content: center;
    position: relative; background: rgba(201,162,39,.08);
  }
  .stamp-formal .stamp-art-ring::before {
    content: ""; position: absolute; inset: 0.25em; border-radius: 50%;
    border: 1px dashed rgba(139,44,61,.4);
  }
  .stamp-formal .stamp-emblem { font-size: 1.7em; }
  .stamp-formal .stamp-value { color: #8b2c3d; padding-bottom: 0.3em; font-size: 1.05em; }

  .stamp-tricolor .stamp-inner {
    background: var(--tricolor,
      linear-gradient(180deg, #ff9933 0%, #ffe0b3 22%, #f7f3e8 50%, #c3e8c3 78%, #138808 100%));
    border: 1px solid #000; padding: 0.35em;
  }
  .stamp-tricolor .stamp-inner::before {
    content: ""; position: absolute; inset: 0.3em;
    border: 1px solid rgba(0,0,0,.35); border-radius: 2px; pointer-events: none;
  }
  .stamp-tricolor .stamp-inner::after {
    content: ""; position: absolute; inset: 0.5em;
    border: 0.5px dashed rgba(0,0,0,.3); border-radius: 1px; pointer-events: none;
  }
  .stamp-tricolor .stamp-country { color: #000; font-weight: 800; }
  .stamp-tricolor .stamp-emblem  { font-size: 2.2em; }
  .stamp-tricolor .stamp-value   { color: #000; font-weight: 900; font-size: 1.05em; }

  /* List postcard */
  #conv-card .airmail-frame { cursor: pointer; transition: transform .2s ease; }
  #conv-card .airmail-frame:hover { transform: translateY(-2px); }
  .conv-postcard {
    display: grid; grid-template-columns: 1fr 2px 1fr;
    min-height: 340px; border-radius: 4px; overflow: hidden;
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0 1px, transparent 1px 24px);
  }
  .conv-postcard .divider { background: linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.12)); margin: 14px 0; }
  .conv-postcard .left { padding: 26px 24px 22px; min-width: 0; display: flex; flex-direction: column; }
  .conv-postcard .left .salut {
    font-family: "Caveat", cursive; font-size: 24px; margin: 0 0 10px; color: var(--ink);
  }
  .conv-postcard .conv-preview {
    font-family: "Caveat", cursive; font-size: 18px; line-height: 1.55;
    color: #3a3448; white-space: pre-wrap; word-wrap: break-word;
    margin: 0 0 12px; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden;
  }
  .conv-postcard .sign {
    font-family: "Caveat", cursive; font-size: 18px;
    text-align: right; margin-top: auto; padding-top: 8px; color: var(--ink);
  }
  .conv-postcard .right { position: relative; padding: 18px 20px 18px; min-width: 0; display: flex; flex-direction: column; }
  .conv-postcard .right .stamp { position: absolute; top: 16px; right: 18px; }
  .conv-postcard .postmark {
    position: absolute; top: 46px; right: 100px;
    width: 82px; height: 82px; border-radius: 50%;
    display: grid; place-items: center; text-align: center;
    transform: rotate(-15deg);
    border: 2px solid rgba(38,71,143,.45);
    color: rgba(38,71,143,.7);
    font-size: 7px; letter-spacing: .1em; line-height: 1.5;
  }
  .conv-postcard .postmark::before {
    content: ""; position: absolute; inset: 5px;
    border: 1px dashed rgba(38,71,143,.35); border-radius: 50%;
  }
  .conv-postcard .addr { margin-top: auto; padding-top: 90px; }
  .conv-postcard .addr .label {
    font-size: 8px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }
  .conv-postcard .addr .line {
    font-family: "Caveat", cursive; font-size: 18px;
    color: #2f2a3d; padding: 8px 4px 4px;
    border-bottom: 1px solid rgba(0,0,0,.22);
    word-wrap: break-word; line-height: 1.35;
  }
  .conv-postcard .progress-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .conv-postcard .progress-bar {
    flex: 1; height: 4px; background: rgba(0,0,0,.08);
    border-radius: 2px; overflow: hidden;
  }
  .conv-postcard .progress-fill {
    height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s;
  }
  .conv-postcard .progress-fill.done { background: #16a34a; }
  .conv-postcard .progress-text {
    font-family: "Courier Prime", monospace; font-size: 10px;
    font-weight: 700; color: var(--muted); min-width: 32px; text-align: right;
  }
  .conv-postcard .last-meta {
    font-family: "Courier Prime", monospace; font-size: 10px;
    color: var(--muted); margin-top: 8px; letter-spacing: .02em;
  }
  .conv-postcard .permanent-pill {
    display: inline-block; background: #fef3c7; color: #92400e;
    font-size: 9px; font-weight: 900; letter-spacing: .05em;
    padding: 2px 8px; border-radius: 50px; margin-top: 6px; align-self: flex-start;
  }

  /* Thread card */
  .letter-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
  .sender-label {
    flex: 1; min-width: 0;
    font-family: "Courier Prime", monospace; font-size: 12px;
    color: #666; line-height: 1.5; padding-top: 6px;
  }
  .sender-label .you { color: var(--accent-dark); font-weight: 800; }
  .sender-label .from { font-weight: 700; }
  .card-badge {
    display: inline-block; background: #fef3c7; color: #92400e;
    font-size: 9px; font-weight: 900; letter-spacing: .1em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 50px;
    margin-left: 8px; vertical-align: middle;
  }
  .no-stamp-placeholder {
    width: 64px; height: 76px; flex-shrink: 0;
    border: 1px dashed rgba(0,0,0,.18);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(0,0,0,.3); font-size: 16px;
    position: relative;
  }
  .no-stamp-placeholder::after {
    content: "drift"; position: absolute; bottom: 3px; right: 4px;
    font-size: 6px; letter-spacing: .12em; text-transform: uppercase;
  }
  .letter-body {
    font-family: "Caveat", cursive; font-size: 21px; line-height: 1.6;
    color: #3a3448; white-space: pre-wrap; word-wrap: break-word;
    margin: 0 0 14px;
  }
  .letter-meta {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 18px; padding-top: 14px;
    border-top: 1px dashed rgba(0,0,0,.14);
    font-family: "Courier Prime", monospace; font-size: 11px;
    color: var(--muted); flex-wrap: wrap;
  }
  .letter-meta .position {
    background: rgba(0,0,0,.05); padding: 3px 9px;
    border-radius: 50px; font-weight: 800; letter-spacing: .03em;
  }

  .translate-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 50px;
    background: rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.1);
    color: #666; font-family: "Courier Prime", monospace;
    font-size: 11px; font-weight: 700; cursor: pointer;
    transition: .15s ease; margin: 2px 0 4px;
  }
  .translate-pill:hover:not(:disabled) {
    background: #fff; border-color: rgba(0,0,0,.22); color: #333;
  }
  .translate-pill:disabled, .translate-pill.loading { opacity: .55; cursor: wait; }
  .translate-pill.translated {
    background: rgba(255, 90, 54, .12);
    border-color: rgba(255, 90, 54, .35);
    color: var(--accent-dark);
  }

  /* === Gift card in thread === */
  .gift-inner { min-height: 200px; }
  .gift-status-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px;
  }
  .gift-status-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0;
    background: var(--paper-2);
    border: 2px dashed rgba(255,90,54,.4);
  }
  .gift-status-header.delivered .gift-status-icon {
    background: #dcfce7;
    border: 2px solid #16a34a;
  }
  .gift-status-text { flex: 1; min-width: 0; }
  .gift-status-title {
    font-family: "Caveat", cursive;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 3px;
  }
  .gift-status-sub {
    font-family: "Courier Prime", monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }
  .gift-in-transit-meta {
    background: rgba(0,0,0,.03);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 6px;
    font-family: "Courier Prime", monospace;
    font-size: 11px;
    color: #555;
  }
  .gift-in-transit-meta strong {
    display: inline-block;
    margin-right: 6px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .06em;
    font-size: 9px;
    text-transform: uppercase;
  }
  .gift-delivered-thumb {
    display: flex; gap: 12px; align-items: center;
    background: #fff;
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .gift-thumb-img {
    width: 60px; height: 60px;
    border-radius: 8px;
    background: var(--paper-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .gift-thumb-img img { width: 100%; height: 100%; object-fit: cover; }
  .gift-thumb-info { flex: 1; min-width: 0; }
  .gift-thumb-name {
    font-family: "Caveat", cursive;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 3px;
  }
  .gift-thumb-meta {
    font-family: "Courier Prime", monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .gift-reveal {

  /* === Modals === */

  .gift-preview-name {

  .gift-message-label {
    display: block;

    font-weight: 800;

    text-transform: uppercase;

  }
  .gift-message-ta {
    width: 100%;

  @media (max-width: 700px) {

    .letter-nav { flex-wrap: wrap; }

    .gift-status-title { font-size: 19px; }

    .composer { padding: 10px 15px 14px; }

  .toast-container {
    position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
    z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    padding: 12px 20px; border-radius: 50px;
    background: #16a34a; color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    animation: toastIn .2s ease-out;
  }
  .toast.err { background: #dc2626; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>

<body>

<div class="top-bar">
  <a href="index.html" class="brand">The <span>Whacky</span> Rack</a>
  <div class="top-actions">
    <a href="letters-globe.html" class="top-back" id="top-back">← The Globe</a>
  </div>
</div>

<main id="root" class="wrap">
  <div class="loading">
    <div class="spinner"></div>
    <div>Opening the correspondence…</div>
  </div>
</main>

<div class="toast-container" id="toast-container"></div>

<!-- Gift gallery modal -->
<div class="modal" id="gift-gallery-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-inner" style="max-width: 640px;">
    <h3>Choose a gift</h3>
    <p>Symbolic gifts, sent as a courier package. Select one to continue.</p>
    <div class="gift-grid" id="gift-grid">
      <div class="gift-grid-loading">Loading gifts…</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="gift-gallery-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<!-- Gift message modal -->
<div class="modal" id="gift-message-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-inner" style="max-width: 500px;">
    <h3>Send this gift</h3>
    <p>Add an optional message. It will arrive with the package.</p>

    <div id="gift-preview"></div>

    <label class="gift-message-label" for="gift-message-text">Message <span style="text-transform:none; letter-spacing:0; font-weight:500; color:#aaa;">(optional, up to 300 chars)</span></label>
    <textarea id="gift-message-text" class="gift-message-ta" maxlength="300" placeholder="A short note to accompany the gift…"></textarea>
    <div class="gift-message-count"><span id="gift-message-count">0</span> / 300</div>

    <div class="modal-status" id="gift-send-status"></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="gift-message-back" type="button">Back</button>
      <button class="btn btn-primary" id="gift-message-send" type="button">Send gift →</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  const sb = window.wr ? window.wr.sb : null;
  if (!sb) {
    document.getElementById('root').innerHTML = '<div class="err-card">Auth library failed to load.</div>';
    return;
  }

  /* ---------- Stamp lookup ---------- */
  const COUNTRY_STAMPS = {
    JP: { style: 'blossom',  emblem: '🌸', value: '¥10',    label: 'NIPPON POST' },
    CN: { style: 'blossom',  emblem: '🐉', value: '¥10',    label: 'CHINA POST' },
    SG: { style: 'blossom',  emblem: '🦁', value: 'S$2',    label: 'SINGAPORE POST' },
    DE: { style: 'formal',   emblem: '🦅', value: '10',     label: 'DEUTSCHE POST' },
    GB: { style: 'formal',   emblem: '👑', value: '1st',    label: 'ROYAL MAIL' },
    FR: { style: 'formal',   emblem: '🗼', value: '10c',    label: 'LA POSTE' },
    NL: { style: 'formal',   emblem: '🌷', value: '1',      label: 'POSTNL' },
    SE: { style: 'formal',   emblem: '❄️', value: '10 kr',  label: 'POSTNORD' },
    PL: { style: 'formal',   emblem: '🦅', value: '10 zł',  label: 'POCZTA POLSKA' },
    IT: { style: 'formal',   emblem: '🏛️', value: '€1',     label: 'POSTE ITALIANE' },
    ES: { style: 'formal',   emblem: '🐂', value: '€1',     label: 'CORREOS' },
    US: { style: 'formal',   emblem: '🗽', value: '5¢',     label: 'US POSTAGE' },
    CA: { style: 'formal',   emblem: '🍁', value: '10¢',    label: 'CANADA POST' },
    AU: { style: 'formal',   emblem: '🦘', value: '$1',     label: 'AUSTRALIA POST' },
    IN: { style: 'tricolor', emblem: '🦚', value: '₹10',    label: 'INDIA POST' },
    BR: { style: 'tricolor', emblem: '🦜', value: 'R$2',    label: 'CORREIOS' },
    MX: { style: 'tricolor', emblem: '🦅', value: '$5',     label: 'CORREOS MX' },
    SA: { style: 'tricolor', emblem: '🌙', value: '10 SAR', label: 'SAUDI POST' },
    AE: { style: 'tricolor', emblem: '🦅', value: '10 AED', label: 'EMIRATES POST' }
  };
  const TRICOLOR_COLORS = {
    IN: '#ff9933, #ffe0b3, #f7f3e8, #c3e8c3, #138808',
    BR: '#009c3b, #ffdf00, #f7f3e8, #ffdf00, #002776',
    MX: '#006847, #f7f3e8, #ce1126',
    SA: '#006c35, #f7f3e8, #006c35',
    AE: '#00732f, #f7f3e8, #000000'
  };

  const root        = document.getElementById('root');
  const toastBox    = document.getElementById('toast-container');
  const topBack     = document.getElementById('top-back');

  const PERMANENT_THRESHOLD = 10;

  let session = null;
  let convStack = [];
  let listIndex = 0;
  let currentConv = null;
  let currentLetter = null;
  let currentExchanges = [];
  let currentGifts = [];
  let currentState = null;
  let stackedLetters = [];
  let currentIndex = 0;
  let myCountry = null;
  let otherPartyCountryName = '';
  let translateCache = {};

  // Gift flow state
  let giftEligibility = null;
  let giftCatalog = null;
  let selectedGift = null;
  let sendingGift = false;

  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function flagFor(cc) {
    if (!cc || cc.length !== 2) return '🌍';
    const A = 0x1F1E6;
    return String.fromCodePoint(
      A + cc.toUpperCase().charCodeAt(0) - 65,
      A + cc.toUpperCase().charCodeAt(1) - 65
    );
  }
  function timeAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return d.toLocaleDateString();
  }
  function toast(msg, kind = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'err' ? ' err' : '');
    el.textContent = msg;
    toastBox.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }
  function getTargetLangCode() {
    return ((navigator.language || 'en').split('-')[0] || 'en').toLowerCase();
  }

  /* ---------- Stamp builder ---------- */
  function buildStampHtml(countryCode, sizeClass = '') {
    if (!countryCode) return '';
    const cc = String(countryCode).toUpperCase();
    const cfg = COUNTRY_STAMPS[cc];
    if (!cfg) return '';
    const size = sizeClass ? ' ' + sizeClass : '';
    const gradientStyle = cfg.style === 'tricolor' && TRICOLOR_COLORS[cc]
      ? `style="--tricolor: linear-gradient(180deg, ${TRICOLOR_COLORS[cc]});"`
      : '';

    if (cfg.style === 'blossom') {
      return `<div class="stamp stamp-blossom${size}" ${gradientStyle}><div class="stamp-inner"><div class="stamp-country">${esc(cfg.label)}</div><div class="stamp-art"><span class="stamp-emblem">${cfg.emblem}</span></div><div class="stamp-value">${esc(cfg.value)}</div></div></div>`;
    }
    if (cfg.style === 'formal') {
      return `<div class="stamp stamp-formal${size}" ${gradientStyle}><div class="stamp-inner"><div class="stamp-top-band">${esc(cfg.label)}</div><div class="stamp-art"><div class="stamp-art-ring"><span class="stamp-emblem">${cfg.emblem}</span></div></div><div class="stamp-value">${esc(cfg.value)}</div></div></div>`;
    }
    if (cfg.style === 'tricolor') {
      return `<div class="stamp stamp-tricolor${size}" ${gradientStyle}><div class="stamp-inner"><div class="stamp-country">${esc(cfg.label)}</div><div class="stamp-art"><span class="stamp-emblem">${cfg.emblem}</span></div><div class="stamp-value">${esc(cfg.value)}</div></div></div>`;
    }
    return '';
  }

  /* ---------- Translation ---------- */
  async function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), ms);
    try { return await fetch(url, { signal: controller.signal }); }
    finally { clearTimeout(t); }
  }
  async function translateText(text) {
    const target = getTargetLangCode();
    try {
      const url = 'https://lingva.ml/api/v1/auto/' + target + '/' + encodeURIComponent(text);
      const res = await fetchWithTimeout(url, 6000);
      if (res.ok) {
        const data = await res.json();
        if (data && data.translation) return data.translation;
      }
    } catch (e) { console.warn('[translate] Lingva failed:', e); }
    try {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
                  target + '&dt=t&q=' + encodeURIComponent(text);
      const res = await fetchWithTimeout(url, 6000);
      if (res.ok) {
        const data = await res.json();
        if (data && Array.isArray(data[0])) {
          const t = data[0].map(row => row && row[0] ? row[0] : '').join('');
          if (t) return t;
        }
      }
    } catch (e) { console.warn('[translate] Google fallback failed:', e); }
    throw new Error('Translation service unavailable');
  }
  async function handleTranslateClick(pill) {
    const key = pill.dataset.translateKey;
    if (!key) return;
    const bodyEl = document.getElementById('letter-body');
    if (!bodyEl) return;
    const entry = stackedLetters.find(x => String(x.id) === String(key));
    if (!entry) return;

    if (!translateCache[key]) {
      translateCache[key] = { originalHtml: esc(entry.body), translatedHtml: null, showing: 'original', fetching: false };
    }
    const cache = translateCache[key];
    if (cache.fetching) return;

    if (cache.translatedHtml) {
      if (cache.showing === 'original') {
        bodyEl.innerHTML = cache.translatedHtml;
        cache.showing = 'translated';
        pill.className = 'translate-pill translated';
        pill.innerHTML = '🌐 Show original';
      } else {
        bodyEl.innerHTML = cache.originalHtml;
        cache.showing = 'original';
        pill.className = 'translate-pill';
        pill.innerHTML = '🌐 Translate';
      }
      return;
    }

    cache.fetching = true;
    pill.classList.add('loading');
    pill.disabled = true;
    const originalLabel = pill.innerHTML;
    pill.textContent = 'Translating…';
    try {
      const translated = await translateText(entry.body);
      cache.translatedHtml = esc(translated);
      cache.showing = 'translated';
      bodyEl.innerHTML = cache.translatedHtml;
      pill.className = 'translate-pill translated';
      pill.innerHTML = '🌐 Show original';
    } catch (err) {
      console.error('[translate] failed:', err);
      pill.innerHTML = originalLabel;
      toast('Translation unavailable right now. Try again in a moment.', 'err');
    } finally {
      cache.fetching = false;
      pill.classList.remove('loading');
      pill.disabled = false;
    }
  }
  document.addEventListener('click', (e) => {
    const pill = e.target.closest('.translate-pill[data-translate-key]');
    if (!pill) return;
    e.preventDefault();
    handleTranslateClick(pill);
  });

  async function getCountryName(code) {
    if (!code) return '';
    try {
      const { data } = await sb.from('countries').select('name').eq('code', code).maybeSingle();
      return data ? data.name : code;
    } catch { return code; }
  }

  /* ============================================================

  async function loadList() {
    topBack.textContent = '← The Globe';
    topBack.href = 'letters-globe.html';

    const { data, error } = await sb.rpc('get_my_conversations');
    if (error) {
      root.innerHTML = `<div class="err-card">Could not load conversations: ${esc(error.message)}</div>`;
      return;
    }
    const convs = data || [];

    if (convs.length === 0) {
      root.innerHTML = `
        <div class="page-head">
          <h1>Your correspondence</h1>
          <p>Every letter you've replied to, every pen pal you've made.</p>
        </div>
        <div class="empty">
          <div class="emoji">📭</div>
          <h2>No letters yet</h2>
          <p>Reply to a letter on the globe to start a correspondence.</p>
          <a class="btn" href="letters-globe.html">Visit the globe</a>
        </div>
      `;
      return;
    }

    const countryNames = {};
    const codes = new Set();
    convs.forEach(c => { if (c.other_party_country) codes.add(c.other_party_country); });
    await Promise.all([...codes].map(async cc => { countryNames[cc] = await getCountryName(cc); }));

    convStack = [...convs].sort((a, b) => {
      const aT = new Date(a.last_exchange_at || a.created_at).getTime();
      const bT = new Date(b.last_exchange_at || b.created_at).getTime();
      return bT - aT;
    });
    listIndex = 0;

    convStack.forEach(c => {
      c.__countryName = countryNames[c.other_party_country] || c.other_party_country || 'a distant country';
    });

    renderListStack();
  }

  function renderListStack() {
    const total = convStack.length;
    root.innerHTML = `
      <div class="page-head">
        <h1>Your correspondence</h1>
        <p>${total} active conversation${total === 1 ? '' : 's'}.</p>
      </div>
      <div class="letter-stage" id="letter-stage">
        <div class="letter-card" id="conv-card"></div>
      </div>
      <div class="letter-nav" id="conv-nav"></div>

    renderConvShadows();
    renderConvCard();

  function renderConvShadows() {
    const stage = document.getElementById('letter-stage');
    const card = document.getElementById('conv-card');
    if (!stage || !card) return;
    stage.querySelectorAll('.stack-shadow').forEach(el => el.remove());
    const total = convStack.length;
    const shadowCount = Math.min(3, total - 1 - listIndex);
    const classes = ['s1', 's2', 's3'];
    for (let i = 0; i < shadowCount; i++) {
      const sh = document.createElement('div');
      sh.className = 'stack-shadow ' + classes[i];
      stage.insertBefore(sh, card);
    }
  }

  function renderConvCard() {
    const card = document.getElementById('conv-card');
    if (!card) return;
    const conv = convStack[listIndex];
    if (!conv) { card.innerHTML = ''; return; }

    const flag = flagFor(conv.other_party_country);
    const name = conv.__countryName || 'a distant country';
    const count = Number(conv.exchange_count) || 0;
    const pct = Math.min(100, (count / PERMANENT_THRESHOLD) * 100);
    const done = count >= PERMANENT_THRESHOLD;
    const preview = (conv.letter_preview || '').trim();
    const lastAt = conv.last_exchange_at || conv.created_at;

    const previewHtml = preview
      ? `<p class="conv-preview">${esc(preview)}${preview.length >= 195 ? '…' : ''}</p>`
      : `<p class="conv-preview" style="opacity:.55; font-style:italic;">(This letter is no longer available.)</p>`;

    const stampHtml = buildStampHtml(conv.other_party_country, 'stamp-md');
    const postmarkHtml = `<div class="postmark"><span>EARTH<br>VIA GLOBE<br>IN TRANSIT</span></div>`;

    card.innerHTML = `
      <div class="airmail-frame" id="conv-card-click">
        <div class="conv-postcard">
          <div class="left">
            <p class="salut">Dear Stranger,</p>
            ${previewHtml}
            <p class="sign">— ${flag} ${esc(name)}</p>
          </div>
          <div class="divider"></div>
          <div class="right">
            ${stampHtml || ''}
            ${postmarkHtml}
            <div class="addr">
              <div class="label">To</div>
              <div class="line">${flag} A correspondent in ${esc(name)}</div>
              <div class="progress-row">
                <div class="progress-bar">
                  <div class="progress-fill${done ? ' done' : ''}" style="width:${pct}%"></div>
                </div>
                <span class="progress-text">${count}/${PERMANENT_THRESHOLD}</span>
              </div>
              <div class="last-meta">${count} letter${count === 1 ? '' : 's'} · last ${timeAgo(lastAt)}</div>
              ${conv.is_permanent ? '<span class="permanent-pill">⭐ Permanent</span>' : ''}
            </div>
          </div>
        </div>
      </div>
    `;

    const clickTarget = document.getElementById('conv-card-click');
    if (clickTarget) {
      clickTarget.addEventListener('click', () => {
        window.location.href = `letters-conversation.html?id=${encodeURIComponent(conv.id)}`;
      });
    }
  }

  function renderConvNav() {
    const nav = document.getElementById('conv-nav');
    if (!nav) return;
    const total = convStack.length;
    const atNewest = listIndex === 0;
    const atOldest = listIndex === total - 1;
    let dotsHtml = '';
    if (total <= 15 && total > 1) {
      dotsHtml = '<div class="nav-dots">';
      for (let i = 0; i < total; i++) {
        dotsHtml += `<button class="nav-dot${i === listIndex ? ' active' : ''}" data-conv-index="${i}" type="button" aria-label="Conversation ${i + 1}"></button>`;
      }
      dotsHtml += '</div>';
    }
    nav.innerHTML = `
      <button class="nav-btn" id="conv-older" type="button" ${atOldest ? 'disabled' : ''}>← Older</button>
      <div class="nav-center">
        <span class="nav-counter">Letter ${listIndex + 1} of ${total}</span>
        ${dotsHtml}
      </div>
      <button class="nav-btn" id="conv-newer" type="button" ${atNewest ? 'disabled' : ''}>Newer →</button>
    `;
    document.getElementById('conv-older')?.addEventListener('click', () => navigateConv(listIndex + 1));
    document.getElementById('conv-newer')?.addEventListener('click', () => navigateConv(listIndex - 1));
    nav.querySelectorAll('[data-conv-index]').forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.dataset.convIndex, 10);
        if (!isNaN(idx)) navigateConv(idx);
      });
    });
  }

  function navigateConv(newIndex) {
    if (newIndex < 0 || newIndex >= convStack.length) return;
    if (newIndex === listIndex) return;
    const card = document.getElementById('conv-card');
    if (!card) { listIndex = newIndex; return; }
    card.classList.add('switching-out');
    setTimeout(() => {
      listIndex = newIndex;
      renderConvShadows();
      renderConvCard();
      renderConvNav();
      card.classList.remove('switching-out');
    }, 250);
  }

  document.addEventListener('keydown', (e) => {
    if (!convStack.length) return;
    if (currentConv) return;
    if (document.querySelector('.modal.open')) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); navigateConv(listIndex + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); navigateConv(listIndex - 1); }
  });

  /* ============================================================
     THREAD VIEW
     ============================================================ */
  async function loadThread(convId) {
    topBack.textContent = '← All conversations';
    topBack.href = 'letters-conversation.html';

    const { data: convs, error: convsErr } = await sb.rpc('get_my_conversations');
    if (convsErr) {
      root.innerHTML = `<div class="err-card">Could not load conversation: ${esc(convsErr.message)}</div>`;
      return;
    }
    const conv = (convs || []).find(c => c.id === convId);
    if (!conv) {
      root.innerHTML = `<div class="err-card">This conversation doesn't exist or has ended. <a href="letters-conversation.html" style="color:inherit; text-decoration:underline; margin-left:8px;">← Back to all conversations</a></div>`;
      return;
    }
    currentConv = conv;

    // Fetch exchanges + gifts + eligibility in parallel
    const [exRes, giftsRes, eligRes] = await Promise.all([
      sb.rpc('get_conversation', { p_conversation_id: convId, p_limit: 500 }),
      sb.rpc('get_conversation_gifts', { p_conversation_id: convId }),
      sb.rpc('get_gift_eligibility', { p_conversation_id: convId })
    ]);

    if (exRes.error) {
      root.innerHTML = `<div class="err-card">Could not load messages: ${esc(exRes.error.message)}</div>`;
      return;
    }
    currentExchanges = exRes.data || [];
    currentGifts = giftsRes.error ? [] : (giftsRes.data || []);
    giftEligibility = eligRes.error ? null : (eligRes.data?.[0] || null);

    try {
      const { data: letterArr } = await sb.rpc('read_letter', { p_letter_id: conv.letter_id });
      currentLetter = letterArr ? letterArr[0] : null;
    } catch (e) { currentLetter = null; }

    currentState = {
      is_permanent: conv.is_permanent === true,
      exchange_count: Number(conv.exchange_count) || 0,
      penpal_author_requested: conv.penpal_author_requested === true,
      penpal_replier_requested: conv.penpal_replier_requested === true,
      i_am_author: conv.i_am_author === true
    };

    try {
      const { data: prof } = await sb.from('profiles').select('country').eq('id', session.user.id).maybeSingle();
      const cc = (prof && prof.country || '').toUpperCase();
      myCountry = /^[A-Z]{2}$/.test(cc) ? cc : null;
    } catch (e) { myCountry = null; }

    try {
      otherPartyCountryName = await getCountryName(currentConv.other_party_country);
    } catch (e) { otherPartyCountryName = currentConv.other_party_country || ''; }

    // Build stackedLetters — letters + gifts sorted by date
    const items = [];
    if (currentLetter) {
      items.push({
        type: 'letter',
        id: '__seed__',
        body: currentLetter.body,
        created_at: currentLetter.created_at,
        _sort_at: new Date(currentLetter.created_at).getTime(),
        is_mine: currentLetter.is_mine === true,
        is_seed: true,
        sender_country: currentLetter.origin_country,
        delivery_mode: currentLetter.delivery_mode
      });
    }
    currentExchanges.forEach(ex => {
      items.push({
        type: 'letter',
        id: ex.id,
        body: ex.body,
        created_at: ex.created_at,
        _sort_at: new Date(ex.created_at).getTime(),
        is_mine: ex.is_mine === true,
        is_seed: false,
        sender_country: ex.is_mine ? myCountry : currentConv.other_party_country,
        delivery_mode: 'static'
      });
    });
    currentGifts.forEach(g => {
      items.push({
        type: 'gift',
        id: g.id,
        _sort_at: new Date(g.shipped_at).getTime(),
        gift: g
      });
    });

    stackedLetters = items.sort((a, b) => a._sort_at - b._sort_at);
    currentIndex = Math.max(0, stackedLetters.length - 1);
    renderThread();
  }

  async function renderThread() {
    const flag = flagFor(currentConv.other_party_country);
    const count = currentState.exchange_count;

      ? ` · ${giftCount} gift${giftCount === 1 ? '' : 's'}`

          <h1>A correspondent in ${esc(otherPartyCountryName || currentConv.other_party_country || 'a distant country')}</h1>

            ${count} letter${count === 1 ? '' : 's'} exchanged${giftSuffix}
            ${currentState.is_permanent ? '<span class="permanent-badge">⭐ Permanent pen pals</span>' : ''}
          </div>
        </div>
      </div>
    `;

    const bannerHtml = renderPenpalBanner();

    root.innerHTML = `
      ${headerHtml}
      ${bannerHtml}
      <div class="letter-stage no-stack" id="letter-stage">
        <div class="letter-card" id="letter-card"></div>
      </div>
      <div class="letter-nav" id="letter-nav"></div>
      <div class="composer">
        <div class="gift-cta-row" id="gift-cta-row"></div>
        <div class="composer-inner">
          <textarea id="compose-input" maxlength="600" placeholder="Write back…"></textarea>
          <button class="send-btn" id="send-btn" type="button" disabled>Send →</button>
        </div>
        <div class="char-count" id="char-count">0 / 600</div>
      </div>

  function renderCard() {
    const card = document.getElementById('letter-card');
    if (!card) return;
    const entry = stackedLetters[currentIndex];
    if (!entry) {
      card.innerHTML = `<div class="airmail-frame"><div class="letter-inner">
        <div class="letter-body">This letter is no longer available.</div>
      </div></div>`;
      return;
    }

    if (entry.type === 'gift') {
      card.innerHTML = renderGiftCardHtml(entry.gift);
      return;
    }

    // Letter entry (existing logic preserved)
    const isMine = entry.is_mine === true;
    const cache = translateCache[String(entry.id)];
    const showingTranslation = cache && cache.showing === 'translated';
    const bodyHtml = showingTranslation ? cache.translatedHtml : esc(entry.body);
    const pillClass = 'translate-pill' + (showingTranslation ? ' translated' : '');
    const pillLabel = showingTranslation ? '🌐 Show original' : '🌐 Translate';

    let senderLabel;
    if (isMine) {
      senderLabel = `<span class="sender-label"><span class="you">✉ You wrote</span>${entry.sender_country ? ' from ' + flagFor(entry.sender_country) + ' ' + esc(entry.sender_country) : ''}</span>`;
    } else {
      const country = entry.sender_country || currentConv.other_party_country;
      const countryName = country === currentConv.other_party_country
        ? (otherPartyCountryName || country)
        : country;
      senderLabel = `<span class="sender-label"><span class="from">${flagFor(country)} A letter from ${esc(countryName || 'somewhere')}</span></span>`;
    }

    const isSeedBottle = entry.is_seed === true && entry.delivery_mode === 'bottle';
    const stampCountry = entry.sender_country || (isMine ? myCountry : currentConv.other_party_country) || '';

    let stampBlockHtml;
    if (isSeedBottle || !stampCountry) {
      stampBlockHtml = `<div class="no-stamp-placeholder" title="A bottle adrift — no postal stamp"></div>`;
    } else {
      stampBlockHtml = buildStampHtml(stampCountry, 'stamp-sm');
    }

    const isLatest = currentIndex === stackedLetters.length - 1;
    const isSeed = entry.is_seed === true;
    let badge = '';
    if (isLatest && !isSeed) badge = '<span class="card-badge">Latest</span>';
    else if (isSeed) badge = '<span class="card-badge">Original</span>';

    card.innerHTML = `
      <div class="airmail-frame">
        <div class="letter-inner">
          <div class="letter-top">
            ${senderLabel.replace('</span>', badge + '</span>')}
            ${stampBlockHtml}
          </div>
          <div class="letter-body" id="letter-body">${bodyHtml}</div>
          <button class="${pillClass}" data-translate-key="${esc(entry.id)}" type="button">${pillLabel}</button>
          <div class="letter-meta">
            <span>${timeAgo(entry.created_at)}</span>
            <span class="position">Letter ${currentIndex + 1} of ${stackedLetters.length}</span>
          </div>
        </div>
      </div>
    `;
  }

  /* ---------- Gift card (three variants) ---------- */
  function renderGiftCardHtml(g) {
    const isDelivered = g.status === 'delivered';
    const isMine = g.is_mine === true;
    const senderFlag = flagFor(g.origin_country);
    const receiverFlag = flagFor(g.destination_country);

    if (!isDelivered) {
      // In transit
      const etaMs = new Date(g.estimated_delivery_at).getTime();
      const daysLeft = Math.max(0, Math.ceil((etaMs - Date.now()) / 86400000));
      const daysLabel = daysLeft > 0
        ? `${daysLeft} day${daysLeft === 1 ? '' : 's'} remaining`
        : 'Arriving soon';

      return `
        <div class="airmail-frame">
          <div class="letter-inner gift-inner">
            <div class="gift-status-header">
              <div class="gift-status-icon">📦</div>
              <div class="gift-status-text">
                <div class="gift-status-title">A package is on its way</div>
                <div class="gift-status-sub">
                  ${isMine
                    ? `To ${receiverFlag} ${esc(g.destination_country)}`
                    : `From ${senderFlag} ${esc(g.origin_country)}`}
                </div>
              </div>
            </div>
            <div class="gift-in-transit-meta">
              <div><strong>AWB</strong> ${esc(g.awb_number)}</div>
              <div><strong>ETA</strong> ${daysLabel}</div>
            </div>
            <div class="gift-meta-actions">
              <a class="gift-track-btn" href="letters-gift-awb.html?id=${esc(g.id)}">Track AWB →</a>
            </div>
            <div class="letter-meta">
              <span>Shipped ${timeAgo(g.shipped_at)}</span>
              <span class="position">Letter ${currentIndex + 1} of ${stackedLetters.length}</span>
            </div>
          </div>
        </div>
      `;
    }

    // Delivered
    if (isMine) {
      // Sender perspective
      const giftVisual = g.gift_image_url
        ? `<img src="${esc(g.gift_image_url)}" alt="">`
        : (g.gift_emoji || '🎁');
      return `
        <div class="airmail-frame">
          <div class="letter-inner gift-inner">
            <div class="gift-status-header delivered">
              <div class="gift-status-icon">✅</div>
              <div class="gift-status-text">
                <div class="gift-status-title">Your gift was delivered</div>
                <div class="gift-status-sub">To ${receiverFlag} ${esc(g.destination_country)}</div>
              </div>
            </div>
            <div class="gift-delivered-thumb">
              <div class="gift-thumb-img">${giftVisual}</div>
              <div class="gift-thumb-info">
                <div class="gift-thumb-name">${esc(g.gift_name || 'A gift')}</div>
                <div class="gift-thumb-meta">Delivered ${timeAgo(g.delivered_at)}</div>
              </div>
            </div>
            <div class="gift-meta-actions">
              <a class="gift-track-btn" href="letters-gift-awb.html?id=${esc(g.id)}">View AWB →</a>
            </div>
            <div class="letter-meta">
              <span>Shipped ${timeAgo(g.shipped_at)}</span>
              <span class="position">Letter ${currentIndex + 1} of ${stackedLetters.length}</span>
            </div>
          </div>
        </div>
      `;
    }

    // Receiver perspective — full reveal
    const giftVisual = g.gift_image_url
      ? `<img src="${esc(g.gift_image_url)}" alt="">`
      : (g.gift_emoji || '🎁');

    const messageHtml = g.message
      ? `<div class="gift-message-inline">${esc(g.message)}</div>`
      : '';
    const vendorHtml = g.vendor_name
      ? `<div class="gift-vendor-inline">Sponsored by ${esc(g.vendor_name)}</div>`
      : '';

    return `
      <div class="airmail-frame">
        <div class="letter-inner gift-inner">
          <div class="gift-status-header delivered">
            <div class="gift-status-icon">🎁</div>
            <div class="gift-status-text">
              <div class="gift-status-title">You have received a gift!</div>
              <div class="gift-status-sub">From ${senderFlag} ${esc(g.origin_country)}</div>
            </div>
          </div>
          <div class="gift-reveal">
            <div class="gift-reveal-img">${giftVisual}</div>
            <div class="gift-reveal-info">
              <div class="gift-reveal-name">${esc(g.gift_name || 'A gift')}</div>
              ${g.gift_category ? `<div class="gift-reveal-cat">${esc(g.gift_category)}</div>` : ''}
            </div>
          </div>
          ${messageHtml}
          ${vendorHtml}
          <div class="gift-meta-actions">
            <a class="gift-track-btn" href="letters-gift-awb.html?id=${esc(g.id)}">View AWB →</a>
          </div>
          <div class="letter-meta">
            <span>Delivered ${timeAgo(g.delivered_at)}</span>
            <span class="position">Letter ${currentIndex + 1} of ${stackedLetters.length}</span>
          </div>
        </div>
      </div>
    `;
  }

  /* ---------- Gift CTA row below compose ---------- */
  function renderGiftRow() {
    const row = document.getElementById('gift-cta-row');
    if (!row) return;

    const e = giftEligibility;
    if (!e) { row.innerHTML = ''; return; }

    // Threshold not met — hide entirely
    if ((e.sent_by_me || 0) < 3 || (e.sent_by_them || 0) < 3) {
      row.innerHTML = '';
      return;
    }

    if (e.can_send) {
      row.innerHTML = `
        <button class="gift-cta-btn" id="gift-cta-trigger" type="button">
          📦 Send a gift →
        </button>
      `;
      document.getElementById('gift-cta-trigger')?.addEventListener('click', openGiftGallery);
    } else {
      let label = '📦 Gift unavailable';
      if (e.reason_if_not && /recently/i.test(e.reason_if_not) && e.next_available_at) {
        const days = Math.max(1, Math.ceil((new Date(e.next_available_at) - Date.now()) / 86400000));
        label = `📦 Next gift in ${days} day${days === 1 ? '' : 's'}`;
      } else if (e.reason_if_not && /weekly/i.test(e.reason_if_not)) {
        label = '📦 Weekly gift limit reached';
      } else if (e.reason_if_not) {
        label = `📦 ${e.reason_if_not}`;
      }
      row.innerHTML = `
        <button class="gift-cta-btn" type="button" disabled>${esc(label)}</button>
      `;
    }
  }

  /* ---------- Gift gallery modal ---------- */
  async function openGiftGallery() {
    const modal = document.getElementById('gift-gallery-modal');
    const grid = document.getElementById('gift-grid');
    grid.innerHTML = '<div class="gift-grid-loading">Loading gifts…</div>';
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');

    if (!giftCatalog) {
      const { data, error } = await sb.rpc('get_gift_catalog');
      if (error) {
        grid.innerHTML = `<div class="gift-grid-loading" style="color:#991b1b;">Could not load gifts: ${esc(error.message)}</div>`;
        return;
      }
      giftCatalog = data || [];
    }

    if (giftCatalog.length === 0) {
      grid.innerHTML = `<div class="gift-grid-loading">No gifts are available right now.</div>`;
      return;
    }

    grid.innerHTML = giftCatalog.map(g => `
      <button type="button" class="gift-grid-option" data-gift-id="${g.id}">
        <div class="gift-grid-emoji">${esc(g.emoji)}</div>
        <div class="gift-grid-name">${esc(g.name)}</div>
        <div class="gift-grid-vendor">${esc(g.vendor_name)}</div>
      </button>
    `).join('');

    grid.querySelectorAll('.gift-grid-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.giftId);
        const gift = giftCatalog.find(g => Number(g.id) === id);
        if (gift) selectGiftForMessage(gift);
      });
    });
  }
  function closeGiftGallery() {
    const modal = document.getElementById('gift-gallery-modal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
  }

  /* ---------- Gift message modal ---------- */
  function selectGiftForMessage(gift) {
    selectedGift = gift;
    closeGiftGallery();
    openGiftMessage(gift);
  }

  function openGiftMessage(gift) {
    const modal = document.getElementById('gift-message-modal');
    const preview = document.getElementById('gift-preview');
    const ta = document.getElementById('gift-message-text');
    const count = document.getElementById('gift-message-count');
    const status = document.getElementById('gift-send-status');
    const send = document.getElementById('gift-message-send');

    const senderCountry = myCountry || currentConv.other_party_country || '??';
    const receiverCountry = currentConv.other_party_country || '??';

    preview.innerHTML = `
      <div class="gift-preview-box">
        <div class="gift-preview-emoji">${esc(gift.emoji)}</div>
        <div class="gift-preview-info">
          <div class="gift-preview-name">${esc(gift.name)}</div>
          <div class="gift-preview-vendor">Sponsored by ${esc(gift.vendor_name)}</div>
        </div>
      </div>
      <div class="gift-preview-route">
        <span>${flagFor(senderCountry)} You</span>
        <span class="arrow">→</span>
        <span>${flagFor(receiverCountry)} Them</span>
      </div>
    `;

    ta.value = '';
    count.textContent = '0';
    status.className = 'modal-status';
    status.textContent = '';
    send.disabled = false;
    send.textContent = 'Send gift →';

    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    setTimeout(() => ta.focus(), 100);
  }
  function closeGiftMessage() {
    const modal = document.getElementById('gift-message-modal');
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    selectedGift = null;
  }

  async function submitGift() {
    if (!selectedGift || !currentConv) return;
    if (sendingGift) return;
    sendingGift = true;

    const ta = document.getElementById('gift-message-text');
    const status = document.getElementById('gift-send-status');
    const send = document.getElementById('gift-message-send');
    const message = ta.value.trim();

    send.disabled = true;
    send.textContent = 'Sending…';
    status.className = 'modal-status';

    try {
      const { data, error } = await sb.rpc('send_gift', {
        p_conversation_id: currentConv.id,
        p_gift_catalog_id: Number(selectedGift.id),
        p_message: message || null
      });
      if (error) throw error;

      status.className = 'modal-status show ok';
      status.textContent = 'Gift booked. Tracking number issued.';
      toast('Gift sent. AWB issued.', 'ok');

      setTimeout(async () => {
        closeGiftMessage();
        await loadThread(currentConv.id);
        toast('The package is on its way.', 'ok');
      }, 900);

    } catch (err) {
      console.error('[gift] send failed:', err);
      status.className = 'modal-status show err';
      status.textContent = err.message || 'Could not send gift.';
      send.disabled = false;
      send.textContent = 'Send gift →';
    } finally {
      sendingGift = false;
    }
  }

  /* ---------- Gift modal wiring ---------- */
  document.getElementById('gift-gallery-cancel').addEventListener('click', closeGiftGallery);
  document.getElementById('gift-gallery-modal').addEventListener('click', (e) => {
    if (e.target.id === 'gift-gallery-modal') closeGiftGallery();
  });

  document.getElementById('gift-message-back').addEventListener('click', () => {
    // Back returns to gallery
    const prev = selectedGift;
    closeGiftMessage();
    if (prev) openGiftGallery();
  });
  document.getElementById('gift-message-send').addEventListener('click', submitGift);

  const giftMessageTa = document.getElementById('gift-message-text');
  giftMessageTa.addEventListener('input', () => {
    document.getElementById('gift-message-count').textContent = String(giftMessageTa.value.length);
  });

  // Escape closes whichever modal is open
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('gift-gallery-modal').classList.contains('open')) closeGiftGallery();
    if (document.getElementById('gift-message-modal').classList.contains('open')) closeGiftMessage();
  });

  /* ---------- Nav ---------- */
  function renderNav() {
    const nav = document.getElementById('letter-nav');
    if (!nav) return;
    const total = stackedLetters.length;
    const atOldest = currentIndex === 0;
    const atNewest = currentIndex === total - 1;
    let dotsHtml = '';
    if (total <= 15 && total > 1) {
      dotsHtml = '<div class="nav-dots">';
      for (let i = 0; i < total; i++) {
        dotsHtml += `<button class="nav-dot${i === currentIndex ? ' active' : ''}" data-nav-index="${i}" type="button" aria-label="Go to letter ${i + 1}"></button>`;
      }
      dotsHtml += '</div>';
    }
    nav.innerHTML = `
      <button class="nav-btn" id="nav-older" type="button" ${atOldest ? 'disabled' : ''}>← Older</button>
      <div class="nav-center">
        <span class="nav-counter">Letter ${currentIndex + 1} of ${total}</span>
        ${dotsHtml}
      </div>
      <button class="nav-btn" id="nav-newer" type="button" ${atNewest ? 'disabled' : ''}>Newer →</button>
    `;
    document.getElementById('nav-older')?.addEventListener('click', () => navigateTo(currentIndex - 1));
    document.getElementById('nav-newer')?.addEventListener('click', () => navigateTo(currentIndex + 1));
    nav.querySelectorAll('[data-nav-index]').forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.dataset.navIndex, 10);
        if (!isNaN(idx)) navigateTo(idx);
      });
    });
  }

  function navigateTo(newIndex) {
    if (newIndex < 0 || newIndex >= stackedLetters.length) return;
    if (newIndex === currentIndex) return;
    const card = document.getElementById('letter-card');
    if (!card) { currentIndex = newIndex; return; }
    card.classList.add('switching-out');
    setTimeout(() => {
      currentIndex = newIndex;
      renderCard();
      renderNav();
      card.classList.remove('switching-out');
    }, 250);
  }

  document.addEventListener('keydown', (e) => {
    if (!stackedLetters.length) return;
    if (!currentConv) return;
    if (document.querySelector('.modal.open')) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); navigateTo(currentIndex - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); navigateTo(currentIndex + 1); }
  });

  /* ---------- Penpal banner ---------- */
  function renderPenpalBanner() {
    const s = currentState;
    const count = s.exchange_count;
    const pct = Math.min(100, (count / PERMANENT_THRESHOLD) * 100);
    const done = count >= PERMANENT_THRESHOLD;
    const myRequest = s.i_am_author ? s.penpal_author_requested : s.penpal_replier_requested;
    const theirRequest = s.i_am_author ? s.penpal_replier_requested : s.penpal_author_requested;

    if (s.is_permanent) {
      return `<div class="penpal-banner is-permanent"><div class="text"><strong>⭐ Permanent pen pals.</strong> You'll stay connected even after long silences.</div></div>`;
    }
    if (myRequest && theirRequest && !done) {
      return `<div class="penpal-banner"><div class="text"><strong>Almost there.</strong> ${count} of ${PERMANENT_THRESHOLD} letters exchanged — ${PERMANENT_THRESHOLD - count} more to become permanent pen pals.</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
    }
    if (myRequest && !theirRequest) {
      return `<div class="penpal-banner"><div class="text"><strong>You've asked to be permanent pen pals.</strong> Waiting for them to agree. ${count} of ${PERMANENT_THRESHOLD} letters so far.</div><div class="progress-bar"><div class="progress-fill${done ? ' done' : ''}" style="width:${pct}%"></div></div></div>`;
    }
    if (theirRequest && !myRequest) {
      return `<div class="penpal-banner"><div class="text"><strong>They've asked to be permanent pen pals.</strong> ${count >= PERMANENT_THRESHOLD ? 'If you agree, you become permanent immediately.' : `${count} of ${PERMANENT_THRESHOLD} letters so far.`}</div><button class="btn btn-primary" id="penpal-btn" type="button">Accept</button></div>`;
    }
    if (count < PERMANENT_THRESHOLD) {
      return `<div class="penpal-banner"><div class="text"><strong>${count} of ${PERMANENT_THRESHOLD} letters exchanged.</strong> Exchange ${PERMANENT_THRESHOLD - count} more to unlock permanent pen pals.</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
    }
    return `<div class="penpal-banner"><div class="text"><strong>${PERMANENT_THRESHOLD} letters exchanged!</strong> Ready to become permanent pen pals if you both agree.</div><button class="btn btn-primary" id="penpal-btn" type="button">Ask to be pen pals</button></div>`;
  }

  /* ---------- Composer ---------- */
  function wireComposer() {
    const ta = document.getElementById('compose-input');
    const btn = document.getElementById('send-btn');
    const count = document.getElementById('char-count');
    if (!ta || !btn || !count) return;

    ta.addEventListener('input', () => {
      const len = ta.value.length;
      count.textContent = `${len} / 600`;
      count.classList.toggle('over', len > 600);
      btn.disabled = ta.value.trim().length < 1 || len > 600;
    });

    btn.addEventListener('click', async () => {
      const body = ta.value.trim();
      if (!body) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const { data, error } = await sb.rpc('send_exchange', {
          p_conversation_id: currentConv.id, p_body: body
        });
        if (error) throw error;
        const row = data && data[0];
        if (!row) throw new Error('No response');

        currentExchanges.push({
          id: row.exchange_id, sender_id: session.user.id, is_mine: true,
          body: body, created_at: row.created_at
        });
        stackedLetters.push({
          type: 'letter',
          id: row.exchange_id, body: body, created_at: row.created_at,
          _sort_at: new Date(row.created_at).getTime(),
          is_mine: true, is_seed: false,
          sender_country: myCountry, delivery_mode: 'static'
        });

        currentState.exchange_count = Number(row.exchange_count) || (currentState.exchange_count + 1);
        currentState.is_permanent = row.is_permanent === true;
        currentState.penpal_author_requested = row.penpal_author_requested === true;
        currentState.penpal_replier_requested = row.penpal_replier_requested === true;

        if (currentState.is_permanent && row.is_permanent === true && !currentConv.is_permanent) {
          toast('⭐ You are now permanent pen pals.', 'ok');
        }

        // Refresh eligibility (may unlock gift button)
        try {
          const { data: eligData } = await sb.rpc('get_gift_eligibility', { p_conversation_id: currentConv.id });
          giftEligibility = eligData?.[0] || null;
        } catch (e) {}

        currentIndex = stackedLetters.length - 1;
        await renderThread();
        toast('Letter sent.', 'ok');
      } catch (err) {
        console.error('[conv] send failed:', err);
        toast(err.message || 'Could not send. Please try again.', 'err');
        btn.disabled = false;
        btn.textContent = 'Send →';
      }
    });
  }

  function wirePenpalButton() {
    const btn = document.getElementById('penpal-btn');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Asking…';
      try {
        const { data, error } = await sb.rpc('request_penpal', { p_conversation_id: currentConv.id });
        if (error) throw error;
        const row = data && data[0];
        if (!row) throw new Error('No response');
        currentState.is_permanent = row.is_permanent === true;
        currentState.exchange_count = Number(row.exchange_count) || currentState.exchange_count;
        currentState.penpal_author_requested = row.penpal_author_requested === true;
        currentState.penpal_replier_requested = row.penpal_replier_requested === true;
        if (currentState.is_permanent) toast('⭐ You are now permanent pen pals.', 'ok');
        else toast('Request sent. Waiting for them to agree.', 'ok');
        await renderThread();
      } catch (err) {
        console.error('[conv] request_penpal failed:', err);
        toast(err.message || 'Could not send request.', 'err');
        btn.disabled = false;
        btn.textContent = 'Try again';
      }
    });
  }

  async function boot() {
    const { data: { session: s } } = await sb.auth.getSession();
    session = s;
    if (!session) { renderGate(); return; }
    const params = new URLSearchParams(location.search);
    const convId = params.get('id');
    try {
      if (convId) await loadThread(convId);
      else await loadList();
    } catch (e) {
      console.error('[conv] boot failed:', e);
      root.innerHTML = `<div class="err-card">Something went wrong. Please try again.</div>`;
    }
  }
  boot();
})();
</script>
</body>
</html>
