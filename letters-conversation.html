<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correspondence — The Letter Globe</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff5a36;
    --accent-dark: #e84625;
    --bg: #141920;
    --paper: #fbf6e8;
    --paper-2: #fff5f0;
    --ink: #2b2536;
    --muted: #9a8f7c;
    --airmail-red: #d33a3a;
    --airmail-blue: #26478f;
    --border: rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: "Courier Prime", monospace;
    background: radial-gradient(circle at 50% 10%, #55606d 0%, #2a323c 55%, #141920 100%);
    background-attachment: fixed;
    color: #fff;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .top-bar {
    position: sticky; top: 0;
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
    background: rgba(20,25,32,.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .brand { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 900; letter-spacing: -.5px; }
  .brand span { color: var(--accent); }
  .top-back { color: #fff; opacity: .7; font-size: 13px; padding: 8px 12px; transition: .15s ease; }
  .top-back:hover { opacity: 1; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 22px 130px; }

  .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,.55); font-size: 14px; }
  .loading .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .gate { text-align: center; padding: 60px 20px; max-width: 480px; margin: 0 auto; }
  .gate .emoji { font-size: 52px; margin-bottom: 14px; line-height: 1; }
  .gate h1 { font-family: "Caveat", cursive; font-size: 34px; margin: 0 0 10px; font-weight: 600; }
  .gate p { font-size: 14px; color: rgba(255,255,255,.65); line-height: 1.7; margin: 0 0 22px; }
  .gate .btn {
    display: inline-block; padding: 12px 22px; border-radius: 50px;
    font-size: 13px; font-weight: 800; transition: .2s ease;
  }
  .gate .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  .gate .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .gate .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); }
  .gate .btn-ghost:hover { background: rgba(255,255,255,.1); }

  /* ---------- Page header ---------- */
  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-family: "Caveat", cursive; font-size: 38px; margin: 0 0 4px; font-weight: 600; }
  .page-head p { font-size: 13px; color: rgba(255,255,255,.55); margin: 0; line-height: 1.6; }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center; padding: 60px 20px;
    background: rgba(255,255,255,.03);
    border: 1px dashed rgba(255,255,255,.15);
    border-radius: 16px;
  }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; line-height: 1; }
  .empty h2 { font-family: "Caveat", cursive; font-size: 28px; margin: 0 0 8px; font-weight: 600; }
  .empty p { font-size: 13px; color: rgba(255,255,255,.6); line-height: 1.6; margin: 0 0 20px; }
  .empty .btn {
    display: inline-block; padding: 12px 22px; border-radius: 50px;
    font-size: 13px; font-weight: 800;
    background: var(--accent); color: #fff; border: 1px solid var(--accent);
    transition: .2s ease;
  }
  .empty .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  /* ---------- Back link ---------- */
  .back-to-list {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: rgba(255,255,255,.65);
    margin-bottom: 16px; transition: .15s ease;
  }
  .back-to-list:hover { color: #fff; }

  /* ---------- Thread header (only used in thread view) ---------- */
  .thread-header {
    background: var(--paper); color: var(--ink);
    border-radius: 16px; padding: 18px 22px; margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .thread-header .big-flag { font-size: 40px; line-height: 1; flex-shrink: 0; }
  .thread-header .info { flex: 1; min-width: 200px; }
  .thread-header .info h1 {
    font-family: "Caveat", cursive; font-size: 26px;
    margin: 0 0 4px; font-weight: 600; color: var(--ink);
  }
  .thread-header .info .meta { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .thread-header .info .meta .permanent-badge {
    display: inline-block; margin-left: 6px;
  }

  /* ---------- Penpal banner ---------- */
  .penpal-banner {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .penpal-banner.is-permanent {
    background: #fef9e0; border-color: #fde68a; color: var(--ink);
  }
  .penpal-banner .text {
    flex: 1; min-width: 200px;
    font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.75);
  }
  .penpal-banner.is-permanent .text { color: var(--ink); }
  .penpal-banner .text strong { color: #fff; }
  .penpal-banner.is-permanent .text strong { color: #92400e; }
  .penpal-banner .btn {
    padding: 9px 18px; border-radius: 50px;
    font-size: 12px; font-weight: 800; cursor: pointer;
    border: 1px solid transparent; transition: .2s ease; white-space: nowrap;
  }
  .penpal-banner .btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .penpal-banner .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .penpal-banner .progress-bar {
    flex: 1; height: 5px; background: rgba(0,0,0,.2);
    border-radius: 3px; overflow: hidden; max-width: 140px; min-width: 80px;
  }
  .penpal-banner .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 3px; transition: width .3s;
  }
  .penpal-banner .progress-fill.done { background: #16a34a; }

  /* ---------- Shared letter stage (stack + shadows) ---------- */
  .letter-stage {
    position: relative;
    padding-bottom: 42px;
    margin-bottom: 8px;
  }

  .stack-shadow {
    position: absolute;
    left: 0; right: 0; top: 0; bottom: 42px;
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    pointer-events: none;
  }
  .stack-shadow.s1 { transform: translate(6px, 12px) rotate(0.6deg); opacity: 0.65; z-index: 1; }
  .stack-shadow.s2 { transform: translate(-5px, 24px) rotate(-0.4deg); opacity: 0.45; z-index: 0; }
  .stack-shadow.s3 { transform: translate(3px, 34px) rotate(0.3deg); opacity: 0.3; z-index: -1; }

  .letter-card {
    position: relative;
    z-index: 10;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .letter-card.switching-out {
    opacity: 0;
    transform: translateY(-12px) scale(0.98);
  }

  .airmail-frame {
    padding: 10px;
    border-radius: 8px;
    background: repeating-linear-gradient(45deg,
      var(--airmail-red) 0 12px, #fff 12px 24px,
      var(--airmail-blue) 24px 36px, #fff 36px 48px);
    box-shadow: 0 25px 50px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.3);
  }
  .letter-inner {
    background: var(--paper);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0 1px, transparent 1px 24px);
    border-radius: 4px;
    padding: 26px 28px 22px;
    min-height: 260px;
    position: relative;
  }

  /* ---------- List card (conversation summary) ---------- */
  #conv-card .airmail-frame {
    cursor: pointer;
    transition: transform .2s ease;
  }
  #conv-card .airmail-frame:hover {
    transform: translateY(-2px);
  }

  .list-card-inner {
    padding: 24px 26px 22px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
  }

  .conv-card-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
  }
  .conv-card-flag {
    font-size: 36px;
    line-height: 1;
    flex-shrink: 0;
  }
  .conv-card-title-block {
    flex: 1;
    min-width: 0;
  }
  .conv-card-title {
    font-family: "Caveat", cursive;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.25;
  }
  .conv-card-subtitle {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  .conv-card-preview {
    font-family: "Caveat", cursive;
    font-size: 18px;
    line-height: 1.55;
    color: #4a4458;
    margin: 0 0 14px;
    padding: 12px 14px;
    background: rgba(255,255,255,.55);
    border-radius: 8px;
    border-left: 3px solid rgba(255, 90, 54, 0.35);
    word-wrap: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
  }

  .conv-card-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .conv-card-progress .progress-bar {
    flex: 1;
    height: 5px;
    background: rgba(0,0,0,.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .conv-card-progress .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width .3s;
  }
  .conv-card-progress .progress-fill.done {
    background: #16a34a;
  }
  .conv-card-progress .progress-text {
    font-family: "Courier Prime", monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    min-width: 36px;
    text-align: right;
  }

  .conv-card-hint {
    margin-top: auto;
    text-align: center;
    font-family: "Caveat", cursive;
    font-size: 17px;
    color: var(--accent-dark);
    padding-top: 12px;
    border-top: 1px dashed rgba(0,0,0,.14);
    transition: letter-spacing .2s ease;
  }
  #conv-card .airmail-frame:hover .conv-card-hint {
    letter-spacing: 1px;
  }

  /* ---------- Thread card sender label ---------- */
  .letter-top {
    display: flex; align-items: flex-start; gap: 14px;
    margin-bottom: 16px;
  }
  .sender-label {
    flex: 1; min-width: 0;
    font-family: "Courier Prime", monospace;
    font-size: 12px;
    color: #666;
    line-height: 1.5;
    padding-top: 6px;
  }
  .sender-label .you { color: var(--accent-dark); font-weight: 800; }
  .sender-label .from { font-weight: 700; }
  .card-badge {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 50px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .mini-stamp {
    width: 64px; height: 76px;
    padding: 4px;
    background: #fff;
    transform: rotate(3deg);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.2));
    flex-shrink: 0;
    --r: 4px;
    -webkit-mask:
      radial-gradient(circle var(--r) at 50% 0,    #0000 97%, #000) top    / calc(2*var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 50% 100%, #0000 97%, #000) bottom / calc(2*var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 0 50%,    #0000 97%, #000) left   / var(--r) calc(2*var(--r)) repeat-y,
      radial-gradient(circle var(--r) at 100% 50%, #0000 97%, #000) right  / var(--r) calc(2*var(--r)) repeat-y,
      linear-gradient(#000,#000) center / calc(100% - 2*var(--r)) calc(100% - 2*var(--r)) no-repeat;
    mask:
      radial-gradient(circle var(--r) at 50% 0,    #0000 97%, #000) top    / calc(2*var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 50% 100%, #0000 97%, #000) bottom / calc(2*var(--r)) var(--r) repeat-x,
      radial-gradient(circle var(--r) at 0 50%,    #0000 97%, #000) left   / var(--r) calc(2*var(--r)) repeat-y,
      radial-gradient(circle at 100% 50%, #0000 97%, #000) right  / var(--r) calc(2*var(--r)) repeat-y,
      linear-gradient(#000,#000) center / calc(100% - 2*var(--r)) calc(100% - 2*var(--r)) no-repeat;
  }
  .mini-stamp-inner {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid rgba(38,71,143,.3);
    background: linear-gradient(160deg, #f7f3e8, #e6ddc7);
    gap: 2px;
    color: var(--airmail-blue);
  }
  .mini-stamp-inner .flag { font-size: 26px; line-height: 1; }
  .mini-stamp-inner .cc { font-size: 9px; font-weight: 700; letter-spacing: .12em; }

  .letter-body {
    font-family: "Caveat", cursive;
    font-size: 21px;
    line-height: 1.6;
    color: #3a3448;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin: 0 0 14px;
  }

  .letter-meta {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed rgba(0,0,0,.14);
    font-family: "Courier Prime", monospace;
    font-size: 11px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .letter-meta .position {
    background: rgba(0,0,0,.05);
    padding: 3px 9px;
    border-radius: 50px;
    font-weight: 800;
    letter-spacing: .03em;
  }

  /* ---------- Translate pill ---------- */
  .translate-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    border-radius: 50px;
    background: rgba(0,0,0,.04);
    border: 1px solid rgba(0,0,0,.1);
    color: #666;
    font-family: "Courier Prime", monospace;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: .15s ease;
    margin: 2px 0 4px;
  }
  .translate-pill:hover:not(:disabled) {
    background: #fff; border-color: rgba(0,0,0,.22); color: #333;
  }
  .translate-pill:disabled,
  .translate-pill.loading { opacity: .55; cursor: wait; }
  .translate-pill.translated {
    background: rgba(255, 90, 54, .12);
    border-color: rgba(255, 90, 54, .35);
    color: var(--accent-dark);
  }

  /* ---------- Navigation (shared) ---------- */
  .letter-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin: 20px 0 14px;
    padding: 4px 0;
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    border-radius: 50px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: .15s ease;
    white-space: nowrap;
  }
  .nav-btn:hover:not(:disabled) {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.4);
  }
  .nav-btn:disabled {
    opacity: .3;
    cursor: not-allowed;
  }
  .nav-center {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .nav-counter {
    font-family: "Caveat", cursive;
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,.85);
    letter-spacing: -.2px;
  }
  .nav-dots {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;
    max-width: 100%;
  }
  .nav-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,.2);
    cursor: pointer;
    transition: .15s ease;
    border: 0;
    padding: 0;
  }
  .nav-dot:hover { background: rgba(255,255,255,.45); }
  .nav-dot.active { background: var(--accent); width: 20px; border-radius: 4px; }

  /* ---------- List hint ---------- */
  .list-hint {
    text-align: center;
    margin-top: 4px;
    font-size: 12px;
    color: rgba(255,255,255,.4);
    font-style: italic;
  }

  /* ---------- Composer ---------- */
  .composer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(20,25,32,.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 12px 22px 18px;
    border-top: 1px solid rgba(255,255,255,.08);
    z-index: 50;
  }
  .composer-inner {
    max-width: 720px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    min-height: 56px;
    max-height: 140px;
    padding: 12px 14px;
    font-family: "Caveat", cursive;
    font-size: 19px;
    line-height: 1.5;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    resize: vertical;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer .send-btn {
    padding: 14px 22px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 800;
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    cursor: pointer;
    transition: .2s ease;
    white-space: nowrap;
  }
  .composer .send-btn:hover:not(:disabled) {
    background: var(--accent-dark); border-color: var(--accent-dark);
  }
  .composer .send-btn:disabled { opacity: .5; cursor: not-allowed; }
  .composer .char-count {
    position: absolute;
    right: 22px;
    bottom: 2px;
    font-size: 10px;
    color: rgba(255,255,255,.4);
  }
  .composer .char-count.over { color: var(--accent); }

  .err-card {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    padding: 18px 22px; border-radius: 14px; font-size: 14px; line-height: 1.6;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 700px) {
    .wrap { padding: 18px 15px 140px; }
    .top-bar { padding: 12px 15px; }
    .brand { font-size: 16px; }
    .top-back { font-size: 12px; }
    .thread-header { padding: 16px 18px; border-radius: 14px; }
    .thread-header .big-flag { font-size: 32px; }
    .thread-header .info h1 { font-size: 22px; }
    .letter-inner { padding: 20px 18px 18px; }
    .letter-body { font-size: 18px; }
    .mini-stamp { width: 52px; height: 62px; }
    .mini-stamp-inner .flag { font-size: 22px; }
    .mini-stamp-inner .cc { font-size: 8px; }
    .letter-nav { flex-wrap: wrap; }
    .nav-btn { padding: 9px 14px; font-size: 11px; }
    .nav-center { order: -1; width: 100%; }
    .list-card-inner { padding: 18px 18px 16px; min-height: 200px; }
    .conv-card-flag { font-size: 28px; }
    .conv-card-title { font-size: 19px; }
    .conv-card-preview { font-size: 16px; padding: 10px 12px; }
    .conv-card-hint { font-size: 15px; }
    .composer { padding: 10px 15px 14px; }
    .composer-inner { flex-direction: column; align-items: stretch; gap: 8px; }
    .composer textarea { font-size: 18px; min-height: 50px; }
    .composer .send-btn { padding: 11px 18px; }
    .composer .char-count { position: static; text-align: right; margin-top: 2px; }
  }

  .toast-container {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    padding: 12px 20px; border-radius: 50px;
    background: #16a34a; color: #fff; font-size: 13px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    animation: toastIn .2s ease-out;
  }
  .toast.err { background: #dc2626; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="brand">The <span>Whacky</span> Rack</a>
  <div class="top-actions">
    <a href="letters-globe.html" class="top-back" id="top-back">← The Globe</a>
  </div>
</div>

<main id="root" class="wrap">
  <div class="loading">
    <div class="spinner"></div>
    <div>Opening the correspondence…</div>
  </div>
</main>

<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  console.log('[conv] boot');
  const sb = window.wr ? window.wr.sb : null;
  if (!sb) {
    document.getElementById('root').innerHTML = '<div class="err-card">Auth library failed to load.</div>';
    return;
  }

  const root        = document.getElementById('root');
  const toastBox    = document.getElementById('toast-container');
  const topBack     = document.getElementById('top-back');

  const PERMANENT_THRESHOLD = 10;

  let session = null;

  // LIST VIEW state
  let convStack = [];      // sorted newest-first by last_exchange_at
  let listIndex = 0;

  // THREAD VIEW state
  let currentConv = null;
  let currentLetter = null;
  let currentExchanges = [];
  let currentState = null;
  let stackedLetters = [];  // oldest-first (seed first, then exchanges)
  let currentIndex = 0;     // index in stackedLetters

  let myCountry = null;
  let otherPartyCountryName = '';

  // Translation cache (shared for thread view only)
  let translateCache = {};

  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function flagFor(cc) {
    if (!cc || cc.length !== 2) return '🌍';
    const A = 0x1F1E6;
    return String.fromCodePoint(
      A + cc.toUpperCase().charCodeAt(0) - 65,
      A + cc.toUpperCase().charCodeAt(1) - 65
    );
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return d.toLocaleDateString();
  }

  function toast(msg, kind = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'err' ? ' err' : '');
    el.textContent = msg;
    toastBox.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  function getTargetLangCode() {
    return ((navigator.language || 'en').split('-')[0] || 'en').toLowerCase();
  }

  /* ---------- Translation ---------- */
  async function fetchWithTimeout(url, ms) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), ms);
    try {
      return await fetch(url, { signal: controller.signal });
    } finally {
      clearTimeout(t);
    }
  }

  async function translateText(text) {
    const target = getTargetLangCode();
    try {
      const url = 'https://lingva.ml/api/v1/auto/' + target + '/' + encodeURIComponent(text);
      const res = await fetchWithTimeout(url, 6000);
      if (res.ok) {
        const data = await res.json();
        if (data && data.translation) return data.translation;
      }
    } catch (e) {
      console.warn('[translate] Lingva failed:', e);
    }
    try {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
                  target + '&dt=t&q=' + encodeURIComponent(text);
      const res = await fetchWithTimeout(url, 6000);
      if (res.ok) {
        const data = await res.json();
        if (data && Array.isArray(data[0])) {
          const t = data[0].map(row => row && row[0] ? row[0] : '').join('');
          if (t) return t;
        }
      }
    } catch (e) {
      console.warn('[translate] Google fallback failed:', e);
    }
    throw new Error('Translation service unavailable');
  }

  async function handleTranslateClick(pill) {
    const key = pill.dataset.translateKey;
    if (!key) return;
    const bodyEl = document.getElementById('letter-body');
    if (!bodyEl) return;

    const entry = stackedLetters.find(x => String(x.id) === String(key));
    if (!entry) return;

    if (!translateCache[key]) {
      translateCache[key] = {
        originalHtml: esc(entry.body),
        translatedHtml: null,
        showing: 'original',
        fetching: false
      };
    }
    const cache = translateCache[key];
    if (cache.fetching) return;

    if (cache.translatedHtml) {
      if (cache.showing === 'original') {
        bodyEl.innerHTML = cache.translatedHtml;
        cache.showing = 'translated';
        pill.className = 'translate-pill translated';
        pill.innerHTML = '🌐 Show original';
      } else {
        bodyEl.innerHTML = cache.originalHtml;
        cache.showing = 'original';
        pill.className = 'translate-pill';
        pill.innerHTML = '🌐 Translate';
      }
      return;
    }

    cache.fetching = true;
    pill.classList.add('loading');
    pill.disabled = true;
    const originalLabel = pill.innerHTML;
    pill.textContent = 'Translating…';

    try {
      const translated = await translateText(entry.body);
      cache.translatedHtml = esc(translated);
      cache.showing = 'translated';
      bodyEl.innerHTML = cache.translatedHtml;
      pill.className = 'translate-pill translated';
      pill.innerHTML = '🌐 Show original';
    } catch (err) {
      console.error('[translate] failed:', err);
      pill.innerHTML = originalLabel;
      toast('Translation unavailable right now. Try again in a moment.', 'err');
    } finally {
      cache.fetching = false;
      pill.classList.remove('loading');
      pill.disabled = false;
    }
  }

  document.addEventListener('click', (e) => {
    const pill = e.target.closest('.translate-pill[data-translate-key]');
    if (!pill) return;
    e.preventDefault();
    handleTranslateClick(pill);
  });

  /* ---------- Country name ---------- */
  async function getCountryName(code) {
    if (!code) return '';
    try {
      const { data } = await sb.from('countries').select('name').eq('code', code).maybeSingle();
      return data ? data.name : code;
    } catch { return code; }
  }

  /* ---------- Gate ---------- */
  function renderGate() {
    root.innerHTML = `
      <div class="gate">
        <div class="emoji">✉</div>
        <h1>Sign in to see your letters</h1>
        <p>Correspondence is private. Sign in to read your ongoing conversations with the world.</p>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          <a class="btn btn-primary" href="login.html">Sign in</a>
          <a class="btn btn-ghost" href="signup.html">Join</a>
        </div>
      </div>
    `;
  }

  /* ============================================================
     LIST VIEW — Stack of conversations
     ============================================================ */
  async function loadList() {
    topBack.textContent = '← The Globe';
    topBack.href = 'letters-globe.html';

    const { data, error } = await sb.rpc('get_my_conversations');
    if (error) {
      root.innerHTML = `<div class="err-card">Could not load conversations: ${esc(error.message)}</div>`;
      return;
    }

    const convs = data || [];

    if (convs.length === 0) {
      root.innerHTML = `
        <div class="page-head">
          <h1>Your correspondence</h1>
          <p>Every letter you've replied to, every pen pal you've made.</p>
        </div>
        <div class="empty">
          <div class="emoji">📭</div>
          <h2>No letters yet</h2>
          <p>Reply to a letter on the globe to start a correspondence.</p>
          <a class="btn" href="letters-globe.html">Visit the globe</a>
        </div>
      `;
      return;
    }

    // Resolve country names for all conversations
    const countryNames = {};
    const codes = new Set();
    convs.forEach(c => { if (c.other_party_country) codes.add(c.other_party_country); });
    await Promise.all([...codes].map(async cc => { countryNames[cc] = await getCountryName(cc); }));

    // Sort newest-first
    convStack = [...convs].sort((a, b) => {
      const aT = new Date(a.last_exchange_at || a.created_at).getTime();
      const bT = new Date(b.last_exchange_at || b.created_at).getTime();
      return bT - aT;
    });
    listIndex = 0;

    convStack.forEach(c => {
      c.__countryName = countryNames[c.other_party_country] || c.other_party_country || 'a distant country';
    });

    renderListStack();
  }

  function renderListStack() {
    const total = convStack.length;

    root.innerHTML = `
      <div class="page-head">
        <h1>Your correspondence</h1>
        <p>${total} active conversation${total === 1 ? '' : 's'}.</p>
      </div>

      <div class="letter-stage" id="letter-stage">
        <div class="letter-card" id="conv-card"></div>
      </div>

      <div class="letter-nav" id="conv-nav"></div>

      <p class="list-hint">Click any letter to open the conversation</p>
    `;

    renderConvShadows();
    renderConvCard();
    renderConvNav();
  }

  function renderConvShadows() {
    const stage = document.getElementById('letter-stage');
    const card = document.getElementById('conv-card');
    if (!stage || !card) return;
    stage.querySelectorAll('.stack-shadow').forEach(el => el.remove());

    const total = convStack.length;
    // Latest (index 0) has the deepest pile behind it; oldest has nothing behind
    const shadowCount = Math.min(3, total - 1 - listIndex);
    const classes = ['s1', 's2', 's3'];
    for (let i = 0; i < shadowCount; i++) {
      const sh = document.createElement('div');
      sh.className = 'stack-shadow ' + classes[i];
      stage.insertBefore(sh, card);
    }
  }

  function renderConvCard() {
    const card = document.getElementById('conv-card');
    if (!card) return;

    const conv = convStack[listIndex];
    if (!conv) { card.innerHTML = ''; return; }

    const flag = flagFor(conv.other_party_country);
    const name = conv.__countryName || 'a distant country';
    const count = Number(conv.exchange_count) || 0;
    const pct = Math.min(100, (count / PERMANENT_THRESHOLD) * 100);
    const done = count >= PERMANENT_THRESHOLD;
    const preview = (conv.letter_preview || '').trim();
    const lastAt = conv.last_exchange_at || conv.created_at;

    card.innerHTML = `
      <div class="airmail-frame" id="conv-card-click">
        <div class="letter-inner list-card-inner">
          <div class="conv-card-top">
            <span class="conv-card-flag">${flag}</span>
            <div class="conv-card-title-block">
              <div class="conv-card-title">A correspondent in ${esc(name)}</div>
              <div class="conv-card-subtitle">
                ${count} letter${count === 1 ? '' : 's'} exchanged
                · last ${timeAgo(lastAt)}
              </div>
            </div>
            ${conv.is_permanent ? '<span class="permanent-badge">⭐ Permanent</span>' : ''}
          </div>

          ${preview ? `<div class="conv-card-preview">“${esc(preview)}…”</div>` : ''}

          <div class="conv-card-progress">
            <div class="progress-bar">
              <div class="progress-fill${done ? ' done' : ''}" style="width:${pct}%"></div>
            </div>
            <span class="progress-text">${count}/${PERMANENT_THRESHOLD}</span>
          </div>

          <div class="conv-card-hint">Open this letter →</div>
        </div>
      </div>
    `;

    const clickTarget = document.getElementById('conv-card-click');
    if (clickTarget) {
      clickTarget.addEventListener('click', () => {
        window.location.href = `letters-conversation.html?id=${encodeURIComponent(conv.id)}`;
      });
    }
  }

  function renderConvNav() {
    const nav = document.getElementById('conv-nav');
    if (!nav) return;

    const total = convStack.length;
    const atNewest = listIndex === 0;
    const atOldest = listIndex === total - 1;

    let dotsHtml = '';
    if (total <= 15 && total > 1) {
      dotsHtml = '<div class="nav-dots">';
      for (let i = 0; i < total; i++) {
        dotsHtml += `<button class="nav-dot${i === listIndex ? ' active' : ''}" data-conv-index="${i}" type="button" aria-label="Conversation ${i + 1}"></button>`;
      }
      dotsHtml += '</div>';
    }

    nav.innerHTML = `
      <button class="nav-btn" id="conv-older" type="button" ${atOldest ? 'disabled' : ''}>← Older</button>
      <div class="nav-center">
        <span class="nav-counter">Letter ${listIndex + 1} of ${total}</span>
        ${dotsHtml}
      </div>
      <button class="nav-btn" id="conv-newer" type="button" ${atNewest ? 'disabled' : ''}>Newer →</button>
    `;

    document.getElementById('conv-older')?.addEventListener('click', () => navigateConv(listIndex + 1));
    document.getElementById('conv-newer')?.addEventListener('click', () => navigateConv(listIndex - 1));

    nav.querySelectorAll('[data-conv-index]').forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.dataset.convIndex, 10);
        if (!isNaN(idx)) navigateConv(idx);
      });
    });
  }

  function navigateConv(newIndex) {
    if (newIndex < 0 || newIndex >= convStack.length) return;
    if (newIndex === listIndex) return;

    const card = document.getElementById('conv-card');
    if (!card) { listIndex = newIndex; return; }

    card.classList.add('switching-out');
    setTimeout(() => {
      listIndex = newIndex;
      renderConvShadows();
      renderConvCard();
      renderConvNav();
      card.classList.remove('switching-out');
    }, 250);
  }

  // Keyboard nav for list
  document.addEventListener('keydown', (e) => {
    // Only in list view
    if (!convStack.length) return;
    // Only when NOT in thread view (currentConv would be null)
    if (currentConv) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      navigateConv(listIndex + 1);  // ← Older
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      navigateConv(listIndex - 1);  // Newer →
    }
  });

  /* ============================================================
     THREAD VIEW — Same as previous (left/right flow + airmail)
     ============================================================ */
  async function loadThread(convId) {
    topBack.textContent = '← All conversations';
    topBack.href = 'letters-conversation.html';

    const { data: convs, error: convsErr } = await sb.rpc('get_my_conversations');
    if (convsErr) {
      root.innerHTML = `<div class="err-card">Could not load conversation: ${esc(convsErr.message)}</div>`;
      return;
    }
    const conv = (convs || []).find(c => c.id === convId);
    if (!conv) {
      root.innerHTML = `
        <div class="err-card">
          This conversation doesn't exist or has ended.
          <a href="letters-conversation.html" style="color:inherit; text-decoration:underline; margin-left:8px;">← Back to all conversations</a>
        </div>
      `;
      return;
    }
    currentConv = conv;

    const { data: exchanges, error: exErr } = await sb.rpc('get_conversation', {
      p_conversation_id: convId, p_limit: 500
    });
    if (exErr) {
      root.innerHTML = `<div class="err-card">Could not load messages: ${esc(exErr.message)}</div>`;
      return;
    }
    currentExchanges = exchanges || [];

    try {
      const { data: letterArr } = await sb.rpc('read_letter', { p_letter_id: conv.letter_id });
      currentLetter = letterArr ? letterArr[0] : null;
    } catch (e) {
      currentLetter = null;
    }

    currentState = {
      is_permanent: conv.is_permanent === true,
      exchange_count: Number(conv.exchange_count) || 0,
      penpal_author_requested: conv.penpal_author_requested === true,
      penpal_replier_requested: conv.penpal_replier_requested === true,
      i_am_author: conv.i_am_author === true
    };

    try {
      const { data: prof } = await sb.from('profiles').select('country').eq('id', session.user.id).maybeSingle();
      const cc = (prof && prof.country || '').toUpperCase();
      myCountry = /^[A-Z]{2}$/.test(cc) ? cc : null;
    } catch (e) { myCountry = null; }

    try {
      otherPartyCountryName = await getCountryName(currentConv.other_party_country);
    } catch (e) { otherPartyCountryName = currentConv.other_party_country || ''; }

    // Build unified stack: seed first (oldest), then exchanges
    stackedLetters = [];
    if (currentLetter) {
      stackedLetters.push({
        id: '__seed__',
        body: currentLetter.body,
        created_at: currentLetter.created_at,
        is_mine: currentLetter.is_mine === true,
        is_seed: true,
        sender_country: currentLetter.origin_country
      });
    }
    currentExchanges.forEach(ex => {
      stackedLetters.push({
        id: ex.id,
        body: ex.body,
        created_at: ex.created_at,
        is_mine: ex.is_mine === true,
        is_seed: false,
        sender_country: ex.is_mine ? myCountry : currentConv.other_party_country
      });
    });

    currentIndex = Math.max(0, stackedLetters.length - 1);

    renderThread();
  }

  async function renderThread() {
    const flag = flagFor(currentConv.other_party_country);
    const count = currentState.exchange_count;

    const headerHtml = `
      <div class="thread-header">
        <div class="big-flag">${flag}</div>
        <div class="info">
          <h1>A correspondent in ${esc(otherPartyCountryName || currentConv.other_party_country || 'a distant country')}</h1>
          <div class="meta">
            ${count} letter${count === 1 ? '' : 's'} exchanged
            ${currentState.is_permanent ? '<span class="permanent-badge">⭐ Permanent pen pals</span>' : ''}
          </div>
        </div>
      </div>
    `;

    const bannerHtml = renderPenpalBanner();

    root.innerHTML = `
      ${headerHtml}
      ${bannerHtml}
      <div class="letter-stage" id="letter-stage">
        <div class="letter-card" id="letter-card"></div>
      </div>
      <div class="letter-nav" id="letter-nav"></div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="compose-input" maxlength="600" placeholder="Write back…"></textarea>
          <button class="send-btn" id="send-btn" type="button" disabled>Send →</button>
        </div>
        <div class="char-count" id="char-count">0 / 600</div>
      </div>
    `;

    renderStackShadows();
    renderCard();
    renderNav();
    wireComposer();
    wirePenpalButton();
  }

  function renderStackShadows() {
    const stage = document.getElementById('letter-stage');
    const card = document.getElementById('letter-card');
    if (!stage || !card) return;
    stage.querySelectorAll('.stack-shadow').forEach(el => el.remove());

    // Thread view: oldest (index 0) = 0 shadows; latest (index last) = 3 shadows
    const shadowCount = Math.min(3, currentIndex);
    const classes = ['s1', 's2', 's3'];
    for (let i = 0; i < shadowCount; i++) {
      const sh = document.createElement('div');
      sh.className = 'stack-shadow ' + classes[i];
      stage.insertBefore(sh, card);
    }
  }

  function renderCard() {
    const card = document.getElementById('letter-card');
    if (!card) return;

    const entry = stackedLetters[currentIndex];
    if (!entry) {
      card.innerHTML = `<div class="airmail-frame"><div class="letter-inner">
        <div class="letter-body">This letter is no longer available.</div>
      </div></div>`;
      return;
    }

    const isMine = entry.is_mine === true;
    const cache = translateCache[String(entry.id)];
    const showingTranslation = cache && cache.showing === 'translated';
    const bodyHtml = showingTranslation ? cache.translatedHtml : esc(entry.body);
    const pillClass = 'translate-pill' + (showingTranslation ? ' translated' : '');
    const pillLabel = showingTranslation ? '🌐 Show original' : '🌐 Translate';

    let senderLabel;
    if (isMine) {
      senderLabel = `<span class="sender-label"><span class="you">✉ You wrote</span>${entry.sender_country ? ' from ' + flagFor(entry.sender_country) + ' ' + esc(entry.sender_country) : ''}</span>`;
    } else {
      const country = entry.sender_country || currentConv.other_party_country;
      const countryName = country === currentConv.other_party_country
        ? (otherPartyCountryName || country)
        : country;
      senderLabel = `<span class="sender-label"><span class="from">${flagFor(country)} A letter from ${esc(countryName || 'somewhere')}</span></span>`;
    }

    const stampCountry = entry.sender_country || (isMine ? myCountry : currentConv.other_party_country) || '';
    const stampHtml = `
      <div class="mini-stamp">
        <div class="mini-stamp-inner">
          <span class="flag">${flagFor(stampCountry)}</span>
          <span class="cc">${esc(stampCountry || '—')}</span>
        </div>
      </div>
    `;

    const isLatest = currentIndex === stackedLetters.length - 1;
    const isSeed = entry.is_seed === true;
    let badge = '';
    if (isLatest && !isSeed) badge = '<span class="card-badge">Latest</span>';
    else if (isSeed) badge = '<span class="card-badge">Original</span>';

    card.innerHTML = `
      <div class="airmail-frame">
        <div class="letter-inner">
          <div class="letter-top">
            ${senderLabel.replace('</span>', badge + '</span>')}
            ${stampHtml}
          </div>
          <div class="letter-body" id="letter-body">${bodyHtml}</div>
          <button class="${pillClass}" data-translate-key="${esc(entry.id)}" type="button">${pillLabel}</button>
          <div class="letter-meta">
            <span>${timeAgo(entry.created_at)}</span>
            <span class="position">Letter ${currentIndex + 1} of ${stackedLetters.length}</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderNav() {
    const nav = document.getElementById('letter-nav');
    if (!nav) return;

    const total = stackedLetters.length;
    const atOldest = currentIndex === 0;
    const atNewest = currentIndex === total - 1;

    let dotsHtml = '';
    if (total <= 15 && total > 1) {
      dotsHtml = '<div class="nav-dots">';
      for (let i = 0; i < total; i++) {
        dotsHtml += `<button class="nav-dot${i === currentIndex ? ' active' : ''}" data-nav-index="${i}" type="button" aria-label="Go to letter ${i + 1}"></button>`;
      }
      dotsHtml += '</div>';
    }

    nav.innerHTML = `
      <button class="nav-btn" id="nav-older" type="button" ${atOldest ? 'disabled' : ''}>← Older</button>
      <div class="nav-center">
        <span class="nav-counter">Letter ${currentIndex + 1} of ${total}</span>
        ${dotsHtml}
      </div>
      <button class="nav-btn" id="nav-newer" type="button" ${atNewest ? 'disabled' : ''}>Newer →</button>
    `;

    document.getElementById('nav-older')?.addEventListener('click', () => navigateTo(currentIndex - 1));
    document.getElementById('nav-newer')?.addEventListener('click', () => navigateTo(currentIndex + 1));

    nav.querySelectorAll('[data-nav-index]').forEach(dot => {
      dot.addEventListener('click', () => {
        const idx = parseInt(dot.dataset.navIndex, 10);
        if (!isNaN(idx)) navigateTo(idx);
      });
    });
  }

  function navigateTo(newIndex) {
    if (newIndex < 0 || newIndex >= stackedLetters.length) return;
    if (newIndex === currentIndex) return;

    const card = document.getElementById('letter-card');
    if (!card) { currentIndex = newIndex; return; }

    card.classList.add('switching-out');
    setTimeout(() => {
      currentIndex = newIndex;
      renderStackShadows();
      renderCard();
      renderNav();
      card.classList.remove('switching-out');
    }, 250);
  }

  // Keyboard nav for thread
  document.addEventListener('keydown', (e) => {
    if (!stackedLetters.length) return;
    if (!currentConv) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      navigateTo(currentIndex - 1);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      navigateTo(currentIndex + 1);
    }
  });

  function renderPenpalBanner() {
    const s = currentState;
    const count = s.exchange_count;
    const pct = Math.min(100, (count / PERMANENT_THRESHOLD) * 100);
    const done = count >= PERMANENT_THRESHOLD;

    const myRequest = s.i_am_author ? s.penpal_author_requested : s.penpal_replier_requested;
    const theirRequest = s.i_am_author ? s.penpal_replier_requested : s.penpal_author_requested;

    if (s.is_permanent) {
      return `
        <div class="penpal-banner is-permanent">
          <div class="text">
            <strong>⭐ Permanent pen pals.</strong>
            You'll stay connected even after long silences.
          </div>
        </div>
      `;
    }
    if (myRequest && theirRequest && !done) {
      return `
        <div class="penpal-banner">
          <div class="text">
            <strong>Almost there.</strong>
            ${count} of ${PERMANENT_THRESHOLD} letters exchanged — ${PERMANENT_THRESHOLD - count} more to become permanent pen pals.
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }
    if (myRequest && !theirRequest) {
      return `
        <div class="penpal-banner">
          <div class="text">
            <strong>You've asked to be permanent pen pals.</strong>
            Waiting for them to agree. ${count} of ${PERMANENT_THRESHOLD} letters so far.
          </div>
          <div class="progress-bar"><div class="progress-fill${done ? ' done' : ''}" style="width:${pct}%"></div></div>
        </div>
      `;
    }
    if (theirRequest && !myRequest) {
      return `
        <div class="penpal-banner">
          <div class="text">
            <strong>They've asked to be permanent pen pals.</strong>
            ${count >= PERMANENT_THRESHOLD
              ? 'If you agree, you become permanent immediately.'
              : `${count} of ${PERMANENT_THRESHOLD} letters so far.`}
          </div>
          <button class="btn btn-primary" id="penpal-btn" type="button">Accept</button>
        </div>
      `;
    }
    if (count < PERMANENT_THRESHOLD) {
      return `
        <div class="penpal-banner">
          <div class="text">
            <strong>${count} of ${PERMANENT_THRESHOLD} letters exchanged.</strong>
            Exchange ${PERMANENT_THRESHOLD - count} more to unlock permanent pen pals.
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    }
    return `
      <div class="penpal-banner">
        <div class="text">
          <strong>${PERMANENT_THRESHOLD} letters exchanged!</strong>
          Ready to become permanent pen pals if you both agree.
        </div>
        <button class="btn btn-primary" id="penpal-btn" type="button">Ask to be pen pals</button>
      </div>
    `;
  }

  function wireComposer() {
    const ta = document.getElementById('compose-input');
    const btn = document.getElementById('send-btn');
    const count = document.getElementById('char-count');
    if (!ta || !btn || !count) return;

    ta.addEventListener('input', () => {
      const len = ta.value.length;
      count.textContent = `${len} / 600`;
      count.classList.toggle('over', len > 600);
      btn.disabled = ta.value.trim().length < 1 || len > 600;
    });

    btn.addEventListener('click', async () => {
      const body = ta.value.trim();
      if (!body) return;
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const { data, error } = await sb.rpc('send_exchange', {
          p_conversation_id: currentConv.id,
          p_body: body
        });
        if (error) throw error;

        const row = data && data[0];
        if (!row) throw new Error('No response');

        const newEx = {
          id: row.exchange_id,
          sender_id: session.user.id,
          is_mine: true,
          body: body,
          created_at: row.created_at
        };
        currentExchanges.push(newEx);

        stackedLetters.push({
          id: newEx.id,
          body: newEx.body,
          created_at: newEx.created_at,
          is_mine: true,
          is_seed: false,
          sender_country: myCountry
        });

        currentState.exchange_count = Number(row.exchange_count) || (currentState.exchange_count + 1);
        currentState.is_permanent = row.is_permanent === true;
        currentState.penpal_author_requested = row.penpal_author_requested === true;
        currentState.penpal_replier_requested = row.penpal_replier_requested === true;

        if (currentState.is_permanent && row.is_permanent === true && !currentConv.is_permanent) {
          toast('⭐ You are now permanent pen pals.', 'ok');
        }

        currentIndex = stackedLetters.length - 1;
        await renderThread();
        toast('Letter sent.', 'ok');
      } catch (err) {
        console.error('[conv] send failed:', err);
        toast(err.message || 'Could not send. Please try again.', 'err');
        btn.disabled = false;
        btn.textContent = 'Send →';
      }
    });
  }

  function wirePenpalButton() {
    const btn = document.getElementById('penpal-btn');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Asking…';
      try {
        const { data, error } = await sb.rpc('request_penpal', {
          p_conversation_id: currentConv.id
        });
        if (error) throw error;
        const row = data && data[0];
        if (!row) throw new Error('No response');

        currentState.is_permanent = row.is_permanent === true;
        currentState.exchange_count = Number(row.exchange_count) || currentState.exchange_count;
        currentState.penpal_author_requested = row.penpal_author_requested === true;
        currentState.penpal_replier_requested = row.penpal_replier_requested === true;

        if (currentState.is_permanent) {
          toast('⭐ You are now permanent pen pals.', 'ok');
        } else {
          toast('Request sent. Waiting for them to agree.', 'ok');
        }
        await renderThread();
      } catch (err) {
        console.error('[conv] request_penpal failed:', err);
        toast(err.message || 'Could not send request.', 'err');
        btn.disabled = false;
        btn.textContent = 'Try again';
      }
    });
  }

  /* ---------- Boot ---------- */
  async function boot() {
    const { data: { session: s } } = await sb.auth.getSession();
    session = s;
    if (!session) {
      renderGate();
      return;
    }

    const params = new URLSearchParams(location.search);
    const convId = params.get('id');

    try {
      if (convId) {
        await loadThread(convId);
      } else {
        await loadList();
      }
    } catch (e) {
      console.error('[conv] boot failed:', e);
      root.innerHTML = `<div class="err-card">Something went wrong. Please try again.</div>`;
    }
  }

  boot();
})();
</script>
</body>
</html>
