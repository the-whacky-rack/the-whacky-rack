<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — The Whacky Rack</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Courier+Prime:wght@400;700&family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f5ef;
            --card: #fff;
            --text: #202020;
            --muted: #777;
            --accent: #ff5a36;
            --accent-dark: #e84625;
            --border: #e8e4dc;
            --pill: #fff0eb;
            --shadow: 0 8px 25px rgba(0, 0, 0, .06);
            --airmail-red: #d33a3a;
            --airmail-blue: #26478f;
            --passport-paper: #fbf6e8;
            --passport-ink: #2b2536;
            --passport-gold: #c9a227;
            --passport-gold-light: #e8c85c;
            --passport-navy: #1a2a4a;
            --passport-navy-deep: #0d1628;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        a { color: inherit; text-decoration: none; }

        /* ---------- Header ---------- */
        header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .header-inner { max-width: 1250px; margin: auto; padding: 16px 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .logo { font-size: 25px; font-weight: 900; letter-spacing: -1px; white-space: nowrap; }
        .logo span { color: var(--accent); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .nav-link { font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 50px; border: 1px solid var(--border); background: #fff; transition: .2s ease; white-space: nowrap; }
        .nav-link:hover { border-color: #bbb; }

        .wrap { max-width: 1100px; margin: auto; padding: 36px 22px 80px; }

        /* ---------- Hero ---------- */
        .hero {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .hero-avatar {
            width: 96px; height: 96px; border-radius: 50%;
            background: var(--pill); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; flex-shrink: 0;
        }
        .hero-info { flex: 1; min-width: 220px; }
        .hero-name {
            margin: 0 0 6px; font-size: 32px; letter-spacing: -1px; font-weight: 950;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .rank-badge {
            font-size: 12px; font-weight: 900; background: #222; color: #fff;
            padding: 4px 12px; border-radius: 50px; letter-spacing: .3px;
        }
        .hero-meta { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.7; }
        .hero-meta strong { color: #444; }

        /* ---------- Grid ---------- */
        .grid { display: grid; grid-template-columns: 1fr 1.7fr; gap: 24px; }
        @media (max-width:900px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .card-title {
            margin: 0 0 14px; font-size: 14px; font-weight: 900;
            text-transform: uppercase; letter-spacing: .5px; color: #555;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .card-title .count { font-size: 12px; font-weight: 700; background: var(--pill); color: var(--accent-dark); padding: 3px 10px; border-radius: 50px; letter-spacing: 0; text-transform: none; }
        .bio-text { font-size: 15px; line-height: 1.7; color: #333; margin: 0; }
        .stat-row { display: flex; gap: 10px; }
        .stat-box { flex: 1; background: #fafafa; border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-box .n { font-size: 20px; font-weight: 900; color: var(--text); }
        .stat-box .l { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); margin-top: 2px; }
        a.stat-box { text-decoration: none; color: inherit; cursor: pointer; transition: .2s ease; }
        a.stat-box:hover { border-color: var(--accent); background: #fff; }
        a.stat-box:hover .n { color: var(--accent-dark); }
        .follows-you-badge { font-size: 10px; font-weight: 800; background: var(--pill); color: var(--accent-dark); padding: 3px 10px; border-radius: 50px; letter-spacing: .3px; align-self: center; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 20px; border-radius: 50px; font-family: inherit; font-weight: 800; font-size: 13px; border: 1px solid transparent; cursor: pointer; transition: .2s ease; text-decoration: none; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
        .btn-ghost { background: #fff; color: var(--text); border-color: var(--border); }
        .btn-ghost:hover { border-color: #bbb; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

        .visitor-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
        .visitor-row:last-child { border-bottom: 0; }
        .visitor-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--pill); color: var(--accent-dark); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; flex-shrink: 0; }
        .visitor-name { font-weight: 700; color: var(--text); }
        .visitor-time { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }
        .empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

        .mini-tape-list { display: flex; flex-direction: column; gap: 12px; }
        .mini-tape { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; transition: transform .15s ease, box-shadow .15s ease; text-decoration: none; color: inherit; }
        .mini-tape:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0, 0, 0, .07); }
        .mini-tape-img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #f1eee8; flex-shrink: 0; }
        .mini-tape-info { flex: 1; min-width: 0; }
        .mini-tape-cat { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: var(--accent-dark); margin-bottom: 3px; }
        .mini-tape-name { font-size: 14px; font-weight: 800; line-height: 1.35; margin: 0 0 4px; color: var(--text); }
        .mini-tape-caption { font-size: 12px; line-height: 1.5; color: #555; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .mini-tape-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
        .mini-tape-meta .pill { background: var(--pill); color: var(--accent-dark); padding: 2px 8px; border-radius: 50px; font-weight: 800; font-size: 10px; }
        .mini-tape-empty { text-align: center; padding: 26px 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }

        .placeholder { background: #fff; border: 1px dashed var(--border); border-radius: 18px; padding: 34px 24px; text-align: center; color: var(--muted); }
        .placeholder .big { font-size: 42px; margin-bottom: 8px; }
        .placeholder h3 { margin: 0 0 8px; color: var(--text); font-size: 18px; letter-spacing: -.3px; }
        .placeholder p { margin: 0; font-size: 13px; line-height: 1.6; }
        .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
        .error-card { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px 20px; border-radius: 14px; font-size: 14px; }
        .status { margin-top: 10px; font-size: 12px; color: var(--muted); }

        /* ============================================================
           PASSPORT
           ============================================================ */
        .passport-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .passport-toggle {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 20px 26px;
            background: linear-gradient(135deg, var(--passport-navy) 0%, var(--passport-navy-deep) 100%);
            color: #fff;
            border: 0;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: filter .2s ease;
        }
        .passport-toggle:hover { filter: brightness(1.12); }
        .passport-toggle-icon { font-size: 28px; line-height: 1; flex-shrink: 0; }
        .passport-toggle-text-group { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .passport-toggle-text {
            font-family: "Cormorant Garamond", "Playfair Display", serif;
            font-size: 21px;
            font-weight: 600;
            letter-spacing: .04em;
            color: #f4ecd8;
            line-height: 1.15;
        }
        .passport-toggle-sub {
            font-family: "Courier Prime", monospace;
            font-size: 11px;
            letter-spacing: .14em;
            color: rgba(232,200,92,.65);
        }
        .passport-toggle-chevron {
            font-size: 13px;
            transition: transform .25s ease;
            opacity: .7;
            flex-shrink: 0;
        }
        .passport-toggle[aria-expanded="true"] .passport-toggle-chevron { transform: rotate(180deg); }
        .passport-body {
            padding: 30px 24px 32px;
            background: linear-gradient(180deg, #f7f5ef 0%, #ebe6da 100%);
        }
        .passport-body[hidden] { display: none; }
        .pp-loading {
            text-align: center;
            padding: 60px 20px;
            font-family: "Caveat", cursive;
            font-size: 22px;
            color: var(--muted);
        }

        .passport-widget { max-width: 820px; margin: 0 auto; }

        /* Toolbar */
        .passport-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .pp-nav {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--border);
            font-size: 20px;
            color: #444;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: .2s ease;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,.05);
            flex-shrink: 0;
        }
        .pp-nav:hover:not(:disabled) { background: #222; color: #fff; border-color: #222; }
        .pp-nav:disabled { opacity: .35; cursor: not-allowed; }
        .pp-indicator {
            font-family: "Courier Prime", monospace;
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #555;
            min-width: 140px;
            text-align: center;
            font-weight: 700;
        }
        .pp-print {
            padding: 10px 18px;
            border-radius: 50px;
            background: #fff;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            color: #444;
            cursor: pointer;
            transition: .2s ease;
        }
        .pp-print:hover { border-color: #bbb; color: #000; }

        /* Book */
        .passport-book-wrap {
            perspective: 2000px;
            perspective-origin: 50% 50%;
            position: relative;
            width: 100%;
            aspect-ratio: 1.42 / 1;
            max-width: 780px;
            margin: 0 auto;
        }
        .passport-book {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }
        .passport-page {
            position: absolute;
            inset: 0;
            transform-origin: center;
            transition: transform 0.65s cubic-bezier(0.645, 0.045, 0.355, 1),
                        opacity 0.45s ease;
            backface-visibility: hidden;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 20px 50px -15px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.15);
            pointer-events: none;
            opacity: 0;
            transform: translateX(8%) rotateY(25deg) scale(0.96);
            background: var(--passport-paper);
        }
        .passport-page.is-active {
            opacity: 1;
            transform: translateX(0) rotateY(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }
        .passport-page.is-past {
            opacity: 0;
            transform: translateX(-8%) rotateY(-25deg) scale(0.96);
            z-index: 5;
        }

        /* Cover pages (front + back) */
        .pp-cover-page, .pp-back-page {
            background: linear-gradient(155deg, var(--passport-navy) 0%, var(--passport-navy-deep) 55%, #060b15 100%);
            color: #f4ecd8;
            width: 100%; height: 100%;
            padding: 5% 8% 4%;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .pp-cover-page::before, .pp-back-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(201,162,39,.09) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(201,162,39,.07) 0%, transparent 40%);
            pointer-events: none;
        }
        .pp-cover-inner, .pp-back-inner {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 5%;
        }
        .pp-crest, .pp-back-crest {
            width: clamp(70px, 11vw, 110px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(201,162,39,.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(32px, 4.5vw, 46px);
            color: var(--passport-gold);
            background: rgba(201,162,39,.05);
            box-shadow: inset 0 0 40px rgba(201,162,39,.12);
            flex-shrink: 0;
        }
        .pp-cover-title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pp-cover-top {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(13px, 1.9vw, 18px);
            letter-spacing: .4em;
            color: rgba(232,200,92,.7);
            text-transform: uppercase;
            font-weight: 500;
        }
        .pp-cover-main {
            font-family: "Playfair Display", serif;
            font-size: clamp(24px, 4.4vw, 40px);
            font-weight: 700;
            letter-spacing: -.3px;
            color: var(--passport-gold-light);
            line-height: 1;
        }
        .pp-cover-bottom {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(15px, 2.4vw, 22px);
            letter-spacing: .5em;
            color: var(--passport-gold-light);
            margin-top: 4px;
            padding-top: 10px;
            border-top: 1px solid rgba(232,200,92,.3);
            font-weight: 500;
        }
        .pp-cover-footer {
            position: absolute;
            bottom: 5%;
            left: 8%;
            right: 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: "Courier Prime", monospace;
            font-size: clamp(8px, 1vw, 11px);
            letter-spacing: .15em;
            color: rgba(232,200,92,.55);
            text-transform: uppercase;
            gap: 12px;
        }
        .pp-cover-serial { font-weight: 700; color: rgba(232,200,92,.75); }

        /* Back cover */
        .pp-back-crest { font-size: clamp(48px, 7vw, 68px); border-color: rgba(201,162,39,.4); }
        .pp-back-motto {
            font-family: "Caveat", cursive;
            font-size: clamp(16px, 2.5vw, 22px);
            color: var(--passport-gold-light);
            font-style: italic;
            max-width: 80%;
            line-height: 1.4;
        }
        .pp-back-info {
            font-family: "Courier Prime", monospace;
            font-size: clamp(8px, 1.05vw, 11px);
            letter-spacing: .05em;
            color: rgba(232,200,92,.55);
            max-width: 72%;
            line-height: 1.7;
        }
        .pp-back-info p { margin: 0 0 6px; }
        .pp-back-info p:last-child { margin: 0; }
        .pp-print-inline {
            padding: 10px 20px;
            border-radius: 50px;
            background: transparent;
            color: var(--passport-gold-light);
            border: 1px solid rgba(232,200,92,.5);
            font-family: "Courier Prime", monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            cursor: pointer;
            transition: .2s ease;
        }
        .pp-print-inline:hover { background: rgba(232,200,92,.1); border-color: var(--passport-gold-light); }

        /* Data page (design A adapted to page context) */
        .pp-data-page {
            background-color: var(--passport-paper);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><path d='M0 20 Q20 10 40 20 T80 20' fill='none' stroke='%2326478f' stroke-opacity='0.06' stroke-width='0.8'/><path d='M0 40 Q20 30 40 40 T80 40' fill='none' stroke='%2326478f' stroke-opacity='0.05' stroke-width='0.8'/><path d='M0 60 Q20 50 40 60 T80 60' fill='none' stroke='%2326478f' stroke-opacity='0.04' stroke-width='0.8'/></svg>");
            color: var(--passport-ink);
            width: 100%; height: 100%;
            padding: 4.5% 5% 3%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .pp-data-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, var(--airmail-red) 0 2%, #fff 2% 4%, var(--airmail-blue) 4% 6%, #fff 6% 8%) top left / 8% 6px repeat-x,
                linear-gradient(90deg, var(--airmail-red) 0 2%, #fff 2% 4%, var(--airmail-blue) 4% 6%, #fff 6% 8%) bottom left / 8% 6px repeat-x;
            pointer-events: none;
        }
        .pp-data-inner { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; }
        .pp-data-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding-bottom: 3%;
            border-bottom: 1px solid rgba(38,71,143,.2);
            margin-bottom: 4%;
        }
        .pp-issuing { flex: 1; min-width: 0; }
        .pp-issuing-country {
            font-family: "Playfair Display", serif;
            font-size: clamp(16px, 2.4vw, 26px);
            font-weight: 700;
            color: var(--passport-navy);
            line-height: 1;
            letter-spacing: -.4px;
        }
        .pp-issuing-sub {
            font-family: "Courier Prime", monospace;
            font-size: clamp(7px, 1vw, 10px);
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--airmail-red);
            margin-top: 4px;
        }
        .pp-doc-type {
            text-align: right;
            font-family: "Courier Prime", monospace;
            font-size: clamp(8px, 1.1vw, 11px);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--passport-navy);
            line-height: 1.5;
        }
        .pp-doc-type strong {
            display: block;
            font-family: "Playfair Display", serif;
            font-size: clamp(13px, 1.9vw, 19px);
            font-weight: 700;
            color: var(--airmail-red);
            letter-spacing: -.2px;
            text-transform: none;
            margin-top: 2px;
        }

        .pp-data-body { display: grid; grid-template-columns: 1fr auto; gap: 4%; flex: 1; }
        .pp-fields { display: flex; flex-direction: column; gap: 2.5%; min-width: 0; }
        .pp-field { display: flex; flex-direction: column; gap: 2px; }
        .pp-field-label {
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.85vw, 8px);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--airmail-blue);
            opacity: .85;
        }
        .pp-field-value {
            font-family: "Playfair Display", serif;
            font-size: clamp(11px, 1.7vw, 16px);
            font-weight: 600;
            color: var(--passport-ink);
            line-height: 1.15;
            border-bottom: 1px dotted rgba(38,71,143,.4);
            padding-bottom: 2px;
            word-break: break-word;
        }
        .pp-photo-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: clamp(80px, 20vw, 140px); }
        .pp-photo {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: linear-gradient(160deg, #f5ead2 0%, #e8dcc0 100%);
            border: 2px solid var(--passport-navy);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(36px, 7vw, 64px);
            filter: sepia(.15);
            position: relative;
            box-shadow: inset 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.1);
        }
        .pp-photo::after {
            content: "";
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(38,71,143,.15);
            border-radius: 2px;
        }
        .pp-photo-caption {
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.9vw, 8px);
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--passport-navy);
            opacity: .7;
            text-align: center;
        }

        .pp-data-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 3%;
            gap: 12px;
        }
        .pp-sig-block { flex: 1; min-width: 0; }
        .pp-sig-label {
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.85vw, 8px);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--airmail-blue);
            margin-bottom: 4px;
        }
        .pp-sig-line {
            font-family: "Caveat", cursive;
            font-size: clamp(14px, 2.4vw, 22px);
            color: var(--passport-ink);
            line-height: 1;
            border-bottom: 1px solid rgba(0,0,0,.3);
            padding-bottom: 2px;
            transform: rotate(-1deg);
            word-break: break-word;
        }
        .pp-passport-no { text-align: right; }
        .pp-passport-no-label {
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.85vw, 8px);
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--airmail-blue);
            margin-bottom: 3px;
        }
        .pp-passport-no-value {
            font-family: "Courier Prime", monospace;
            font-size: clamp(11px, 1.7vw, 16px);
            font-weight: 700;
            color: var(--airmail-red);
            letter-spacing: .08em;
            word-break: break-all;
        }

        .pp-mrz {
            margin-top: 3%;
            background: #fff;
            border: 1px solid rgba(0,0,0,.12);
            padding: 1.5% 2%;
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.9vw, 9px);
            letter-spacing: .02em;
            color: #000;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            word-break: break-all;
        }

        /* Stamp pages */
        .pp-stamp-page {
            background-color: var(--passport-paper);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><path d='M0 30 Q20 20 40 30 T80 30' fill='none' stroke='%2326478f' stroke-opacity='0.04' stroke-width='0.8'/><path d='M0 60 Q20 50 40 60 T80 60' fill='none' stroke='%2326478f' stroke-opacity='0.035' stroke-width='0.8'/></svg>");
            color: var(--passport-ink);
            width: 100%; height: 100%;
            padding: 4% 5%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .pp-stamp-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, var(--airmail-red) 0 2%, #fff 2% 4%, var(--airmail-blue) 4% 6%, #fff 6% 8%) top left / 8% 5px repeat-x,
                linear-gradient(90deg, var(--airmail-red) 0 2%, #fff 2% 4%, var(--airmail-blue) 4% 6%, #fff 6% 8%) bottom left / 8% 5px repeat-x;
            pointer-events: none;
        }
        .pp-stamp-inner-content { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; }
        .pp-stamp-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 2%;
            border-bottom: 1px solid rgba(38,71,143,.2);
            margin-bottom: 4%;
        }
        .pp-stamp-title {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(14px, 2vw, 20px);
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--passport-navy);
            font-weight: 600;
        }
        .pp-stamp-sub {
            font-family: "Courier Prime", monospace;
            font-size: clamp(7px, 1vw, 10px);
            letter-spacing: .14em;
            color: var(--muted);
        }
        .pp-stamp-hint {
            font-family: "Caveat", cursive;
            font-size: clamp(11px, 1.7vw, 15px);
            color: var(--muted);
            text-align: center;
            margin: 2% 0;
            font-style: italic;
        }
        .pp-stamps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4% 3%;
            flex: 1;
            padding: 2% 0;
        }
        .pp-stamp-slot {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pp-stamp-slot.pp-stamp-empty {
            border: 1.5px dashed rgba(38,71,143,.15);
            border-radius: 50%;
            aspect-ratio: 1;
            max-width: 72%;
            margin: 0 auto;
        }
        .pp-stamp-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5%;
            padding: 4%;
        }
        .pp-stamp-flag {
            width: clamp(44px, 8vw, 64px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(211,58,58,.55);
            background: rgba(255,255,255,.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 3.5vw, 32px);
            line-height: 1;
        }
        .pp-stamp-name {
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.9vw, 9px);
            font-weight: 700;
            letter-spacing: .08em;
            color: rgba(211,58,58,.8);
            text-align: center;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pp-stamp-footer {
            text-align: center;
            font-family: "Courier Prime", monospace;
            font-size: clamp(6px, 0.85vw, 8px);
            letter-spacing: .2em;
            color: var(--muted);
            opacity: .55;
            padding-top: 2%;
            border-top: 1px solid rgba(38,71,143,.15);
            margin-top: auto;
            text-transform: uppercase;
        }

        /* Dots */
        .passport-dots { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pp-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(0,0,0,.15);
            border: 0;
            cursor: pointer;
            padding: 0;
            transition: .2s ease;
        }
        .pp-dot:hover:not(.active) { background: rgba(0,0,0,.35); }
        .pp-dot.active { background: var(--passport-gold); width: 24px; border-radius: 4px; }

        /* Mobile */
        @media (max-width: 700px) {
            .header-inner { padding: 13px 15px; flex-wrap: wrap; }
            .logo { font-size: 21px; }
            .nav-link { font-size: 11px; padding: 7px 11px; }
            .wrap { padding: 20px 15px 60px; }
            .hero { padding: 22px; }
            .hero-avatar { width: 76px; height: 76px; font-size: 38px; }
            .hero-name { font-size: 24px; }
            .card { padding: 18px 20px; border-radius: 15px; }

            .passport-toggle { padding: 16px 20px; gap: 10px; }
            .passport-toggle-icon { font-size: 24px; }
            .passport-toggle-text { font-size: 18px; }
            .passport-toggle-sub { font-size: 10px; }
            .passport-body { padding: 18px 12px 22px; }

            .pp-nav { width: 38px; height: 38px; font-size: 16px; }
            .pp-indicator { font-size: 10px; min-width: 100px; }
            .pp-print { padding: 8px 14px; font-size: 11px; }

            .passport-page { overflow-y: auto; }

            /* Cover smaller on mobile */
            .pp-cover-page, .pp-back-page { padding: 4% 6% 3%; }
            .pp-cover-inner, .pp-back-inner { gap: 3%; }
            .pp-crest { width: clamp(50px, 14vw, 80px); font-size: clamp(26px, 7vw, 36px); }
            .pp-cover-main { font-size: clamp(20px, 6vw, 28px); }
            .pp-cover-bottom { font-size: clamp(12px, 3.2vw, 16px); letter-spacing: .35em; }

            /* Data page stacks photo above fields on very narrow */
            @media (max-width: 500px) {
                .pp-data-body { grid-template-columns: 1fr; gap: 8px; }
                .pp-photo-col { min-width: 0; width: 38%; align-self: center; margin-bottom: 8px; }
            }
        }

        /* ============================================================
           PRINT
           ============================================================ */
        @media print {
            @page { margin: 10mm; size: A4 portrait; }

            body { background: #fff !important; }
            header, footer, .hero, .grid, .loading, .passport-toggle { display: none !important; }

            .wrap { max-width: none !important; padding: 0 !important; margin: 0 !important; }
            .passport-card {
                margin: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                background: transparent !important;
                overflow: visible !important;
            }
            .passport-body {
                display: block !important;
                padding: 0 !important;
                background: transparent !important;
            }
            .passport-body[hidden] { display: block !important; }

            .passport-toolbar, .passport-dots { display: none !important; }

            .passport-widget { max-width: none !important; }

            .passport-book-wrap {
                perspective: none !important;
                aspect-ratio: auto !important;
                height: auto !important;
                max-width: none !important;
            }
            .passport-book { position: static !important; transform: none !important; }

            .passport-page {
                position: static !important;
                transform: none !important;
                opacity: 1 !important;
                display: flex !important;
                flex-direction: column !important;
                pointer-events: auto !important;
                page-break-after: always;
                break-after: page;
                margin: 0 auto 8mm !important;
                width: 100%;
                max-width: 180mm;
                aspect-ratio: 1.42 / 1;
                box-shadow: 0 2px 6px rgba(0,0,0,.12) !important;
                border-radius: 4px;
                overflow: hidden;
            }
            .passport-page:last-child { page-break-after: auto; break-after: auto; }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">The <span>Whacky</span> Rack</a>
            <div class="header-right">
                <a href="index.html" class="nav-link">Shop</a>
                <a href="yap.html" class="nav-link">Yap it!</a>
                <a href="tape.html" class="nav-link">Tape it!</a>
                <a href="search-users.html" class="nav-link">People</a>
                <a href="about.html" class="nav-link">About</a>
            </div>
        </div>
    </header>

    <main class="wrap" id="profile-root">
        <div class="loading">Loading profile…</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="consent.js"></script>
    <script src="report.js"></script>
    <script>
        (function() {
            const sb = window.wr.sb;
            const root = document.getElementById("profile-root");

            let session = null;
            let viewer = null;
            let profile = null;
            let isOwnProfile = false;
            let profileFollowsMe = false;
            let savedYapsCount = 0;
            let savedTapesCount = 0;
            let profileTapes = [];

            // Passport state
            let passportState = null;

            function esc(s) {
                return String(s ?? "").replace(/[&<>"']/g, c => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                } [c]));
            }

            function initials(name) {
                const parts = String(name || "?").replace(/[^A-Za-z0-9]/g, " ").trim().split(/\s+/);
                return (parts[0]?.[0] || "?").toUpperCase();
            }

            function timeAgo(iso) {
                const d = new Date(iso);
                const s = Math.floor((Date.now() - d.getTime()) / 1000);
                if (s < 60) return "just now";
                if (s < 3600) return Math.floor(s / 60) + "m ago";
                if (s < 86400) return Math.floor(s / 3600) + "h ago";
                if (s < 604800) return Math.floor(s / 86400) + "d ago";
                return d.toLocaleDateString();
            }

            function flagFor(cc) {
                if (!cc || cc.length !== 2) return "🌍";
                const A = 0x1F1E6;
                return String.fromCodePoint(
                    A + cc.toUpperCase().charCodeAt(0) - 65,
                    A + cc.toUpperCase().charCodeAt(1) - 65
                );
            }

            function countryFlag(name) {
                if (!name) return "🌍";
                if (name.length === 2) return flagFor(name);
                const map = {
                    "india": "🇮🇳", "united states": "🇺🇸", "usa": "🇺🇸",
                    "united kingdom": "🇬🇧", "uk": "🇬🇧", "canada": "🇨🇦",
                    "australia": "🇦🇺", "germany": "🇩🇪", "france": "🇫🇷",
                    "japan": "🇯🇵", "brazil": "🇧🇷", "south africa": "🇿🇦",
                    "nigeria": "🇳🇬", "mexico": "🇲🇽", "spain": "🇪🇸",
                    "italy": "🇮🇹", "netherlands": "🇳🇱", "ireland": "🇮🇪",
                    "new zealand": "🇳🇿", "singapore": "🇸🇬"
                };
                return map[String(name || "").toLowerCase()] || "🌍";
            }

            async function fetchProfileById(id) {
                const {
                    data,
                    error
                } = await sb.from("profiles")
                    .select("id, username, rank, bio, country, gender, age, avatar_url, created_at, passport_number")
                    .eq("id", id)
                    .maybeSingle();
                if (error) throw error;
                return data;
            }

            async function fetchFollowerCounts(profileId) {
                const [{
                    count: followers
                }, {
                    count: following
                }] = await Promise.all([
                    sb.from("follows").select("*", {
                        count: "exact",
                        head: true
                    })
                    .eq("following_id", profileId),
                    sb.from("follows").select("*", {
                        count: "exact",
                        head: true
                    })
                    .eq("follower_id", profileId)
                ]);
                return {
                    followers: followers || 0,
                    following: following || 0
                };
            }

            async function amIFollowing(profileId) {
                if (!session) return false;
                const {
                    data
                } = await sb.from("follows")
                    .select("follower_id")
                    .eq("follower_id", session.user.id)
                    .eq("following_id", profileId)
                    .maybeSingle();
                return !!data;
            }

            async function fetchProfileTapes(profileId) {
                const {
                    data,
                    error
                } = await sb.from("tapes")
                    .select(`
                        id, caption, reaction_count, comment_count, created_at,
                        product:products!tapes_product_id_fkey(id, name, image, category)
                    `)
                    .eq("user_id", profileId)
                    .eq("is_deleted", false)
                    .order("created_at", {
                        ascending: false
                    })
                    .limit(6);
                if (error) {
                    console.error(error);
                    return [];
                }
                return data || [];
            }

            async function recordVisit(profileId) {
                if (!session || profileId === session.user.id) return;
                await sb.rpc("record_profile_visit", {
                    p_profile_id: profileId
                });
            }

            async function fetchRecentVisitors(profileId) {
                const {
                    data
                } = await sb.from("profile_visits")
                    .select("visitor_id, visited_at")
                    .eq("profile_id", profileId)
                    .order("visited_at", {
                        ascending: false
                    })
                    .limit(50);
                if (!data || data.length === 0) return [];

                const byVisitor = new Map();
                for (const v of data) {
                    const cur = byVisitor.get(v.visitor_id);
                    if (!cur) {
                        byVisitor.set(v.visitor_id, {
                            id: v.visitor_id,
                            count: 1,
                            last: v.visited_at
                        });
                    } else {
                        cur.count += 1;
                        if (v.visited_at > cur.last) cur.last = v.visited_at;
                    }
                }
                const grouped = [...byVisitor.values()]
                    .sort((a, b) => (a.last < b.last ? 1 : -1));

                const ids = grouped.map(g => g.id);
                const {
                    data: users
                } = await sb.from("profiles")
                    .select("id, username, avatar_url")
                    .in("id", ids);
                const userMap = new Map((users || []).map(u => [u.id, u]));

                return grouped.map(g => ({
                    id: g.id,
                    username: userMap.get(g.id)?.username || "deleted",
                    count: g.count,
                    last: g.last
                }));
            }

            function renderHero() {
                const joined = new Date(profile.created_at).toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "short",
                    day: "numeric"
                });
                const country = profile.country ?
                    `${countryFlag(profile.country)} ${esc(profile.country)}` :
                    "🌍 Somewhere weird";

                return `
      <section class="hero">
        <div class="hero-avatar">${esc(profile.avatar_url || "🧙")}</div>
        <div class="hero-info">
                    <h1 class="hero-name">
            ${esc(profile.username)}
            <span class="rank-badge">#${profile.rank}</span>
            ${profileFollowsMe ? `<span class="follows-you-badge">Follows you</span>` : ""}
          </h1>
          <p class="hero-meta">
            ${country} · joined <strong>${joined}</strong>
          </p>
        </div>
      </section>
    `;
            }

            /* ---------- Passport section ---------- */
            function renderPassportSection() {
                return `
      <section class="passport-card" id="passport-card">
        <button class="passport-toggle" id="passport-toggle" type="button" aria-expanded="false">
          <span class="passport-toggle-icon">🛂</span>
          <span class="passport-toggle-text-group">
            <span class="passport-toggle-text">The Whacky Citizen Passport</span>
            <span class="passport-toggle-sub" id="passport-toggle-sub">Tap to open →</span>
          </span>
          <span class="passport-toggle-chevron">▼</span>
        </button>
        <div class="passport-body" id="passport-body" hidden></div>
      </section>
    `;
            }

            function computePassportNumber(p) {
                if (p.passport_number) return p.passport_number;
                const year = new Date(p.created_at).getFullYear();
                const rank = String(p.rank || 0).padStart(6, "0");
                return `WR-${year}-${rank}`;
            }

            async function fetchStampsForProfile(profileId) {
                try {
                    const { data, error } = await sb.rpc("get_profile_stamps", { p_profile_id: profileId });
                    if (error) throw error;
                    return (data || []).map(r => r.country_code).filter(Boolean);
                } catch (e) {
                    console.warn("[passport] stamps fetch failed:", e);
                    return [];
                }
            }

            async function fetchCountryNameMap() {
                try {
                    const { data } = await sb.from("countries").select("code, name");
                    return Object.fromEntries((data || []).map(c => [c.code, c.name]));
                } catch (e) {
                    return {};
                }
            }

            function resolveProfileCountry(p, countryMap) {
                const raw = p.country || "";
                if (!raw) return { flag: "🌍", name: "Nowhere", code: null };
                if (raw.length === 2) {
                    const code = raw.toUpperCase();
                    return { flag: flagFor(code), name: countryMap[code] || code, code };
                }
                // Try matching full name
                const found = Object.entries(countryMap).find(([c, n]) =>
                    String(n).toLowerCase() === raw.toLowerCase()
                );
                if (found) return { flag: flagFor(found[0]), name: raw, code: found[0] };
                return { flag: "🌍", name: raw, code: null };
            }

            async function hydratePassportToggle() {
                const toggle = document.getElementById("passport-toggle");
                const body = document.getElementById("passport-body");
                if (!toggle || !body) return;

                toggle.addEventListener("click", async () => {
                    const isOpen = toggle.getAttribute("aria-expanded") === "true";
                    toggle.setAttribute("aria-expanded", isOpen ? "false" : "true");
                    body.hidden = isOpen;

                    if (!isOpen && body.dataset.loaded !== "1") {
                        body.dataset.loaded = "1";
                        await loadPassportIntoBody(body);
                    }
                });
            }

            async function loadPassportIntoBody(body) {
                body.innerHTML = `<div class="pp-loading">Preparing your passport…</div>`;

                const [rawStamps, countryMap] = await Promise.all([
                    fetchStampsForProfile(profile.id),
                    fetchCountryNameMap()
                ]);

                // Filter out the profile's own country from stamps (no self-travel)
                const selfCountryCode = profile.country && profile.country.length === 2
                    ? profile.country.toUpperCase()
                    : null;
                const stamps = selfCountryCode
                    ? rawStamps.filter(cc => cc !== selfCountryCode)
                    : rawStamps;

                const ppNumber = computePassportNumber(profile);

                // Stamp pages: minimum 5, expand if needed (6 stamps per page)
                const totalStampPages = Math.max(5, Math.ceil(stamps.length / 6));
                const stampPages = [];
                for (let i = 0; i < totalStampPages; i++) {
                    stampPages.push(stamps.slice(i * 6, (i + 1) * 6));
                }

                const totalPages = 2 + totalStampPages + 1; // cover + data + stamps + back

                passportState = {
                    currentPage: 0,
                    totalPages,
                    stamps,
                    countryMap,
                    ppNumber,
                    stampPages,
                    totalStampPages
                };

                body.innerHTML = renderPassportWidget();
                wirePassportNav();

                // Update toggle subtitle now that we know the number
                const sub = document.getElementById("passport-toggle-sub");
                if (sub) sub.textContent = ppNumber;
            }

            function renderPassportWidget() {
                const { totalPages, currentPage } = passportState;

                let pagesHtml = "";
                for (let i = 0; i < totalPages; i++) {
                    const activeClass = i === currentPage ? " is-active" : "";
                    pagesHtml += `<div class="passport-page${activeClass}" data-page="${i}">${renderPassportPage(i)}</div>`;
                }

                let dotsHtml = "";
                for (let i = 0; i < totalPages; i++) {
                    dotsHtml += `<button class="pp-dot${i === currentPage ? " active" : ""}" type="button" data-pp-goto="${i}" aria-label="Go to page ${i + 1}"></button>`;
                }

                return `
      <div class="passport-widget">
        <div class="passport-toolbar">
          <button class="pp-nav" type="button" data-pp-prev ${currentPage === 0 ? "disabled" : ""}>←</button>
          <span class="pp-indicator" id="pp-indicator">${passportPageLabel(currentPage)}</span>
          <button class="pp-nav" type="button" data-pp-next ${currentPage === totalPages - 1 ? "disabled" : ""}>→</button>
          <button class="pp-print" type="button" id="pp-print" onclick="window.print()">🖨 Print / PDF</button>
        </div>
        <div class="passport-book-wrap">
          <div class="passport-book">
            ${pagesHtml}
          </div>
        </div>
        <div class="passport-dots">
          ${dotsHtml}
        </div>
      </div>
    `;
            }

            function passportPageLabel(index) {
                const { totalPages, totalStampPages } = passportState;
                if (index === 0) return "Front cover";
                if (index === totalPages - 1) return "Back cover";
                if (index === 1) return "Identity";
                return `Travels · ${index - 1} / ${totalStampPages}`;
            }

            function renderPassportPage(index) {
                const { totalPages, ppNumber, countryMap, stampPages } = passportState;
                if (index === 0) return renderFrontCover(ppNumber);
                if (index === totalPages - 1) return renderBackCover();
                if (index === 1) return renderDataPage(ppNumber, countryMap);
                return renderStampPage(index - 2, stampPages[index - 2] || [], countryMap);
            }

            function renderFrontCover(ppNumber) {
                return `
      <div class="pp-cover-page">
        <div class="pp-cover-inner">
          <div class="pp-crest">✉</div>
          <div class="pp-cover-title">
            <div class="pp-cover-top">The Whacky Rack</div>
            <div class="pp-cover-main">Whacky Citizen</div>
            <div class="pp-cover-bottom">Passport</div>
          </div>
        </div>
        <div class="pp-cover-footer">
          <div>Republic of the Rack</div>
          <div class="pp-cover-serial">${esc(ppNumber)}</div>
        </div>
      </div>
    `;
            }

            function renderBackCover() {
                return `
      <div class="pp-back-page">
        <div class="pp-back-inner">
          <div class="pp-back-crest">🦆</div>
          <div class="pp-back-motto">"Weird by choice. Kind by nature. Allergic to algorithmic feeds."</div>
          <div class="pp-back-info">
            <p>This passport is a symbolic digital artifact. No physical document exists. No border is real. No government endorses this.</p>
            <p>Holders are citizens of the Rack, and of nowhere.</p>
          </div>
          <button class="pp-print-inline" type="button" onclick="window.print()">🖨 Print / Save as PDF</button>
        </div>
      </div>
    `;
            }

            function renderDataPage(ppNumber, countryMap) {
                const countryInfo = resolveProfileCountry(profile, countryMap);
                const joined = new Date(profile.created_at).toLocaleDateString(undefined, {
                    day: "2-digit", month: "short", year: "numeric"
                });

                // MRZ - 2 lines, 44 chars each, uppercase A-Z 0-9 < only
                const safeUsername = (profile.username || "")
                    .toUpperCase()
                    .replace(/[^A-Z0-9]/g, "<")
                    .padEnd(30, "<")
                    .slice(0, 30);
                const mrzLine1 = `P<WR${safeUsername}`.padEnd(44, "<").slice(0, 44);

                const ppDigits = ppNumber.replace(/[^A-Z0-9]/g, "");
                const countryCode = (countryInfo.code || "XX").padEnd(3, "<");
                const rankDigits = String(profile.rank || 0).padStart(6, "0");
                const dobFragment = new Date(profile.created_at).toISOString().slice(2, 10).replace(/-/g, "");
                const mrzLine2Base = `${ppDigits}<WR${rankDigits}1${countryCode}${dobFragment}M<<<<<<<<<<<<<<`;
                const mrzLine2 = mrzLine2Base.padEnd(44, "<").slice(0, 44);

                return `
      <div class="pp-data-page">
        <div class="pp-data-inner">
          <div class="pp-data-top">
            <div class="pp-issuing">
              <div class="pp-issuing-country">The Whacky Rack</div>
              <div class="pp-issuing-sub">Republic of the Rack</div>
            </div>
            <div class="pp-doc-type">
              Type W
              <strong>Passport</strong>
            </div>
          </div>

          <div class="pp-data-body">
            <div class="pp-fields">
              <div class="pp-field">
                <div class="pp-field-label">Username</div>
                <div class="pp-field-value">${esc(profile.username)}</div>
              </div>
              <div class="pp-field">
                <div class="pp-field-label">Nationality</div>
                <div class="pp-field-value">Whacky Citizen</div>
              </div>
              <div class="pp-field">
                <div class="pp-field-label">Country of Residence</div>
                <div class="pp-field-value">${countryInfo.flag} ${esc(countryInfo.name)}</div>
              </div>
              <div class="pp-field">
                <div class="pp-field-label">Gender</div>
                <div class="pp-field-value">${esc(profile.gender || "—")}</div>
              </div>
              <div class="pp-field">
                <div class="pp-field-label">Age</div>
                <div class="pp-field-value">${profile.age || "—"}</div>
              </div>
              <div class="pp-field">
                <div class="pp-field-label">Date of Issue</div>
                <div class="pp-field-value">${esc(joined)}</div>
              </div>
            </div>

            <div class="pp-photo-col">
              <div class="pp-photo">${esc(profile.avatar_url || "🧙")}</div>
              <div class="pp-photo-caption">Holder</div>
            </div>
          </div>

          <div class="pp-data-footer">
            <div class="pp-sig-block">
              <div class="pp-sig-label">Bearer's signature</div>
              <div class="pp-sig-line">${esc(profile.username)}</div>
            </div>
            <div class="pp-passport-no">
              <div class="pp-passport-no-label">Passport No.</div>
              <div class="pp-passport-no-value">${esc(ppNumber)}</div>
            </div>
          </div>

          <div class="pp-mrz">
            <div>${esc(mrzLine1)}</div>
            <div>${esc(mrzLine2)}</div>
          </div>
        </div>
      </div>
    `;
            }

            function renderStampPage(pageIndex, stamps, countryMap) {
                const slots = [];
                const rotations = [-6, 4, -2, 5, -4, 3];

                for (let i = 0; i < 6; i++) {
                    const cc = stamps[i];
                    if (!cc) {
                        slots.push(`<div class="pp-stamp-slot pp-stamp-empty"></div>`);
                    } else {
                        const flag = flagFor(cc);
                        const name = (countryMap[cc] || cc).toUpperCase();
                        const rot = rotations[i] || 0;
                        slots.push(`
              <div class="pp-stamp-slot" style="transform:rotate(${rot}deg);">
                <div class="pp-stamp-inner">
                  <div class="pp-stamp-flag">${flag}</div>
                  <div class="pp-stamp-name">${esc(name)}</div>
                </div>
              </div>
            `);
                    }
                }

                const hint = stamps.length === 0
                    ? `<div class="pp-stamp-hint">No stamps yet — start a conversation on the globe to collect them.</div>`
                    : "";

                return `
      <div class="pp-stamp-page">
        <div class="pp-stamp-inner-content">
          <div class="pp-stamp-header">
            <div class="pp-stamp-title">Travels</div>
            <div class="pp-stamp-sub">Page ${pageIndex + 1}</div>
          </div>
          ${hint}
          <div class="pp-stamps-grid">
            ${slots.join("")}
          </div>
          <div class="pp-stamp-footer">The Whacky Rack · Republic of the Rack</div>
        </div>
      </div>
    `;
            }

            function wirePassportNav() {
                const body = document.getElementById("passport-body");
                if (!body) return;

                body.addEventListener("click", (e) => {
                    const gotoBtn = e.target.closest("[data-pp-goto]");
                    if (gotoBtn) {
                        const idx = parseInt(gotoBtn.dataset.ppGoto, 10);
                        if (!isNaN(idx)) goToPassportPage(idx);
                        return;
                    }
                    const prevBtn = e.target.closest("[data-pp-prev]");
                    if (prevBtn) {
                        goToPassportPage(passportState.currentPage - 1);
                        return;
                    }
                    const nextBtn = e.target.closest("[data-pp-next]");
                    if (nextBtn) {
                        goToPassportPage(passportState.currentPage + 1);
                        return;
                    }
                });

                // Keyboard navigation (only when focus is inside the widget)
                body.tabIndex = 0;
                body.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowLeft") {
                        e.preventDefault();
                        goToPassportPage(passportState.currentPage - 1);
                    } else if (e.key === "ArrowRight") {
                        e.preventDefault();
                        goToPassportPage(passportState.currentPage + 1);
                    }
                });
            }

            function goToPassportPage(newIndex) {
                if (!passportState) return;
                const { currentPage, totalPages } = passportState;
                if (newIndex < 0 || newIndex >= totalPages || newIndex === currentPage) return;

                // Update page classes
                document.querySelectorAll(".passport-page").forEach(page => {
                    const pageIdx = parseInt(page.dataset.page, 10);
                    page.classList.remove("is-active", "is-past");
                    if (pageIdx < newIndex) page.classList.add("is-past");
                    else if (pageIdx === newIndex) page.classList.add("is-active");
                });

                passportState.currentPage = newIndex;

                // Update indicator
                const ind = document.getElementById("pp-indicator");
                if (ind) ind.textContent = passportPageLabel(newIndex);

                // Update prev/next button states
                const prev = document.querySelector("[data-pp-prev]");
                const next = document.querySelector("[data-pp-next]");
                if (prev) prev.disabled = newIndex === 0;
                if (next) next.disabled = newIndex === totalPages - 1;

                // Update dots
                document.querySelectorAll(".pp-dot").forEach(dot => {
                    dot.classList.toggle("active", parseInt(dot.dataset.ppGoTo, 10) === newIndex ||
                                                  parseInt(dot.dataset.ppGoto, 10) === newIndex);
                });
            }

            /* ---------- Rest of the profile ---------- */
            function renderSidebar(visitors) {
                const bio = profile.bio?.trim() || "This user hasn't written a bio yet.";
                const meta = [];
                if (profile.gender) meta.push(esc(profile.gender));
                if (profile.age) meta.push(`${profile.age} y/o`);
                if (profile.country) meta.push(esc(profile.country));

                return `
      <div class="card">
        <h2 class="card-title">About</h2>
        <p class="bio-text">${esc(bio)}</p>
        ${meta.length ? `<p class="hero-meta" style="margin-top:10px;">${meta.join(" · ")}</p>` : ""}
      </div>

         <div class="card">
        <h2 class="card-title">Stats</h2>
        <div class="stat-row">
          <a class="stat-box" href="followers.html?id=${esc(profile.id)}">
            <div class="n" id="followers-count">0</div>
            <div class="l">Followers</div>
          </a>
          <a class="stat-box" href="followers.html?id=${esc(profile.id)}&tab=following">
            <div class="n" id="following-count">0</div>
            <div class="l">Following</div>
          </a>
        </div>
      </div>

                ${isOwnProfile ? `
        <div class="card">
          <h2 class="card-title">Bookmarks</h2>
          <a class="btn btn-ghost" href="bookmarks.html" style="width:100%; justify-content:center; text-decoration:none;">
            🔖 Yaps: ${savedYapsCount} · Tapes: ${savedTapesCount}
          </a>
        </div>
      ` : ""}
            <div class="card">
        <h2 class="card-title">Lifetime Ledger</h2>
        <p style="font-size: 13px; color: #555; line-height: 1.65; margin: 0 0 14px;">
          A complete record of ${isOwnProfile ? 'your' : 'their'} life on the Rack — letters, correspondences, gifts, and years.
        </p>
        <a class="btn btn-ghost" href="ledger.html?id=${esc(profile.id)}" style="width:100%; justify-content:center; text-decoration:none;">
          📜 View ${isOwnProfile ? 'your' : 'their'} ledger →
        </a>
      </div>

      ${isOwnProfile ? `
        <div class="card">
          <h2 class="card-title">
            Recent visitors
            <span class="count">${visitors.length ? visitors.length : "0"}</span>
          </h2>
          ${visitors.length === 0
            ? `<div class="empty">No one's dropped by yet.</div>`
            : visitors.slice(0, 12).map(v => `
                <div class="visitor-row">
                  <div class="visitor-avatar">${esc(initials(v.username))}</div>
                  <div class="visitor-name">${esc(v.username)}</div>
                  <div class="visitor-time">
                    ${v.count > 1 ? `×${v.count} · ` : ""}${esc(timeAgo(v.last))}
                  </div>
                </div>
              `).join("")
          }
        </div>
      ` : ""}
    `;
            }

            function renderMain(following) {
                const canFollow = session && !isOwnProfile;

                return `
            <div class="card">
        <h2 class="card-title">Actions</h2>
            <div class="btn-row">
          ${isOwnProfile
            ? `<a class="btn btn-ghost" href="settings.html" style="text-decoration:none;">Account settings</a>`
            : canFollow
              ? `<button class="btn ${following ? "btn-ghost" : "btn-primary"}" id="follow-btn" type="button" data-following="${following ? "1" : "0"}">
                   ${following ? "Unfollow" : "Follow"}
                 </button>`
              : `<a class="btn btn-primary" href="signup.html">Sign up to follow</a>`
          }
          ${!isOwnProfile && session ? `<button class="btn btn-ghost" type="button" onclick="window.report.open('profile', '${esc(profile.id)}', '${esc(profile.username)}')">Report</button>` : ""}
        </div>
        <div class="status" id="follow-status"></div>
      </div>

           <div class="card">
        <h2 class="card-title">
          Tape it!
          <span class="count">${profileTapes.length}</span>
        </h2>
        ${renderMiniTapeFeed()}
      </div>
    `;
            }

            function renderMiniTapeFeed() {
                if (profileTapes.length === 0) {
                    if (isOwnProfile) {
                        return `<div class="mini-tape-empty">
                            You haven't taped anything yet. Go to the <a href="index.html" style="color:var(--accent-dark);font-weight:800;text-decoration:underline;">Shop</a> and hit <strong>Tape it!</strong> on something weird.
                        </div>`;
                    }
                    return `<div class="mini-tape-empty">
                        ${esc(profile.username)} hasn't taped anything yet.
                    </div>`;
                }

                const cardsHtml = profileTapes.map(t => {
                    const product = t.product || {};
                    const caption = (t.caption || "").trim();
                    return `
                        <a class="mini-tape" href="tape-thread.html?id=${esc(t.id)}">
                            <img class="mini-tape-img" src="${esc(product.image || "")}" alt="" loading="lazy" decoding="async">
                            <div class="mini-tape-info">
                                <div class="mini-tape-cat">${esc(product.category || "")}</div>
                                <h3 class="mini-tape-name">${esc(product.name || "")}</h3>
                                ${caption ? `<p class="mini-tape-caption">${esc(caption)}</p>` : ""}
                                <div class="mini-tape-meta">
                                    <span>${esc(timeAgo(t.created_at))}</span>
                                    <span class="pill">📼 ${t.reaction_count || 0}</span>
                                    <span class="pill">💬 ${t.comment_count || 0}</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join("");

                const viewAll = profileTapes.length >= 6 ?
                    `<div style="text-align:center;margin-top:12px;">
                           <a href="tape.html" style="color:var(--accent-dark);font-size:12px;font-weight:800;text-decoration:none;">See more on the Tape feed →</a>
                       </div>` :
                    "";

                return `<div class="mini-tape-list">${cardsHtml}</div>${viewAll}`;
            }

            async function renderAll() {
                const [counts, following, visitors] = await Promise.all([
                    fetchFollowerCounts(profile.id),
                    amIFollowing(profile.id),
                    isOwnProfile ? fetchRecentVisitors(profile.id) : Promise.resolve([])
                ]);

                root.innerHTML = `
      ${renderHero()}
      ${renderPassportSection()}
      <div class="grid">
        <div>${renderSidebar(visitors)}</div>
        <div>${renderMain(following)}</div>
      </div>
    `;

                document.getElementById("followers-count").textContent = counts.followers;
                document.getElementById("following-count").textContent = counts.following;

                const followBtn = document.getElementById("follow-btn");
                if (followBtn) followBtn.addEventListener("click", handleFollowToggle);

                // Wire up passport toggle (lazy loading on first open)
                await hydratePassportToggle();
            }

            async function handleFollowToggle() {
                const btn = document.getElementById("follow-btn");
                const status = document.getElementById("follow-status");
                if (!btn || !session || isOwnProfile) return;

                const isFollowing = btn.dataset.following === "1";
                btn.disabled = true;
                status.textContent = "";

                try {
                    if (isFollowing) {
                        const {
                            error
                        } = await sb.from("follows").delete()
                            .eq("follower_id", session.user.id)
                            .eq("following_id", profile.id);
                        if (error) throw error;
                        btn.dataset.following = "0";
                        btn.textContent = "Follow";
                        btn.className = "btn btn-primary";
                    } else {
                        const {
                            error
                        } = await sb.from("follows").insert({
                            follower_id: session.user.id,
                            following_id: profile.id
                        });
                        if (error && error.code !== "23505") throw error;
                        btn.dataset.following = "1";
                        btn.textContent = "Unfollow";
                        btn.className = "btn btn-ghost";
                    }
                    const counts = await fetchFollowerCounts(profile.id);
                    document.getElementById("followers-count").textContent = counts.followers;
                } catch (e) {
                    console.error(e);
                    status.textContent = "Something went wrong. Try again.";
                } finally {
                    btn.disabled = false;
                }
            }

            async function init() {
                try {
                    const {
                        data: {
                            session: s
                        }
                    } = await sb.auth.getSession();
                    session = s;
                    viewer = null;

                    const params = new URLSearchParams(location.search);
                    const idParam = params.get("id");
                    const targetId = idParam || (session?.user.id ?? null);

                    if (!targetId) {
                        root.innerHTML = `
          <div class="placeholder">
            <div class="big">🔐</div>
            <h3>Sign in to see profiles</h3>
            <p>You need an account to view profiles or set up your own.</p>
            <div style="margin-top:16px;">
              <a class="btn btn-primary" href="signup.html">Join</a>
              <a class="btn btn-ghost" href="login.html" style="margin-left:8px;">Sign in</a>
            </div>
          </div>`;
                        return;
                    }

                    profile = await fetchProfileById(targetId);
                    if (!profile) {
                        root.innerHTML = `<div class="error-card">This profile doesn't exist or has been deleted.</div>`;
                        return;
                    }

                    isOwnProfile = session && session.user.id === profile.id;

                    if (session && !isOwnProfile) {
                        recordVisit(profile.id).catch(() => {});
                        const {
                            data: f
                        } = await sb.from("follows")
                            .select("follower_id")
                            .eq("follower_id", profile.id)
                            .eq("following_id", session.user.id)
                            .maybeSingle();
                        profileFollowsMe = !!f;
                    }

                    if (isOwnProfile) {
                        const [yapsRes, tapesRes] = await Promise.all([
                            sb.from("yap_bookmarks").select("*", {
                                count: "exact",
                                head: true
                            }).eq("user_id", profile.id),
                            sb.from("tape_bookmarks").select("*", {
                                count: "exact",
                                head: true
                            }).eq("user_id", profile.id)
                        ]);
                        savedYapsCount = yapsRes.count || 0;
                        savedTapesCount = tapesRes.count || 0;
                    }

                    profileTapes = await fetchProfileTapes(profile.id);

                    await renderAll();
                } catch (e) {
                    console.error(e);
                    root.innerHTML = `<div class="error-card">Couldn't load this profile. Please try again.</div>`;
                }
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }

        })();
    </script>
</body>
