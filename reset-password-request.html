<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — The Whacky Rack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
  :root {
    --bg:#f7f5ef; --card:#fff; --text:#202020; --muted:#777;
    --accent:#ff5a36; --accent-dark:#e84625;
    --border:#e8e4dc; --shadow:0 8px 25px rgba(0,0,0,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
  header { background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000; }
  .header-inner { max-width:1250px; margin:auto; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .logo { font-size:25px; font-weight:900; letter-spacing:-1px; color:inherit; text-decoration:none; white-space:nowrap; }
  .logo span { color:var(--accent); }
  .header-right { display:flex; align-items:center; gap:12px; }
  .nav-link { font-size:13px; font-weight:700; padding:8px 14px; border-radius:50px; border:1px solid var(--border); background:#fff; color:inherit; text-decoration:none; }
  .nav-link:hover { border-color:#bbb; }

  .wrap { max-width:460px; margin:auto; padding:60px 22px 80px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:34px 32px; box-shadow:var(--shadow); }
  .card h1 { margin:0 0 6px; font-size:28px; letter-spacing:-1px; font-weight:950; }
  .card h1 span { color:var(--accent); }
  .card .sub { margin:0 0 22px; color:var(--muted); font-size:14px; line-height:1.6; }

  label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; margin:16px 0 6px; color:#555; }
  input[type=email] {
    width:100%; padding:12px 14px; font-family:inherit; font-size:14px;
    background:#fafafa; border:1px solid var(--border); border-radius:12px;
    outline:none; color:var(--text); transition:.2s ease;
  }
  input[type=email]:focus { border-color:var(--accent); background:#fff; }

  .turnstile-wrap { margin:20px 0 10px; min-height:65px; }

  .submit-btn {
    width:100%; padding:14px 20px; background:var(--accent); color:#fff; border:0;
    border-radius:50px; font-family:inherit; font-weight:900; font-size:14px;
    cursor:pointer; transition:.2s ease; margin-top:6px;
  }
  .submit-btn:hover:not(:disabled) { background:var(--accent-dark); }
  .submit-btn:disabled { opacity:.6; cursor:not-allowed; }

  .status { margin-top:16px; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.55; display:none; }
  .status.show { display:block; }
  .status.err { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
  .status.ok { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }

  .alt { text-align:center; margin-top:20px; font-size:13px; color:#666; }
  .alt a { color:var(--accent-dark); font-weight:800; text-decoration:none; }
  .alt a:hover { text-decoration:underline; }

  @media (max-width:600px) {
    .card { padding:26px 20px; border-radius:15px; }
    .header-inner { padding:13px 15px; flex-wrap:wrap; }
    .logo { font-size:21px; }
    .nav-link { font-size:11px; padding:7px 11px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">The <span>Whacky</span> Rack</a>
    <div class="header-right">
      <a href="index.html" class="nav-link">Shop</a>
      <a href="world.html" class="nav-link">World</a>
      <a href="history.html" class="nav-link">History</a>
      <a href="about.html" class="nav-link">About</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <h1>Reset <span>password</span></h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>

    <form id="req-form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <div class="turnstile-wrap">
        <div id="turnstile-container"></div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn" disabled>Send reset link</button>
      <div class="status" id="status"></div>
    </form>

    <p class="alt"><a href="login.html">← Back to sign in</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  const sb = window.wr.sb;
  const TURNSTILE_SITE_KEY = "YOUR_TURNSTILE_SITE_KEY";

  const form = document.getElementById("req-form");
  const emailEl = document.getElementById("email");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");
  const container = document.getElementById("turnstile-container");

  let captchaToken = null;
  let widgetId = null;

  function initTurnstile() {
    if (typeof turnstile === "undefined") return setTimeout(initTurnstile, 200);
    widgetId = turnstile.render(container, {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (t) => { captchaToken = t; validate(); },
      "expired-callback": () => { captchaToken = null; validate(); },
      "error-callback": () => { captchaToken = null; validate(); }
    });
  }
  initTurnstile();

  function validate() {
    const ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailEl.value) && captchaToken;
    submitBtn.disabled = !ok;
  }
  emailEl.addEventListener("input", validate);

  function status(msg, kind = "err") {
    statusEl.className = "status show " + kind;
    statusEl.textContent = msg;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!captchaToken) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const redirectTo = new URL("reset-password.html", window.location.href).href;

    const { error } = await sb.auth.resetPasswordForEmail(emailEl.value.trim(), {
      redirectTo,
      captchaToken
    });

    if (error) {
      status(error.message || "Could not send reset email.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Send reset link";
      if (typeof turnstile !== "undefined" && widgetId !== null) {
        turnstile.reset(widgetId);
        captchaToken = null;
      }
      return;
    }

    status("If that email is registered, a reset link is on its way. Check your inbox.", "ok");
    submitBtn.textContent = "Sent";
    // Don't re-enable — prevents duplicate sends
  });
})();
</script>
</body>
</html>
