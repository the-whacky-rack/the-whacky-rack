<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join — The Whacky Rack</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
  :root {
    --bg:#f7f5ef; --card:#fff; --text:#202020; --muted:#777;
    --accent:#ff5a36; --accent-dark:#e84625;
    --border:#e8e4dc; --pill:#fff0eb;
    --shadow:0 8px 25px rgba(0,0,0,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }

  header { background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1000; }
  .header-inner { max-width:1250px; margin:auto; padding:16px 22px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .logo { font-size:25px; font-weight:900; letter-spacing:-1px; color:inherit; text-decoration:none; white-space:nowrap; }
  .logo span { color:var(--accent); }
  .header-right { display:flex; align-items:center; gap:12px; }
  .nav-link { font-size:13px; font-weight:700; padding:8px 14px; border-radius:50px; border:1px solid var(--border); background:#fff; color:inherit; text-decoration:none; white-space:nowrap; transition:.2s ease; }
  .nav-link:hover { border-color:#bbb; }
  .nav-link.active { background:#222; color:#fff; border-color:#222; }

  .signup-wrap { max-width:560px; margin:auto; padding:55px 22px 80px; }
  .signup-card {
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:36px 34px; box-shadow:var(--shadow);
  }
  .signup-title { margin:0 0 6px; font-size:32px; letter-spacing:-1px; font-weight:950; }
  .signup-title span { color:var(--accent); }
  .signup-sub { margin:0 0 26px; color:var(--muted); font-size:14px; line-height:1.6; }

  label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; margin:16px 0 6px; color:#555; }
  label.optional::after { content:" (optional)"; font-weight:600; text-transform:none; letter-spacing:0; color:#aaa; font-size:11px; }
  input[type=email], input[type=password], input[type=text], input[type=number], select, textarea {
    width:100%; padding:12px 14px; font-family:inherit; font-size:14px;
    background:#fafafa; border:1px solid var(--border); border-radius:12px; outline:none;
    transition:.2s ease; color:var(--text);
  }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); background:#fff; }
  textarea { resize:vertical; min-height:90px; line-height:1.55; }

  .username-box {
    background:#fff0eb; border:1px solid var(--accent); border-radius:12px;
    padding:14px 16px; display:flex; align-items:center; gap:12px;
  }
  .username-box .u { font-weight:900; font-size:16px; color:#5a1e0c; flex:1; word-break:break-all; }
  .username-box .reroll { background:transparent; border:0; color:var(--accent-dark); font-weight:800; font-size:12px; cursor:pointer; font-family:inherit; padding:0; }
  .username-box .reroll:hover { text-decoration:underline; }
  .username-note { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }

  .bio-counter { font-size:11px; color:var(--muted); text-align:right; margin-top:4px; }
  .bio-counter.over { color:#c2410c; }

  .check-row { display:flex; align-items:flex-start; gap:10px; margin-top:16px; }
  .check-row input[type=checkbox] { margin-top:3px; }
  .check-row label { margin:0; text-transform:none; letter-spacing:0; font-weight:600; font-size:13px; color:#333; }

  .pw-rules { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .pw-rules .ok { color:#16a34a; font-weight:700; }
  .pw-rules .no { color:#aaa; }

  .turnstile-wrap { margin:22px 0 10px; min-height:65px; }

  .submit-btn {
    width:100%; padding:15px 20px; background:var(--accent); color:#fff; border:0;
    border-radius:50px; font-family:inherit; font-weight:900; font-size:14px; letter-spacing:.3px;
    cursor:pointer; transition:.2s ease; margin-top:8px;
  }
  .submit-btn:hover:not(:disabled) { background:var(--accent-dark); }
  .submit-btn:disabled { opacity:.6; cursor:not-allowed; }

  .status { margin-top:16px; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.55; display:none; }
  .status.show { display:block; }
  .status.err  { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
  .status.info { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
  .status.ok   { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }

  .alt { text-align:center; margin-top:22px; font-size:13px; color:#666; }
  .alt a { color:var(--accent-dark); font-weight:800; text-decoration:none; }
  .alt a:hover { text-decoration:underline; }

  @media (max-width:600px) {
    .signup-card { padding:26px 20px; border-radius:15px; }
    .signup-title { font-size:26px; }
    .header-inner { padding:13px 15px; flex-wrap:wrap; }
    .logo { font-size:21px; }
    .nav-link { font-size:11px; padding:7px 11px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">The <span>Whacky</span> Rack</a>
    <div class="header-right">
      <a href="index.html" class="nav-link">Shop</a>
      <a href="world.html" class="nav-link">World</a>
      <a href="history.html" class="nav-link">History</a>
      <a href="about.html" class="nav-link">About</a>
    </div>
  </div>
</header>

<main class="signup-wrap">
  <div class="signup-card">
    <h1 class="signup-title">Join <span>the cult</span></h1>
    <p class="signup-sub">Create an account to Yap, Tape, and build your public profile.</p>

    <form id="signup-form" novalidate>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <div class="pw-rules" id="pw-rules">
        <span class="no" data-rule="len">8+ chars</span> ·
        <span class="no" data-rule="upper">Uppercase</span> ·
        <span class="no" data-rule="num">Number</span> ·
        <span class="no" data-rule="sym">Special char</span>
      </div>

      <label for="country" class="optional">Country</label>
      <input id="country" type="text" placeholder="Detecting…" autocomplete="country-name">

      <label>Username</label>
      <div class="username-box">
        <span class="u" id="username-preview">…</span>
        <button type="button" class="reroll" id="reroll">↻ reroll</button>
      </div>
      <div class="username-note">This is who you are. Usernames are locked at signup and cannot be changed.</div>

      <label for="gender" class="optional">Gender</label>
      <select id="gender">
        <option value="">Prefer not to say</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>

      <label for="age" class="optional">Age</label>
      <input id="age" type="number" min="18" max="120" inputmode="numeric">

      <label for="bio">Bio</label>
      <textarea id="bio" minlength="20" placeholder="At least 20 characters. What kind of weird are you?" required></textarea>
      <div class="bio-counter" id="bio-counter">0 / 200 words</div>

      <div class="check-row">
        <input id="adult" type="checkbox" required>
        <label for="adult">I confirm I am 18 years or older.</label>
      </div>

      <div class="turnstile-wrap">
        <div id="turnstile-container"></div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn" disabled>Create account</button>

      <div class="status" id="status"></div>
    </form>

    <p class="alt">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(function () {
  const sb = window.wr.sb;

  const TURNSTILE_SITE_KEY = "YOUR_TURNSTILE_SITE_KEY";

  const form = document.getElementById("signup-form");
  const emailEl = document.getElementById("email");
  const pwEl = document.getElementById("password");
  const countryEl = document.getElementById("country");
  const genderEl = document.getElementById("gender");
  const ageEl = document.getElementById("age");
  const bioEl = document.getElementById("bio");
  const adultEl = document.getElementById("adult");
  const usernamePreview = document.getElementById("username-preview");
  const rerollBtn = document.getElementById("reroll");
  const pwRules = document.getElementById("pw-rules");
  const bioCounter = document.getElementById("bio-counter");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");
  const turnstileContainer = document.getElementById("turnstile-container");

  let captchaToken = null;
  let turnstileWidgetId = null;
  let currentUsername = null;

  /* ---------- Country auto-detect ---------- */
  (async () => {
    try {
      const r = await fetch("https://ipapi.co/json/");
      const d = await r.json();
      if (d && d.country_name) countryEl.value = d.country_name;
      else if (d && d.country_code) countryEl.value = d.country_code;
      else countryEl.placeholder = "Enter your country";
    } catch {
      countryEl.placeholder = "Enter your country";
    }
  })();

  /* ---------- Username via RPC ---------- */
  async function rollUsername() {
    usernamePreview.textContent = "…";
    const { data, error } = await sb.rpc("generate_username");
    if (error || !data) {
      usernamePreview.textContent = "unavailable";
      status("Could not generate a username. Please refresh.", "err");
      return;
    }
    currentUsername = data;
    usernamePreview.textContent = data;
    validate();
  }
  rollUsername();
  rerollBtn.addEventListener("click", rollUsername);

  /* ---------- Password rules ---------- */
  const rules = {
    len:   v => v.length >= 8,
    upper: v => /[A-Z]/.test(v),
    num:   v => /[0-9]/.test(v),
    sym:   v => /[^A-Za-z0-9]/.test(v)
  };
  pwEl.addEventListener("input", () => {
    const v = pwEl.value;
    Object.entries(rules).forEach(([k, fn]) => {
      const span = pwRules.querySelector(`[data-rule="${k}"]`);
      span.className = fn(v) ? "ok" : "no";
    });
    validate();
  });

  /* ---------- Bio counter ---------- */
  bioEl.addEventListener("input", () => {
    const words = bioEl.value.trim().split(/\s+/).filter(Boolean).length;
    bioCounter.textContent = `${words} / 200 words`;
    bioCounter.classList.toggle("over", words > 200);
    validate();
  });

  [emailEl, countryEl, adultEl].forEach(el =>
    el.addEventListener("input", validate)
  );

  function validate() {
    const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailEl.value);
    const pwOk = Object.values(rules).every(fn => fn(pwEl.value));
    const bioWords = bioEl.value.trim().split(/\s+/).filter(Boolean).length;
    const bioOk = bioEl.value.trim().length >= 20 && bioWords <= 200;
    const adultOk = adultEl.checked;
    const userOk = !!currentUsername;
    submitBtn.disabled = !(emailOk && pwOk && bioOk && adultOk && userOk && captchaToken);
  }

  /* ---------- Turnstile ---------- */
  function initTurnstile() {
    if (typeof turnstile === "undefined") return setTimeout(initTurnstile, 200);
    turnstileWidgetId = turnstile.render(turnstileContainer, {
      sitekey: TURNSTILE_SITE_KEY,
      callback: (token) => { captchaToken = token; validate(); },
      "expired-callback": () => { captchaToken = null; validate(); },
      "error-callback": () => { captchaToken = null; validate(); }
    });
  }
  initTurnstile();

  /* ---------- Status ---------- */
  function status(msg, kind = "info") {
    statusEl.className = `status show ${kind}`;
    statusEl.textContent = msg;
  }
  function clearStatus() { statusEl.className = "status"; statusEl.textContent = ""; }

  /* ---------- Submit ---------- */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearStatus();

    if (!captchaToken) { status("Please complete the CAPTCHA.", "err"); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating…";

    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const { data, error } = await sb.auth.signUp({
      email: emailEl.value.trim(),
      password: pwEl.value,
      options: {
        captchaToken,
        data: {
          username: currentUsername,
          country: countryEl.value.trim() || null,
          gender: genderEl.value || null,
          age: ageEl.value ? parseInt(ageEl.value, 10) : null,
          bio: bioEl.value.trim(),
          timezone
        }
      }
    });

    if (error) {
      console.error(error);
      status(error.message || "Signup failed.", "err");
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
      if (typeof turnstile !== "undefined" && turnstileWidgetId !== null) {
        turnstile.reset(turnstileWidgetId);
        captchaToken = null;
      }
      return;
    }

    status("Welcome to the cult. Redirecting…", "ok");
    setTimeout(() => { window.location.href = "profile.html"; }, 600);
  });
})();
</script>
</body>
</html>
